# Logrotate configuration for HPC cluster setup logs
# Install: sudo cp logrotate_cluster.conf /etc/logrotate.d/cluster-setup

/var/log/cluster_*.log
/var/log/cluster_setup/*.log
/var/log/slurm/node_reboot.log
{
    daily
    missingok
    rotate 7
    compress
    delaycompress
    notifempty
    copytruncate
    maxsize 50M
}
