# ============================================================================
# Virtual IP (VIP) Configuration
# ============================================================================
network:
  management_network: 10.228.0.0/16
  compute_network: 10.228.128.0/16
  vip:
    address: 10.228.128.100
    netmask: 16
    interface: ens18
    vrrp_router_id: 51
    auth_password: hpc_cluster_vip_secret
  firewall:
    enabled: true
    ports:
      slurmd: 6818
      slurmctld: 6817
      slurmdbd: 6819
      auth_backend: 4430
      auth_frontend: 4431
      dashboard_backend: 5010
      websocket: 5011
      cae_backend: 5000
      cae_automation: 5001
      dashboard_frontend: 5173
      app_frontend: 5174
      mariadb: 3306
      redis: 6379
      glusterd: 24007
      glusterd_mgmt: 24008
      gluster_brick_start: 49152
      gluster_brick_end: 49156
      prometheus: 9090
      node_exporter: 9100
      mariadb_exporter: 9104
      redis_exporter: 9121
      ssh: 22
      http: 80
      https: 443
      vrrp: 112

# ============================================================================
# Shared Storage Configuration (GlusterFS)
# ============================================================================
shared_storage:
  type: glusterfs
  glusterfs:
    volume_name: shared_data
    volume_type: replica
    replica_count: auto
    brick_path: /scratch/glusterfs/brick
    mount_point: /mnt/gluster
    options:
      performance.cache-size: 256MB
      network.ping-timeout: 10
      cluster.self-heal-daemon: enable
    directories:
      - frontend_builds
      - slurm/state
      - slurm/logs
      - slurm/spool
      - uploads
      - config
  backup:
    enabled: true
    path: /var/backups/cluster
    schedule:
      full_backup: "0 2 * * *"
      incremental: "0 * * * *"
    retention:
      daily: 7
      weekly: 4
      monthly: 12
    items:
      - configs
      - databases
      - slurm_state
      - glusterfs_meta

# ============================================================================
# Database Configuration (MariaDB Galera Cluster)
# ============================================================================
database:
  enabled: true
  type: mariadb-galera
  mariadb:
    version: "10.6"
    root_password: "Soseks314!"
    sst_user: sst_sync
    sst_password: "Soseks314!"
    galera:
      cluster_name: hpc_portal_cluster
      sst_method: rsync
      cluster_address: auto
      slave_threads: 4
    databases:
      - name: slurm_acct_db
        user: slurm
        password: "${DB_SLURM_PASSWORD}"
      - name: auth_portal
        user: auth_user
        password: "${DB_AUTH_PASSWORD}"
    config:
      max_connections: 500
      innodb_buffer_pool_size: 8G
      innodb_log_file_size: 512M

# ============================================================================
# Redis Cluster Configuration
# ============================================================================
redis:
  enabled: true
  type: cluster
  cluster:
    port: 6379
    password: "${REDIS_PASSWORD}"
    cluster_mode: true
    replicas: 0
    nodes: auto
    cluster_node_timeout: 5000
    appendonly: yes
    appendfsync: everysec
    maxmemory: 4gb
    maxmemory_policy: allkeys-lru

# ============================================================================
# Slurm Configuration
# ============================================================================
slurm_config:
  version: "23.11.10"
  install_path: /usr/local/slurm
  bin_path: /usr/local/slurm/bin
  config_path: /etc/slurm
  log_path: /mnt/gluster/slurm/logs
  spool_path: /var/spool/slurm
  state_save_location: /mnt/gluster/slurm/state
  multi_master:
    enabled: true
    controllers: auto
  accounting:
    storage_type: accounting_storage/slurmdbd
    storage_host: 127.0.0.1
    storage_port: 6819
  scheduler:
    type: sched/backfill
    max_job_count: 10000
    max_array_size: 1000
  partitions:
    - name: alpha
      nodes: icn401-0101-h[01-12],icn401-0102-h[01-12],icn401-0103-h[01-12],icn401-0104-h[01-12],icn401-0105-h[01-12],icn401-0106-h[01-12],icn401-0107-h[01-12],icn401-0108-h[01-12],icn401-0110-h[01-04]
      default: true
      max_time: "7-00:00:00"
      max_nodes: 100
      state: UP
    - name: beta
      nodes: icn401-0110-h[05-12],icn401-0111-h[01-12],icn401-0201-h[01-12],icn401-0202-h[01-12],icn401-0203-h[01-12],icn401-0204-h[01-12],icn401-0205-h[01-12],icn401-0206-h[01-12],icn401-0207-h[01-08]
      default: false
      max_time: "7-00:00:00"
      max_nodes: 100
      state: UP
    - name: gamma
      nodes: icn401-0207-h[09-12],icn401-0208-h[01-12],icn401-0210-h[01-12],icn401-0211-h[01-12],icn401-0301-h[01-12],icn401-0302-h[01-12],icn401-0303-h[01-12],icn401-0304-h[01-12],icn401-0305-h[01-12]
      default: false
      max_time: "7-00:00:00"
      max_nodes: 100
      state: UP
    - name: share
      nodes: icn401-0306-h[01-12],icn401-0307-h[01-12],icn401-0308-h[01-12],icn401-0401-h[01-05],icn401-0402-h[01-05]
      default: false
      max_time: "7-00:00:00"
      max_nodes: 46
      state: UP
    - name: viz
      nodes: icn401-0401-h[06-10],icn401-0402-h[06-10]
      default: false
      max_time: "60-00:00:00"
      max_nodes: 10
      state: UP
      gres: gpu:nvidia:2
      exclusive: false

# ============================================================================
# Web Services Configuration
# ============================================================================
web_services:
  enabled: true
  service_user: koopark
  service_group: koopark
  shared_config_path: /mnt/gluster/config
  frontend_build_path: /mnt/gluster/frontend_builds
  services:
    - name: auth_portal
      port: 4430
      type: backend
      health_check: /health
    - name: auth_frontend
      port: 4431
      type: frontend
      build_path: auth_frontend_4431
    - name: dashboard_backend
      port: 5010
      type: backend
      health_check: /health
    - name: websocket
      port: 5011
      type: backend
      websocket: true
    - name: cae_backend
      port: 5000
      type: backend
      health_check: /health
    - name: cae_automation
      port: 5001
      type: backend
      health_check: /health
    - name: dashboard_frontend
      port: 5173
      type: frontend
      build_path: dashboard_5173
    - name: app_frontend
      port: 5174
      type: frontend
      build_path: app_5174

# ============================================================================
# High Availability Configuration
# ============================================================================
high_availability:
  keepalived:
    enabled: true
    health_check:
      script: /usr/local/bin/check_all_services.sh
      interval: 2
      weight: -20
      fall: 3
      rise: 2
    notifications:
      master: /usr/local/bin/notify_master.sh
      backup: /usr/local/bin/notify_backup.sh
      fault: /usr/local/bin/notify_fault.sh
  auto_recovery:
    enabled: true
    galera:
      enabled: true
      script: /opt/hpc-dashboard/cluster/utils/galera_auto_recover.sh
    redis:
      enabled: true
      rebalance_on_join: true

# ============================================================================
# Monitoring & Alerting
# ============================================================================
monitoring:
  prometheus:
    enabled: true
    port: 9090
    retention_days: 30
    scrape_interval: 15s
  node_exporter:
    enabled: true
    port: 9100
  mariadb_exporter:
    enabled: true
    port: 9104
  redis_exporter:
    enabled: true
    port: 9121
  grafana:
    enabled: true
    port: 3000
    admin_password: "${GRAFANA_PASSWORD}"
  alerting:
    enabled: true
    channels:
      - type: slack
        webhook_url: "${SLACK_WEBHOOK_URL}"
        channel: "#hpc-alerts"
      - type: email
        smtp_host: smtp.gmail.com
        smtp_port: 587
        from: alerts@hpc.local
        to: admin@hpc.local
    rules:
      - alert: NodeDown
        duration: 30s
        severity: critical
      - alert: HighCPU
        threshold: 90
        duration: 5m
        severity: warning
      - alert: HighDisk
        threshold: 80
        duration: 1m
        severity: warning
      - alert: GaleraNodeDown
        duration: 10s
        severity: critical
      - alert: VIPFailover
        duration: 0s
        severity: info

# ============================================================================
# User & Security Configuration
# ============================================================================
users:
  admin_user: admin
  slurm_user: slurm
  slurm_uid: 64001
  slurm_gid: 64001
  munge_user: munge
  munge_uid: 64002
  munge_gid: 64002
  cluster_users:
    - username: user01
      uid: 65001
      gid: 65001
      groups: [users, hpc]

security:
  munge:
    key_rotation_days: 30
  selinux:
    enabled: true
    mode: permissive
  jwt:
    secret_key: "${JWT_SECRET_KEY}"
    algorithm: HS256
    expiration_hours: 8

# ============================================================================
# Cgroup Resource Control
# ============================================================================
cgroup:
  enabled: true
  constrain_ram: true
  constrain_swap: true
  constrain_devices: true      # 디바이스 제한 - GPU 접근 제어 (ConstrainDevices)
  constrain_cores: true
  allowed_ram_percent: 100
  allowed_swap_percent: 0

# ============================================================================
# Container & GPU Support
# ============================================================================
container_support:
  apptainer:
    enabled: true
    version: 1.2.5
    install_path: /usr/local
    image_path: /share/apptainer/images
    cache_path: /tmp/apptainer
    bind_paths: [/home, /share, /scratch, /tmp]
    sif_deployment_mode: update
    deployment_strategy: local_copy
    master_images_path: /scratch/apptainers
    node_local_path: /scratch/apptainers

gpu_computing:
  nvidia:
    enabled: true
    nodes:
      - icn401-0401-h06
      - icn401-0401-h07
      - icn401-0401-h08
      - icn401-0401-h09
      - icn401-0401-h10
      - icn401-0402-h06
      - icn401-0402-h07
      - icn401-0402-h08
      - icn401-0402-h09
      - icn401-0402-h10
  amd:
    enabled: false
    nodes: []

# ============================================================================
# Dynamic Clustering Options
# ============================================================================
clustering:
  auto_discovery:
    enabled: true
    timeout: 5
    health_check_interval: 30
  auto_join:
    enabled: true
  node_management:
    allow_dynamic_add: true
    allow_dynamic_remove: true
    min_controllers: 1
    max_controllers: 10
  status_format: table

# ============================================================================
# Environment Variables (Template)
# ============================================================================
environment:
  DB_ROOT_PASSWORD: "Soseks314!"
  DB_SST_PASSWORD: "Soseks314!"
  DB_SLURM_PASSWORD: "Soseks314!"
  DB_AUTH_PASSWORD: "Soseks314!"
  REDIS_PASSWORD: "Soseks314!"
  JWT_SECRET_KEY: "Soseks314!"
  GRAFANA_PASSWORD: "Soseks314!"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

# ============================================================================
# Installation & Deployment
# ============================================================================
installation:
  install_method: package
  offline_mode: true
  offline_package_dir: "./offline_packages_2404"  # Ubuntu 24.04
  package_cache_path: /var/cache/cluster_packages
  auto_confirm: false
  skip_munge: false
  skip_slurm_base: false
  install_mpi: false
  install_apptainer: false
  timeouts:
    cluster_join_wait: 300
    service_start_wait: 30
    ssh_timeout: 10
    health_check_interval: 10
  phases:
    phase0_storage: true
    phase1_database: true
    phase2_redis: true
    phase3_slurm: true
    phase4_keepalived: true
    phase5_web: true
    phase6_monitoring: true

# ============================================================================
# Time Synchronization
# ============================================================================
time_synchronization:
  enabled: true
  ntp_servers:
    - 10.228.128.100         # 내부 NTP (컨트롤러 VIP)
    - time.google.com
    - time.cloudflare.com
    - pool.ntp.org
  timezone: Asia/Seoul

# ============================================================================
# Web/SSL Settings
# ============================================================================
web:
  public_url: "10.228.128.100"
  ssl:
    mode: self_signed
    domain: ""
    email: ""

# ============================================================================
# SSO Configuration (SAML / OIDC)
# ============================================================================
sso:
  enabled: false
  type: saml
  saml:
    idp_metadata_url: ""
    idp:
      entity_id: ""
      sso_url: ""
      slo_url: ""
      certificate: ""
    sp:
      entity_id: "hpc-dashboard"
  oidc:
    issuer: ""
    client_id: ""
    client_secret: ""
    scopes:
      - openid
      - profile
      - email
      - groups
    requested_claims: []
  attribute_mapping:
    username: "uid"
    email: "email"
    groups: "groups"
    display_name: "displayName"
    department: "department"
  group_permissions:
    "HPC-Admins":
      - dashboard
      - cae
      - vnc
      - app
      - admin
    "DX-Users":
      - dashboard
      - vnc
      - app
    "CAEG-Users":
      - dashboard
      - cae
      - vnc
      - app

# ============================================================================
# SAML IdP Test Users
# ============================================================================
saml:
  test_users:
    - username: koopark
      password: "Soseks314!"
