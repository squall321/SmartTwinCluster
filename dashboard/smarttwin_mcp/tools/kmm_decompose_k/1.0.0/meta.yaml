name: kmm_decompose_k
version: 1.0.0
summary: KooMeshModifier DECOMPOSE_K — 모델을 그룹별 include 파일 세트로 분해 (master.k + groups/*.k)
description: |
  모델을 그룹별 include 파일 세트로 분해 (master.k + groups/*.k)

  # 언제 쓰나
  - 큰 모델을 파트 그룹별 파일로 나눠 관리·교체할 때

  # 옵션 블록 문법 (KooMeshModifier --help DECOMPOSE_K)
  ```text
  **DecomposeK,<ID>
  Group,<그룹이름>,<파트이름 또는 glob>...
  GroupFromFile,<그룹이름>,<목록파일>
  OutputDir,<폴더>
  **End
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `Group` | 이름,멤버... | - | 멤버는 PART 제목(이름). * ? [] 가 있으면 glob. 먼저 적은 그룹이 우선 |
  | `GroupFromFile` | 이름,파일 | - | 파일에 멤버를 줄/쉼표로 |
  | `OutputDir` | 경로 | - | 출력 폴더 |
  | `DefaultGroupName` | 문자 | default | 어느 그룹에도 안 든 파트 |
  | `GroupsSubdir` | 문자 | groups | 그룹 파일 하위 폴더 |
  | `SeparateMaterials` | True/False | False | 그룹별 재료 분리 |
  | `SharedNodesPolicy` | duplicate 등 | duplicate | 그룹 경계 공유 절점 처리 |
  | `EmitGroupSets` | True/False | True | 그룹 SET 출력 |
  | `ModelIndependentSplit` | True/False | - | controls.k 와 globals.k 분리 |
  | `GroupBoundaryPolicy` | inline 등 | inline | 그룹 간 요소 처리 |

  # 사례 — 하우징·배터리 두 그룹으로 분해
  ```text
  *Inputfile
  MinimumModel.k
  *Mode
  DECOMPOSE_K,1
  **DecomposeK,1
  Group,housing,HOUSING*,COVER
  Group,battery,BATTERY_CELL,BATTERY_CAN
  OutputDir,decomposed_output
  SharedNodesPolicy,duplicate
  ModelIndependentSplit,True
  **End
  *End
  ```
  - 결과: decomposed_output/master.k, controls.k, materials.k, groups/housing.k ... decompose_manifest.json
  - 되돌리기는 master.k 를 *Inputfile 로 MERGE_K.

  # 주의
  - 멤버는 PID 가 아니라 PART 제목과 비교한다.
  - 이 모드 블록은 빈 줄·`$` 줄을 건너뛴다.

  관련 모드: MERGE_K, IMPORT_MERGE_K

  # MCP 로 부르는 법
  - model_path 를 주면 옵션 파일 `*Inputfile` / `*Mode DECOMPOSE_K,1` / `**DecomposeK,1` … `**EndDecomposeK` 을 만들어 준다.
  - options 의 `키: 값` 과 lines 의 원문 줄이 블록 안에 들어간다(options 먼저).
  - 키는 부분 문자열로 찾는 모드가 많고 모르는 키는 조용히 무시된다 — 위 표의 키 이름을 그대로 쓸 것.
  - 단위는 모델 .k 를 따른다(KooMeshModifier 는 변환하지 않는다).
  - 여러 모드를 한 번에: `kmm_chain`.

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  # 옵션 파일 형식 (요약)
      KooMeshModifier 는 LS-DYNA .k 모델과 옵션 파일(.txt) 하나를 받아 수정된 .k 를 만든다.

        *Inputfile                         다음 줄에 모델 파일명 (옵션 파일 폴더 기준 상대경로)
        model.k
        *RunDirectoryMode,True,Data/Results[,Data/Metadata]   (선택) 결과를 Run_<시각>_<해시>/ 폴더에
        *Info,<모델이름>,<단계>                (선택) 메타데이터
        *Description,<설명>                   (선택)
        *Creator,<이름>,<메일>,<그룹>,<팀>      (선택)
        *PreserveIncludes                    (선택) 다음 줄들 = 원문 그대로 둘 *INCLUDE 파일 패턴
        *Mode                                실행할 모드 목록, 한 줄에 하나 `모드이름,모드ID`
        DROP_ATTITUDE,1
        **DropAttitude,1                     모드별 옵션 블록 — 헤더 뒤 숫자가 *Mode 의 모드ID 와 짝
        Key,Value
        **EndDropAttitude                    `**End` 로 시작하는 줄이면 블록 종료 (**End 만 써도 됨)

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- koomeshmodifier
- kmm
- preprocess
- lsdyna
- decompose
- include
- split
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 옵션 파일 확인
  args:
    model_path: /data/single/USER/case/model.k
    dry_run: true
    lines: &id001
    - Group,housing,HOUSING*,COVER
    - Group,battery,BATTERY_CELL,BATTERY_CAN
    - OutputDir,decomposed_output
    - SharedNodesPolicy,duplicate
    - ModelIndependentSplit,True
- title: 제출하고 5분까지 기다리기
  args:
    model_path: /data/single/USER/case/model.k
    dry_run: false
    lines: *id001
    wait_sec: 300
    slurm:
      cpus_per_task: 4
      mem: 16G
