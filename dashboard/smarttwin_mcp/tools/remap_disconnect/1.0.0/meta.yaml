name: remap_disconnect
version: 1.0.0
summary: KooRemapper disconnect — Decohere conformal mesh interface for fracture modeling by splitting
  shared nodes at part boundaries.
description: |
  Decohere conformal mesh interface for fracture modeling by splitting shared nodes at part boundaries.

  Duplicates shared nodes at part boundaries to create discontinuous interfaces for fracture and cohesive zone modeling. Three modes: full (peridynamics), czm (cohesive zone elements), mefem (mesh-free enrichment). Primarily used with LS-DYNA fracture analysis.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `config` | config | 예 | Complete YAML configuration object with base_model, output, and operations array |

  # config 키 (YAML)
  - `None` (enum): Operation type; must be 'disconnect'
  - `None` (integer): Part ID to disconnect; 0 = all parts; specifies which solids/shells participate in interface detection
  - `None` (enum): Disconnection mode: full = dupes all nodes of target elements (no cohesive); czm = dupes interface nodes + creates 8-node cohesive elements (ELFORM=19) + *MAT_COHESIVE_MIXED_MODE; mefem = dupes interface nodes + inserts *CONSTRAINED_TIED_NODES_FAILURE tied node groups
  - `None` (integer): Output part ID for generated cohesive elements (czm/mefem mode); 0 = auto-generate new PID; used in czm mode to define *PART for cohesive zone interface elements, and in mefem mode (appears in code path but not actively used for part creation)
  - `None` (number): Failure strain threshold (mefem mode only); sets EPPF parameter in *CONSTRAINED_TIED_NODES_FAILURE for mesh-free element erosion; 0 = no erosion; only applies to mefem mode
  - `None` (boolean): Optional, default false (since 2026-10-17). When the model *INCLUDEs other files, read the whole closure flattened into one standalone deck — each *INCLUDE card replaced by its file's body in LS-DYNA reading order, the include files' *KEYWORD lines dropped — and write the result as one file without *INCLUDE. Without it the op edits only the main deck and stops with exit code 1 (naming this key) when its target parts, materials or cards live only inside an include. Refused when the closure cannot be read completely, has a cycle, or an *INCLUDE + / - or an include *KEYWORD changes the field width.

  # 주의
  - MUTUALLY_EXCLUSIVE: mode=full vs czm/mefem. Full mode ignores cohesive_part_id and failure_strain. CZM mode requires inter-part faces (different PIDs sharing mesh faces); fails if no boundaries found. MEFEM mode currently inserts *ELEMENT_CONSTRAINT_DISTRIBUTED_COUPLE (not shown in example yet). IMPORTANT: disconnect is EMBEDDED in operations[] array within assemble command; it is not a standalone CLI command. target_pid=0 means all PIDs participate in active element detection, but only inter-part boundaries trigger node duplication in czm/mefem. Full mode creates new nodes for ALL elements in target_pid, regardless of boundaries. Both solid (HEX8/TET4/PENTA6) and shell (QUAD4) elements supported. Duplicate nodes are collocated (same XYZ) at original position — separation is by part connectivity only, not physical offset.

  YAML INPUT — COMMON RULES:
  ---
  - A leading UTF-8 BOM is ignored, so a config saved by a Windows editor (Notepad) works as-is.
  - A TAB used for INDENTATION anywhere in the file is rejected with rc=1 — `[ERROR] [<op>] YAML 들여쓰기에 탭을 쓸 수 없습니다 (공백을 쓰세요): <n>번째 줄: <line>`. The whole file is scanned, so a tab under a key this op never reads fails too; configs that used to run with rc=0 can now fail. Tabs inside a quoted value are kept, but a tab that starts a line inside a `|`/`>` literal block (material_card, czm_material_card, material_cards) is rejected, because the parser would otherwise drop that card line silently.
  - The tab scan is skipped when the config arrives on a stream that cannot be rewound (pipe, process substitution, /dev/stdin); such input reaches the parser unchecked.
  - RELATIVE PATHS: a path given on the COMMAND LINE is relative to the current working directory. A relative path INSIDE the YAML — with or without a folder part (`box.k` and `../data/box.k` alike) — is relative to the folder that holds that YAML file, and never falls back to the working directory. Absolute paths (leading `/` or `\`, or an `X:` drive letter) are used as-is.

  INCLUDE CLOSURE (since 2026-10-17): this op edits only the main deck. If its targets live only inside an *INCLUDE it stops with exit code 1 and names flatten_includes; with flatten_includes: true it reads the closure flattened into one standalone deck and writes one file without *INCLUDE (measured: the same output as the unsplit deck). For an all-parts run on a master deck whose own parts are in the main file, the parts inside includes are left alone and a warning says so.

  사례 메모: Example uses two_hex_2part.k from examples/disconnect. Mode 'czm' requires cohesive_part_id and optionally failure_strain. Mode 'full' splits all nodes without cohesive elements. Mode 'mefem' adds peridynamic elements and supports failure_strain.

  # MCP 로 부르는 법
  - 인자는 `KooRemapper disconnect` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- mesh
- disconnect
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    config: &id001
      base_model: two_hex_2part.k
      output: disconnect_czm_result
      operations:
      - type: disconnect
        mode: czm
        target_pid: 0
        cohesive_part_id: 99
        failure_strain: 0.5
    dry_run: true
    extra_inputs: &id002
    - /data/single/USER/case/two_hex_2part.k
- title: 제출하고 5분까지 기다리기
  args:
    config: *id001
    dry_run: false
    extra_inputs: *id002
    wait_sec: 300
