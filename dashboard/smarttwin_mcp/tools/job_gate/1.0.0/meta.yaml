name: job_gate
version: 1.0.0
summary: KooChainRun gate — 덱 관문(gate_report.json). canary 를 주면 이미 돈 카나리아 DOE 를 본다. 거절이면 rc 1
description: |
  캠페인 덱을 관문으로 본다(제출 전 점검 — canary 를 주면 이미 돈 카나리아 DOE 의 런을 본다).
  보고는 결과 폴더의 gate_report.json. 거절이면 ok:false 와 rc 1.

  # 쓰는 법
  - registry_id·job_id·work_dir 중 하나. 캠페인 폴더는 호출자 영역(/data/single/<사용자>/) 안이어야 한다(PAT 필요).
  ⚠ KooChainRun `gate` 은 SmartTwinPreprocessor v141 이상에만 있다. 이 헤드의 KooChainRun 에 명령이 없으면
  실행하지 않고 `koochainrun_outdated` 로 거절한다(운영 헤드가 낮은 판일 수 있다).
tags: [koochainrun, gate, deck, canary, precheck, mode-own]
transport: {kind: local, shell: /bin/bash, timeout_sec: 900}
expose: catalog
examples:
  - title: registry_id 로
    args: {"registry_id": 42}
  - title: 카나리아 DOE 를 보고
    args: {"registry_id": 42, "canary": "1,5,10"}
