name: kmm_drop_attitude
version: 1.0.0
summary: KooMeshModifier DROP_ATTITUDE — 제품 낙하 해석 덱 생성 — 자세(오일러각)·높이·바닥판·접촉 자동 구성
description: |
  제품 낙하 해석 덱 생성 — 자세(오일러각)·높이·바닥판·접촉 자동 구성

  # 언제 쓰나
  - 모델을 지정 자세로 돌려 바닥판 위 높이에 두고 낙하 속도·중력·접촉·CONTROL 을 붙인 해석 덱이 필요할 때
  - 여러 자세를 한 번에 — 각 리스트 키에 값을 같은 개수로 나열하면 i 번째 값끼리 한 케이스가 된다

  # 옵션 블록 문법 (KooMeshModifier --help DROP_ATTITUDE)
  ```text
  **DropAttitude,<ID>
  EulerRolling,<도>[,<도>...]   (리스트 키는 모두 같은 개수)
  ...
  **EndDropAttitude
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `EulerRolling` (필수) | 실수 리스트 | - | X 축 회전(도). 여러 값 = 여러 케이스 |
  | `EulerPitching` (필수) | 실수 리스트 | - | Y 축 회전(도) |
  | `EulerYawing` (필수) | 실수 리스트 | - | Z 축 회전(도) |
  | `Height` (필수) | 실수 리스트 | - | 낙하 높이 → 초기 속도 √(2gh) 가 InitialVelocity 에 더해진다 (모델은 OffsetDistance 간격에 놓임). g 는 Gravity 키, 없으면 모델 재질 밀도로 단위계 판정 (ton-mm-s → 9810, kg-m-s → 9.81) |
  | `Gravity` | 실수 | 모델 재질 밀도로 판정 | 자유낙하 g (모델 단위). 재질 밀도 중앙값 < 1e-7 → 9810, 100~1e5 → 9.81. 그 밖(kg-mm-ms·g-cm-s·g-mm-ms 등)은 WARNING 후 옛 추정 → 반드시 지정 |
  | `InitialVelocityX/Y/Z` (필수) | 실수 리스트 | - | 추가 초기 속도 (각 케이스). Height 속도와 합산 |
  | `InitialAngularVelocityX/Y/Z` (필수) | 실수 리스트 | - | 초기 각속도 (각 케이스) |
  | `OffsetDistance` (필수) | 실수 | - | 바닥판과의 초기 간격 |
  | `Density` (필수) | 실수 | - | 바닥판 밀도 (RigidWall 이면 쓰지 않지만 키는 필요) |
  | `YoungsModulus` (필수) | 실수 | - | 바닥판 탄성계수 |
  | `PoissonRatio` (필수) | 실수 | - | 바닥판 포아송비 |
  | `tFinal` | 실수 | 0 (필수로 줄 것) | 종료 시간. tFinal 과 dt 가 둘 다 0 이 아니어야 CONTROL/DATABASE 카드를 쓴다 |
  | `dt` | 실수 | 0 (필수로 줄 것) | d3plot 출력 간격 (키 이름 정확히 dt) |
  | `DTMIN` | 실수 | 없음 | CONTROL_TERMINATION DTMIN — dt 붕괴 시 자동 종료 비율 |
  | `DropSurface` | 형식별 | Plane,0,0,0,10,10,10 | Plane,Lx,Ly,Lz,Nx,Ny,Nz \| PlaneGraded,Lx,Ly,Lz,Nx,Ny,Nz[,외곽층수=5[,비율=1.5]] \| RigidWall,0,0,0,0,0,0 \| PlanewithRoughness,Lx,Ly,Lz,Nx,Ny,Nz,모드,Rmax,SF1[,SF2] |
  | `DeformableToRigid` | True/False | False | DEFORMABLE_TO_RIGID_AUTOMATIC 쌍 스위치(SWSET 20 code 2: 접촉력 0→강체 / SWSET 10 code 4: 접촉력 비0→변형체). 바닥판 접촉이 S2S 여야 켜진다(매뉴얼 Remark 1) — ConvertGeneralToSingleSurface=False 면 S2S 로 자동 선택 |
  | `D2RTime1/D2RTime2/D2RTime3` | 실수 | 0 / 1e20 / 0 | 전환 검사 시작·종료 시각, 전환 간 최소 간격(TIME3, 0 이면 채터) |
  | `D2RNrbf/D2RNcsf/D2RRwf` | 정수 | 0 | 카드2 NRBF/NCSF/RWF |
  | `D2RDtmax/D2ROffset` | 실수 | 0 | 강체 전환 시 최대 dt / OFFSET |
  | `D2RLrb` | 정수 | 0 | 전환 파트들을 합칠 선도 강체 파트 ID. 0 이면 파트별 독립 강체(파트 간 CNRB 가 있으면 Error 30164) |
  | `NonReflectingBoundary` | True/False | False | 바닥판 아랫면 BOUNDARY_NON_REFLECTING (응력파 흡수) |
  | `IncludeWallInGeneral` | True/False | False | 바닥판을 일반 접촉에 포함 |
  | `ConvertGeneralToSingleSurface` | True/False | True | 모델의 일반 접촉을 SINGLE_SURFACE 로 전환 |
  | `EnsureSingleSurface` | True/False | False | SINGLE_SURFACE 접촉이 없으면 생성 |
  | `DecomposeGeneralContact` | True/False | False | AUTOMATIC_GENERAL 을 파트쌍 접촉으로 자동 분해 |
  | `DecomposeContactMargin` | 실수 | 1.5 | 분해 시 bbox 여유 배율 |
  | `DecomposeContactAbsoluteMarginX/Y/Z` | 실수 | 5.0/5.0/0.5 | 분해 시 bbox 절대 여유 |
  | `RobustContact` | True/False | False | Tied 면 제외 Segment Set 으로 SINGLE_SURFACE 재구성 (SOFT=2, DEPTH=3 강제) |
  | `RobustContactTolerance` | 실수 | 0.1 | Tied 면 판정 거리 |
  | `RigidifySmallDtThreshold` | 실수 | 0 (끔) | 이 값보다 stable dt 가 작은 요소를 강체 파트로 분리 |
  | `RigidifyMaxAspectRatio` | 실수 | 0 (끔) | 종횡비가 이 값보다 큰 요소도 강체화 |
  | `RigidifyElementIDs` | 정수 리스트 | 없음 | 지정 요소를 강체화 |
  | `DropContact.<필드>` | 실수/문자 | SOFT=2 SOFSCL=0.1 SBOPT=3 DEPTH=35 ... | 바닥판 접촉 카드 필드 (FS, FD, SOFT, DTSTIF, DTPCHK, IGNORE 등). RigidWall 이면 FS·RWKSF·RW_SOFT·RW_MASS |
  | `DropContact.InheritGeneral` | True/False | False | 바닥판 접촉 FS~VSF·OptCardA 를 원본 AUTOMATIC_GENERAL 에서 상속 (명시값 > 원본 > 기본값). RobustContact 시 SOFT·DEPTH 는 강제값 |
  | `DropContact.Type` | General/SurfaceToSurface | General (D2R 시 S2S 자동) | ConvertGeneralToSingleSurface=False 경로의 바닥판 접촉 유형. 키는 type/Type 대소문자 무관 |
  | `DropContact.Scope` | Outer/All | Outer | 바닥판 접촉 slave 파트 범위 (Outer = bbox 외곽 10% 자동 선별) |
  | `TiedOptions.<필드>` | 실수/문자 | - | Tied 접촉 옵션. TiedOptions.ConvertToSegment,True 는 노드셋→세그먼트 변환 |
  | `ControlTimestep.<필드>` | 실수 | - | *CONTROL_TIMESTEP 덮어쓰기 (TSSFAC, DT2MS 등) |
  | `ControlHourglass.<필드>` | 실수 | - | *CONTROL_HOURGLASS 덮어쓰기 (IHQ, QH) |
  | `DynainDynamicRelaxation` | True/False | False | 누적 스텝용 동적 이완(DR) 블록 |
  | `DynainDynamicRelaxationNrcyck/Tol/Fctr/Term` | 수 | 0 | DR 파라미터 |
  | `runid` | 정수 리스트 | [] | 여러 케이스 중 실행할 케이스 번호만 선택 |

  # 사례 — 한 자세(피치 45°) 1.5 m 낙하, 메시 바닥판
  ```text
  *Inputfile
  model.k
  *Mode
  DROP_ATTITUDE,1
  **DropAttitude,1
  EulerRolling,0
  EulerPitching,45
  EulerYawing,0
  Height,1500
  InitialVelocityX,0
  InitialVelocityY,0
  InitialVelocityZ,0
  InitialAngularVelocityX,0
  InitialAngularVelocityY,0
  InitialAngularVelocityZ,0
  OffsetDistance,0.05
  Density,7.85e-09
  YoungsModulus,200000.0
  PoissonRatio,0.3
  tFinal,0.005
  dt,1e-06
  DropSurface,Plane,300,300,20,30,30,2
  **EndDropAttitude
  *End
  ```
  - [tonne, mm, s, MPa] 단위 모델 기준. Height 1500 = 1.5 m.
  - 결과: model_drop.k (INITIAL_VELOCITY·CONTROL_TERMINATION·DATABASE 카드 포함).

  # 사례 — 세 자세를 한 파일로 (정면·롤 90°·피치 90°), 강체벽 바닥
  ```text
  *Inputfile
  model.k
  *Mode
  DROP_ATTITUDE,1
  **DropAttitude,1
  EulerRolling,0,90,0
  EulerPitching,0,0,90
  EulerYawing,0,0,0
  Height,1000,1000,1000
  InitialVelocityX,0,0,0
  InitialVelocityY,0,0,0
  InitialVelocityZ,0,0,0
  InitialAngularVelocityX,0,0,0
  InitialAngularVelocityY,0,0,0
  InitialAngularVelocityZ,0,0,0
  OffsetDistance,0.05
  Density,7.85e-09
  YoungsModulus,200000.0
  PoissonRatio,0.3
  tFinal,0.003
  dt,5e-05
  DropSurface,RigidWall,0,0,0,0,0,0
  DropContact.FS,0.3
  DropContact.RWKSF,1.0
  **EndDropAttitude
  *End
  ```
  - 리스트 키의 i 번째 값끼리 케이스 i. 개수가 다르면 IndexError.
  - RigidWall 은 메시가 없는 무한 강체 평면 — 접촉 옵션은 DropContact.FS/RWKSF 로.

  # 사례 — KooChainRun 이 만드는 형태 — 등급 바닥판·견고 접촉·작은 dt 강체화·질량 스케일링
  ```text
  *Inputfile
  model.k
  *RunDirectoryMode,True,Data/Results
  *Mode
  DROP_ATTITUDE,1
  **DropAttitude,1
  EulerRolling,30
  EulerPitching,20
  EulerYawing,10
  Gravity,9810
  Height,1500
  InitialVelocityX,0
  InitialVelocityY,0
  InitialVelocityZ,0
  InitialAngularVelocityX,0
  InitialAngularVelocityY,0
  InitialAngularVelocityZ,0
  OffsetDistance,0.05
  Density,7.85e-09
  YoungsModulus,200000.0
  PoissonRatio,0.3
  tFinal,0.005
  dt,1e-05
  DropSurface,PlaneGraded,200,200,20,10,10,2,5,1.5
  RobustContact,True
  RobustContactTolerance,0.1
  RigidifySmallDtThreshold,1e-07
  DropContact.SOFT,2
  DropContact.DTSTIF,3e-08
  TiedOptions.ConvertToSegment,True
  ControlTimestep.DT2MS,-1e-07
  DTMIN,0.01
  **EndDropAttitude
  *End
  ```
  - *RunDirectoryMode 가 켜져 있어 결과는 Data/Results/Run_<시각>_<해시>/DropSet.k (Output/, DynamicRelaxation/ 폴더 함께).
  - RigidifySmallDtThreshold·DropContact.DTSTIF 처럼 이름에 dt 가 든 키도 dt 와 섞이지 않는다 (2026-09 수정).
  - ControlTimestep.DT2MS 음수 = 질량 스케일링 목표 dt.

  # 주의
  - Euler/Height/InitialVelocity/InitialAngularVelocity 10 개 리스트 키와 OffsetDistance·Density·YoungsModulus·PoissonRatio 는 빠지면 KeyError 로 멈춘다.
  - 블록 안 빈 줄에서 블록이 끝난다 — 뒤 키는 무시된다.
  - 오일러 회전 순서 R = Rz·Ry·Rx (롤 → 피치 → 요).
  - 누적 낙하·전각도 DOE 는 KooChainRun 시나리오로 돌리는 편이 낫다 (KooChainRun --help drop).

  관련 모드: DROP_WEIGHT_IMPACT_TEST, RIGIDIFY_SMALL_DT, DYNAIN_TO_INITIAL, PART_TRANSLATE

  # MCP 로 부르는 법
  - model_path 를 주면 옵션 파일 `*Inputfile` / `*Mode DROP_ATTITUDE,1` / `**DropAttitude,1` … `**EndDropAttitude` 을 만들어 준다.
  - options 의 `키: 값` 과 lines 의 원문 줄이 블록 안에 들어간다(options 먼저).
  - 키는 부분 문자열로 찾는 모드가 많고 모르는 키는 조용히 무시된다 — 위 표의 키 이름을 그대로 쓸 것.
  - 단위는 모델 .k 를 따른다(KooMeshModifier 는 변환하지 않는다).
  - 여러 모드를 한 번에: `kmm_chain`.

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  # 옵션 파일 형식 (요약)
      KooMeshModifier 는 LS-DYNA .k 모델과 옵션 파일(.txt) 하나를 받아 수정된 .k 를 만든다.

        *Inputfile                         다음 줄에 모델 파일명 (옵션 파일 폴더 기준 상대경로)
        model.k
        *RunDirectoryMode,True,Data/Results[,Data/Metadata]   (선택) 결과를 Run_<시각>_<해시>/ 폴더에
        *Info,<모델이름>,<단계>                (선택) 메타데이터
        *Description,<설명>                   (선택)
        *Creator,<이름>,<메일>,<그룹>,<팀>      (선택)
        *PreserveIncludes                    (선택) 다음 줄들 = 원문 그대로 둘 *INCLUDE 파일 패턴
        *Mode                                실행할 모드 목록, 한 줄에 하나 `모드이름,모드ID`
        DROP_ATTITUDE,1
        **DropAttitude,1                     모드별 옵션 블록 — 헤더 뒤 숫자가 *Mode 의 모드ID 와 짝
        Key,Value
        **EndDropAttitude                    `**End` 로 시작하는 줄이면 블록 종료 (**End 만 써도 됨)

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- koomeshmodifier
- kmm
- preprocess
- lsdyna
- drop
- attitude
- dropset
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 옵션 파일 확인
  args:
    model_path: /data/single/USER/case/model.k
    dry_run: true
    lines: &id001
    - EulerRolling,0
    - EulerPitching,45
    - EulerYawing,0
    - Height,1500
    - InitialVelocityX,0
    - InitialVelocityY,0
    - InitialVelocityZ,0
    - InitialAngularVelocityX,0
    - InitialAngularVelocityY,0
    - InitialAngularVelocityZ,0
    - OffsetDistance,0.05
    - Density,7.85e-09
    - YoungsModulus,200000.0
    - PoissonRatio,0.3
    - tFinal,0.005
    - dt,1e-06
    - DropSurface,Plane,300,300,20,30,30,2
- title: 제출하고 5분까지 기다리기
  args:
    model_path: /data/single/USER/case/model.k
    dry_run: false
    lines: *id001
    wait_sec: 300
    slurm:
      cpus_per_task: 4
      mem: 16G
