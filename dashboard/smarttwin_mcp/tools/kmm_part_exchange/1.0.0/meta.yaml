name: kmm_part_exchange
version: 1.0.0
summary: KooMeshModifier PART_EXCHANGE — 파트의 재료·단면·요소 형식 교체 (솔리드→TShell, 비정렬→정렬 격자 등)
description: |
  파트의 재료·단면·요소 형식 교체 (솔리드→TShell, 비정렬→정렬 격자 등)

  # 언제 쓰나
  - 파트의 SECTION/MAT 카드를 새 카드로 바꿀 때
  - 헥사 솔리드를 TShell 로, 비정렬 메시를 정렬 격자로 바꿀 때

  # 옵션 블록 문법 (KooMeshModifier --help PART_EXCHANGE)
  ```text
  **PartExchange,<ID>
  *PID,<pid> 또는 *PIDS,<pid...>|ALL
  (카드 교체) *SECTION_... / *MAT_... 카드 원문 — 첫 칸 SID/MID 는 문자 그대로
  (변환) *ConvertHexato,TShell,(nx,ny,nz),<각도공차>
  (변환) *UnstructuredtoStructured,(NX,NY,NZ) [+ *LayerThickness … *EndLayerThickness]
  **EndPartExchange
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `*PID / *PIDS` | 정수 \| ALL | - | 대상 파트 |
  | `*SECTION_... / *MAT_... / *EOS / *HOURGLASS` | 카드 원문 | - | 교체할 카드. ID 칸에 SID/MID 등 문자를 쓰면 새 ID 로 채운다 |
  | `*ConvertHexato` | TShell,(방향),각도 | - | 헥사 솔리드 → 두께 방향 TShell |
  | `*UnstructuredtoStructured` | (NX,NY,NZ) | - | 비정렬 → 정렬 격자 |
  | `*LayerThickness … *EndLayerThickness` | 실수 줄들 | - | 정렬 격자 Z 층 두께 |
  | `*NumberofElements / *InplaneRotation / *Layup` | - | - | 정렬 격자·적층 세부 |

  # 사례 — 파트 5 의 단면·재료를 새 카드로
  ```text
  *Inputfile
  model.k
  *Mode
  PART_EXCHANGE,1
  **PartExchange,1
  *PID,5
  *SECTION_SOLID_TITLE
  ImpactBallSection
  $$   SECID    ELFORM       AET    COHOFF   GASKETT
         SID         1
  *MAT_ELASTIC_TITLE
  Steel
  $$     MID        RO         E        PR        DA        DB         K
         MID 7.850e-09 2.000e+05 3.000e-01
  **EndPartExchange
  *End
  ```
  - 카드 ID 칸의 SID·MID 문자는 새 ID 로 채워진다. 칸 폭 10 을 지킬 것.

  # 사례 — 파트 1 헥사 솔리드 → TShell (두께 방향 +Z, 각도 공차 5°)
  ```text
  *Inputfile
  model.k
  *Mode
  PART_EXCHANGE,1
  **PartExchange,1
  *PID,1
  *ConvertHexato,TShell,(0,0,1),5.0
  **EndPartExchange
  *End
  ```

  # 주의
  - 변환 기능은 모델 형상 조건이 까다롭다 — 작은 모델로 먼저 확인할 것.

  관련 모드: MATERIAL_EXCHANGE, ELASTIC_TO_RIGID

  # MCP 로 부르는 법
  - model_path 를 주면 옵션 파일 `*Inputfile` / `*Mode PART_EXCHANGE,1` / `**PartExchange,1` … `**EndPartExchange` 을 만들어 준다.
  - options 의 `키: 값` 과 lines 의 원문 줄이 블록 안에 들어간다(options 먼저).
  - 키는 부분 문자열로 찾는 모드가 많고 모르는 키는 조용히 무시된다 — 위 표의 키 이름을 그대로 쓸 것.
  - 단위는 모델 .k 를 따른다(KooMeshModifier 는 변환하지 않는다).
  - 여러 모드를 한 번에: `kmm_chain`.

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  # 옵션 파일 형식 (요약)
      KooMeshModifier 는 LS-DYNA .k 모델과 옵션 파일(.txt) 하나를 받아 수정된 .k 를 만든다.

        *Inputfile                         다음 줄에 모델 파일명 (옵션 파일 폴더 기준 상대경로)
        model.k
        *RunDirectoryMode,True,Data/Results[,Data/Metadata]   (선택) 결과를 Run_<시각>_<해시>/ 폴더에
        *Info,<모델이름>,<단계>                (선택) 메타데이터
        *Description,<설명>                   (선택)
        *Creator,<이름>,<메일>,<그룹>,<팀>      (선택)
        *PreserveIncludes                    (선택) 다음 줄들 = 원문 그대로 둘 *INCLUDE 파일 패턴
        *Mode                                실행할 모드 목록, 한 줄에 하나 `모드이름,모드ID`
        DROP_ATTITUDE,1
        **DropAttitude,1                     모드별 옵션 블록 — 헤더 뒤 숫자가 *Mode 의 모드ID 와 짝
        Key,Value
        **EndDropAttitude                    `**End` 로 시작하는 줄이면 블록 종료 (**End 만 써도 됨)

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- koomeshmodifier
- kmm
- preprocess
- lsdyna
- part
- exchange
- tshell
- structured
- pex
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 옵션 파일 확인
  args:
    model_path: /data/single/USER/case/model.k
    dry_run: true
    lines: &id001
    - '*PID,5'
    - '*SECTION_SOLID_TITLE'
    - ImpactBallSection
    - $$   SECID    ELFORM       AET    COHOFF   GASKETT
    - '       SID         1'
    - '*MAT_ELASTIC_TITLE'
    - Steel
    - $$     MID        RO         E        PR        DA        DB         K
    - '       MID 7.850e-09 2.000e+05 3.000e-01'
- title: 제출하고 5분까지 기다리기
  args:
    model_path: /data/single/USER/case/model.k
    dry_run: false
    lines: *id001
    wait_sec: 300
    slurm:
      cpus_per_task: 4
      mem: 16G
