name: kam_capacitor
version: 1.0.0
summary: KooAutomatedModeller CAPACITOR — MLCC 칩 커패시터(패드·터미널·솔더·유전체 적층) 형상과 메시 생성
description: |
  MLCC 칩 커패시터(패드·터미널·솔더·유전체 적층) 형상과 메시 생성

  # 언제 쓰나
  - 0603·1005 같은 MLCC 를 솔더 필렛·내부 전극까지 모델링할 때
  - 압전 재료·전압 곡선을 붙인 MLCC 진동(어쿠스틱 노이즈) 모델이 필요할 때

  # 입력 파일 문법 (KooAutomatedModeller --help CAPACITOR)
  ```text
  *Capacitor[,이름]
  키,값 ...
  [**addscript,LSDyna … **endscript]
  *End
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `Location / Translation` | x,y,z | 0,0,0 | 배치 원점 |
  | `Rotation / Mirror / IsTop` | 도 / True\|False / True\|False | 0/False/True | 배치 방향 |
  | `XSize / YSize / ZSize` | 실수 | - | 칩 외형 (예제 단위 µm). YSize 만 주면 ZSize 도 같음 |
  | `Ndi / tdi / tel / epsilon / ldi` | 수 | - | 유전체 층 수·두께, 전극 두께, 비유전율, 마진 → 정전용량 계산 |
  | `swr / str / sbr / tens / sg / tilt` | 실수 | - | 솔더 폭·두께·하단 비율, 표면장력, Evolver SG, 기울기 |
  | `lpw lph rpw rph piw pt cbw cbh cbt ...` | 실수 | - | 패드·바디·터미널·배리어·피니시·솔더 세부 치수 약어 |
  | `MeshSize / MeshSizeSolder / MeshSizeBody` | 실수 | - | 하나라도 있으면 메시 생성 |
  | `NumberofElementMLCC` | nx,ny,nz | - | MLCC 바디 분할 |
  | `MeshPath` | 폴더 | - | 메시 중간 파일 폴더 |
  | `MaterialID` | <부위>,<id> | Pad1 Terminal2 Barrier3 Finish4 Solder5 Dielectric6 Electrode7 CeramicBody8 | 부위별 재료 ID |
  | `dxx…dyz / px11… / py11… / pz11…` | 실수 | - | 압전 유전·압전 행렬 성분 |
  | `LeftVoltageValue / RightVoltageValue` | 실수 | - | 좌우 전압 상수 |
  | `LeftVoltageCurve / RightVoltageCurve … End` | 시간,전압 줄 | - | 좌우 전압 곡선 (End 가 든 줄에서 끝) |

  # 사례 — 0603 MLCC 메시
  ```text
  *Capacitor,C0603
  Location,0.0,0.0,0.0
  Rotation,0
  Mirror,False
  IsTop,True
  XSize,600
  YSize,300
  ZSize,300
  Ndi,27
  tdi,5
  tel,6
  epsilon,1660
  ldi,170
  swr,0.6
  str,0.7
  sbr,0.6
  MeshPath,PackageInfoCap
  MeshSize,40
  MeshSizeSolder,20
  MeshSizeBody,20
  NumberofElementMLCC,20,10,3
  MaterialID,Solder,5
  MaterialID,CeramicBody,8
  *End
  ```
  - 실행: KooAutomatedModeller CAP cap0603.txt
  - 같은 키를 두 번 쓰면 뒤 값이 이긴다.

  # 주의
  - Surface Evolver 는 작업 폴더 Library/Evolver → 상위 폴더 → PATH → 설치본(SIF 의 /opt/SmartTwinPreprocessor/Library/Evolver) 순으로 찾고, 작업 폴더에 Library/Evolver/evolver 링크를 만들어 거기서 계산한다. 못 찾으면 종료 코드 1.
  - 산출물: <이름>_detail.step 등 STEP + PackageInfoCap 폴더 메시

  # 명령 형식
      KooAutomatedModeller <모드> <입력파일> [작업폴더|None] [표시 True|False]

        <모드>        PKG | CAPACITOR (=CAP) | PCB | ArrayPCB | PBA | AIRMESH   — 대소문자 구분 (pkg 는 안 됨)
        <입력파일>    작업폴더 기준 상대경로
        [작업폴더]    주면 그 폴더로 이동한 뒤 실행. None 이면 현재 폴더
        [표시]        GUI 표시 여부. 서버에서는 항상 headless 라 무시해도 된다

      공통 규칙
        - 입력 파일은 `키,값` 줄 형식 (AIRMESH 만 JSON). `#` 로 시작하는 줄은 주석.
        - 블록 헤더는 `*` 로 시작 (*Layer, *Capacitor, *PCB, *ODB ...). 키 이름은 대소문자 구분·접두 일치.
        - 파일 끝에 *End 를 둘 것 — PCB/ArrayPCB 파서는 *End 가 없으면 EOF 에서 멈추지 않는다.
        - 모르는 모드 이름·입력 파일 없음·라이선스 게이트·최상위 키워드 오류·Evolver 실패는 종료 코드 1. *Layer 안의 모르는 키는 조용히 무시되므로 로그의 Complete/FAILED 와 산출물도 확인할 것 (AIRMESH 는 항상 0, report.json 의 status 로 판단).
        - 실행 시 등록 IP·사용 기한(2027-12-31)을 확인한다. `Access denied` 면 그 머신에서는 실행되지 않는다 (종료 코드 1). 계산 노드 대역 192.168.122.x 는 허용.

  # 산출물
        PKG       메시 키워드가 없으면 <입력>.step, 첫 *Layer 에 MeshGenerationType 이 있으면 <입력>.k (LS-DYNA)
        CAPACITOR STEP + (MeshSize 계열 키가 있으면) LS-DYNA 메시
        PCB/ArrayPCB  PCB 형상 STEP
        PBA       <입력>_total.step (+ ExportPackage,True 면 패키지별 .txt/STEP 폴더)
        AIRMESH   <prefix>_air.stl / _cavity.stl / _outer_box.stl / _air.msh / _report.json (prefix 기본 = JSON 파일명)

  # MCP 로 부르는 법
  - input_text(입력 본문) 또는 input_path 를 준다. `KooAutomatedModeller CAPACITOR capacitor_input.txt <work> False` 로 실행된다.
  - 성공 여부는 종료 코드와 로그의 Complete/FAILED, 산출물로 확인한다(AIRMESH 는 report.json 의 status).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
