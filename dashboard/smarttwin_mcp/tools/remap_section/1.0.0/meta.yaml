name: remap_section
version: 1.0.0
summary: KooRemapper section — 메시를 평면으로 잘라 요소 다각형 + 매니페스트를 낸다 (그림의 엔진).
description: |
  메시를 평면으로 잘라 요소 다각형 + 매니페스트를 낸다 (그림의 엔진).

  Cut the mesh with an axis-aligned plane and write the element polygons, plus a manifest, to <output>_section.json. Edge-based: each element's edges are intersected with the plane, coincident points are merged, and the crossings are ordered angularly about the element centroid in the plane's own 2D basis. This matters because the shared face table is hex-shaped and its degeneracy test only catches all-four-equal, so a TET4 (stored with n5..n8 = n4) presents two collapsed faces as real ones; a face-based cut gets tets wrong. The hex 12-edge list alone is also not enough — applied to tet storage it drops the edge (n0,n2) — so the edge table is per type. The manifest is what keeps the figure from lying: it carries the axis and why it was chosen (with the per-axis tally), the parts hit versus the deck total, the count of nodes lying exactly on the plane and the epsilon the plane was nudged by, the degenerate-cut count, the section's 2D extent and aspect, the smallest feature in the section and which part it belongs to, per-part titles, shell thickness with its source, and Young's modulus. Writes no deck. It writes a JSON manifest and, unless `svg: false`, the figure itself as <output>_section.svg. With `compare` a second deck is drawn in the same figure, either side by side or overlaid on the identical plane. The figure itself is written as SVG with no external dependency: colours are a colourblind-safe categorical set keyed by part id so two figures can be compared, the legend is baked into the image, both axes get their own scale bar, and the footer carries the magnified axis and its factor, the parts hit, the smallest feature and its size in pixels, whether the plane was nudged, and the fact that the deck carries no units. A feature under 1.5 px is called out as invisible rather than drawn and left to look solid.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `model` | file | 예 | Deck to cut (k-file). A master deck is read with its whole *INCLUDE closure, so the included files must sit where the deck points (on the platform: uploaded to the same session). If no elements are found even then, it is refused rather than producing an empty figure, and the console says which includes could not be read, with the include list |
  | `output` | string | 예 | Output prefix — writes <output>_section.json and <output>_section.svg |
  | `axis` | enum |  | Cut-plane normal. 'auto' excludes axes whose section collapses to a line, then takes the axis meeting the most parts, breaking ties on the section's bounding-box area. Perpendicular-to-the-stack is NOT the rule: on a measured 61-part battery stack z meets 2 parts while x and y meet 59, and on a wrapped deck it is the other way round |
  | `at` | number |  | Plane position along the axis; omitted means the bounding-box centre. A plane landing exactly on a node layer — the layer boundary you most want to look at — is detected and nudged by epsilon, and both facts are reported |
  | `max_parts` | integer |  | Legend entries in the SVG before the rest are counted as omitted. The manifest and the polygons are never capped — every part the plane cut is emitted. |
  | `compare` | file |  | Optional second deck drawn in the same figure. With mode=panels each deck picks its own axis and scale; with mode=overlay both are cut by the SAME plane (that is what an overlay means) and the second is drawn dashed. Node numbering is the pairing in this repo — linkage-fit and applyfold require matching node ids — so an overlay costs nothing to align |
  | `mode` | enum |  | panels = side by side, overlay = one frame |
  | `width` | integer |  | SVG width in px (>= 430: margins 70x2 + legend 260 + plot) |
  | `height` | integer |  | SVG height in px (>= 240) |
  | `isotropic` | boolean |  | true draws both axes at one scale. The default is anisotropic because a real stack is 1:9,375 across and its thinnest layer lands on a measured 0.081 px isometrically; the magnified axis and its factor are always written into the figure |
  | `svg` | boolean |  | false writes only the JSON |

  # 주의
  - Angular ordering is correct for a convex section. A flipped element (negative Jacobian) can order its crossings wrongly and the fill then lies, which is why the manifest carries the shell count excluded from Jacobian checks; 111 of this repo's 489 tracked fixtures contain negative Jacobians and are otherwise normal. The op asserts no units — LS-DYNA decks carry none. A section whose extent collapses in one direction is reported as 'close to a line' instead of printing an aspect ratio computed by dividing by ~0. The axis tie-break is the section's bounding area, not its polygon count: on a wrapped stack the y cut yields more polygons (90 vs 72) but fragments into 40 pieces because the plane crosses the arc repeatedly, while z gives the arc profile in 16 — and the areas (4.11 vs 6.66) pick z. Part titles are free text straight out of the *PART card, so they are XML-escaped and control characters become '?' with a note in the figure; XML 1.0 cannot carry them and one would otherwise make the whole SVG unreadable. Second-order solids are drawn from their corners: the reader reads every node field and puts the corners in place (since 2026-10-17), so a 10-node tet (ELFORM 16/17) and a 20/27/64-node hex (ELFORM 23/24/29) are drawn with straight edges — a curved mid-side node is not shown, and the console says so ("... 는 코너로 그린다"). Measured: the same geometry converted by this tool's own `convert type: tet10` now yields a section of total area 0.665, equal to the linear original (the old reader kept only the first eight node fields and gave 0.19 with the same polygon count). Two cases are still refused with exit code 1: ELFORM 25-28 (21/40-node pentahedra, 15/20-node tets), whose corner order the manual text does not give ("see the figures"; *SECTION_SOLID remark 16 calls them under development), and any second-order element whose node cards are incomplete — the manual's Card 2 is one card of ten fields, so a deck that splits the node fields 8+2 across two lines also loses elements (the second line is read as the next element's first card; measured: two TET10 read as one). ELFORM 23 (20-node hex) keeps its corners in the first eight slots and is drawn: measured, its section is identical to the linear original's (120 polygons, total area 4.712178200).

  사례 메모: Cuts the bundled 3-layer stack; auto picks y (3 parts, 72 polygons) over z (1 part) and says so in axis_chosen_because

  # MCP 로 부르는 법
  - 인자는 `KooRemapper section` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- inspect
- section
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    model: flat_stack.k
    output: flat_stack
    axis: auto
    dry_run: true
    extra_inputs: &id001
    - /data/single/USER/case/flat_stack.k
- title: 제출하고 5분까지 기다리기
  args:
    model: flat_stack.k
    output: flat_stack
    axis: auto
    dry_run: false
    extra_inputs: *id001
    wait_sec: 300
