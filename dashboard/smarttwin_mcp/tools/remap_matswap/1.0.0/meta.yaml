name: remap_matswap
version: 1.0.0
summary: KooRemapper matswap — Replace material bundle (MAT/HOURGLASS/DEFINE_CURVE/SECTION) for one or
  more parts
description: |
  Replace material bundle (MAT/HOURGLASS/DEFINE_CURVE/SECTION) for one or more parts

  Replace material bundle (MAT/HOURGLASS/DEFINE_CURVE/SECTION) for one or more parts. Swaps a complete material bundle from a bundle file to target parts by PID or by MID (material ID). Automatically handles ID collision avoidance, orphaned card removal, and parameter resolution via *PARAMETER block. Supports single operation or integration into assemble workflow. Optional post-optimization for rubber properties (tssfac control).

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `config` | config | 예 | Complete YAML configuration object with model, output, and swaps array |

  # config 키 (YAML)
  - `None` (string): Path to base LS-DYNA keyword file (*.k). Relative paths resolve from config directory.
  - `None` (string): Output file prefix (without .k extension). Final output is output.k
  - `None` (array): Array of swap operations. Each item swaps one bundle to specified target parts (pid/pids/mid/mids/swap_all)
  - `None` (string): Path to bundle file (*.k) containing *PARAMETER block with prefixed parameter names (HGID*, LCID*, SECID*, MID*, PID*). Relative paths resolve from config directory.
  - `None` (integer): Single PID to target. Mutually exclusive with pids, mid, mids, swap_all. Swaps MAT+HOURGLASS+DEFINE_CURVE+SECTION.
  - `None` (array): List of integer PIDs to target (e.g. [1, 2, 3]). Multiple PIDs share one bundle copy. Mutually exclusive with pid, mid, mids, swap_all. Swaps MAT+HOURGLASS+DEFINE_CURVE+SECTION.
  - `None` (integer): Single MID to target. Mutually exclusive with pid, pids, mids, swap_all. Swaps MAT+HOURGLASS+DEFINE_CURVE ONLY (no SECTION). Used to update only material properties, keeping section unchanged.
  - `None` (array): List of integer MIDs to target (e.g. [5, 6]). Mutually exclusive with pid, pids, mid, swap_all. Swaps MAT+HOURGLASS+DEFINE_CURVE ONLY (no SECTION).
  - `None` (boolean): If true, swap bundle to all *PART entries in model (auto-discovers PIDs). Mutually exclusive with pid, pids, mid, mids. Swaps MAT+HOURGLASS+DEFINE_CURVE+SECTION for each part.
  - `None` (enum): Post-optimization mode. 'rubber': apply rubber-specific CONTACT and CONTROL settings. null/empty: no optimization. Applied only if specified and non-empty.
  - `None` (number): TSSFAC value for rubber optimization (time step safety factor). Used only when optimize='rubber'. Range typically 0.5–0.9.
  - `None` (string): Analysis type hint for optimization: 'explicit' or 'implicit'. null/empty: auto-detect from model. Used only when optimize='rubber'.
  - `None` (boolean): Optional, default false (since 2026-10-17). When the model *INCLUDEs other files, read the whole closure flattened into one standalone deck — each *INCLUDE card replaced by its file's body in LS-DYNA reading order, the include files' *KEYWORD lines dropped — and write the result as one file without *INCLUDE. Without it the op edits only the main deck and stops with exit code 1 (naming this key) when its target parts, materials or cards live only inside an include. Refused when the closure cannot be read completely, has a cycle, or an *INCLUDE + / - or an include *KEYWORD changes the field width.

  # 프리셋
  ```json
  [
   {
    "name": "rubber",
    "summary": "optimize='rubber': Applies rubber material optimization including timestep control (tssfac, default 0.67), CONTACT settings for rubber impact behavior, and CONTROL_HOURGLASS tuning. Sets tssfac=0.67 by default unless overridden."
   }
  ]
  ```

  # 주의
  - **Bundle File Format Requirement:** Bundle must contain a *PARAMETER block with parameter names prefixed by ID type:  HGID*, LCID*, SECID*, MID*, PID*. The parser detects the type by prefix (case-insensitive) and allocates new IDs accordingly (HGID/LCID/SECID always auto-increment; MID reuses orphan IDs when safe).  **ID Allocation Logic:** (1) HGID/LCID/SECID: always allocate new IDs (model max + 1). (2) MID: if old MID is shared (used by other parts), allocate new; if orphan (used only by target), reuse old ID. (3) PID parameters in bundle are ignored. **Orphan Removal:** Old *MAT_, *SECTION, *HOURGLASS cards are automatically removed ONLY if they are not shared with non-target parts. (4) **Parameter Resolution:** All parameter references (&PARAM_NAME) in bundle cards are resolved to new IDs before insertion. (5) **Output:** Resolved cards inserted just before *END. Output file has no *PARAMETER block. **PID vs MID Targeting:** pid/pids swaps full material+section+hourglass bundle; mid/mids swaps only material+hourglass+curves (no section). **Mutually Exclusive Options:** Only ONE of pid/pids/mid/mids/swap_all per swap operation. **optimize=rubber:** Modifies CONTACT friction, CONTROL_HOURGLASS IHQ, and CONTROL_TIMESTEP TSSFAC for rubber parts. **Legacy Positional Interface:** Still supported: KooRemapper matswap model.k bundle.k pid output.k (4 args). **Integration:** matswap can be used as operation type in assemble workflow (see examples/matswap/04_assemble_integration.yaml)."

  YAML INPUT — COMMON RULES:
  ---
  - A leading UTF-8 BOM is ignored, so a config saved by a Windows editor (Notepad) works as-is.
  - A TAB used for INDENTATION anywhere in the file is rejected with rc=1 — `[ERROR] [<op>] YAML 들여쓰기에 탭을 쓸 수 없습니다 (공백을 쓰세요): <n>번째 줄: <line>`. The whole file is scanned, so a tab under a key this op never reads fails too; configs that used to run with rc=0 can now fail. Tabs inside a quoted value are kept, but a tab that starts a line inside a `|`/`>` literal block (material_card, czm_material_card, material_cards) is rejected, because the parser would otherwise drop that card line silently.
  - The tab scan is skipped when the config arrives on a stream that cannot be rewound (pipe, process substitution, /dev/stdin); such input reaches the parser unchecked.
  - RELATIVE PATHS: a path given on the COMMAND LINE is relative to the current working directory. A relative path INSIDE the YAML — with or without a folder part (`box.k` and `../data/box.k` alike) — is relative to the folder that holds that YAML file, and never falls back to the working directory. Absolute paths (leading `/` or `\`, or an `X:` drive letter) are used as-is.

  INCLUDE CLOSURE (since 2026-10-17): this op edits only the main deck. If its targets live only inside an *INCLUDE it stops with exit code 1 and names flatten_includes; with flatten_includes: true it reads the closure flattened into one standalone deck and writes one file without *INCLUDE (measured: the same output as the unsplit deck). For an all-parts run on a master deck whose own parts are in the main file, the parts inside includes are left alone and a warning says so.

  사례 메모: Invoked as: KooRemapper matswap config.yaml where config.yaml contains the YAML structure above

  # MCP 로 부르는 법
  - 인자는 `KooRemapper matswap` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- material
- matswap
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    config: &id001
      model: two_cubes.k
      output: result.k
      swaps:
      - bundle: rubber.k
        pid: 1
    dry_run: true
    extra_inputs: &id002
    - /data/single/USER/case/two_cubes.k
    - /data/single/USER/case/result.k
    - /data/single/USER/case/rubber.k
- title: 제출하고 5분까지 기다리기
  args:
    config: *id001
    dry_run: false
    extra_inputs: *id002
    wait_sec: 300
