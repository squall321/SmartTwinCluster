name: remap_foldsurface
version: 1.0.0
summary: KooRemapper foldsurface — 접힘 곡면(평면 elastica) 중심선 — 최소 곡률반경을 목표로 고정하고 B 를 푼다.
description: |
  접힘 곡면(평면 elastica) 중심선 — 최소 곡률반경을 목표로 고정하고 B 를 푼다.

  Solve the centerline of a symmetric fold as a planar elastica and write it as a CSV. The state (x, y, theta, kappa) obeys (cos theta, sin theta, kappa, -B sin theta); the apex is pinned at kappa = 1/min_radius so the target minimum radius holds by construction, leaving the force parameter B as the single unknown. B is bounded above by kappa0^2/(2(1-cos(alpha/2))) — beyond that the tangent can never reach the requested turn — so the search interval is closed and finite. The elastica is multi-valued, so the solver sweeps that whole interval by continuation and bisects the FIRST sign change, which picks the branch with the fewest curvature reversals deterministically instead of depending on an initial guess. Writes <output>_curve.csv with s, x, y, theta_deg, curvature, radius over the full (mirrored) curve, and reports B, the achieved minimum radius, the endpoint residual, the curvature sign-flip count, the end separation, the apex-to-end height and the bending energy per EI. Reads no deck and writes no deck.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `output` | string | 예 | Output prefix — writes <output>_curve.csv |
  | `arc_length` | number | 예 | Arc length L of the bending region |
  | `fold_angle` | number | 예 | Total tangent turn of the bending region [deg], 0 < angle < 360. For two flat halves meeting at an angle phi, the turn is 180 - phi (a fully folded panel turns 180) |
  | `min_radius` | number | 예 | Target minimum radius of curvature — held exactly at the apex |
  | `points` | integer |  | Sample count written to the CSV (default 201, >= 3) |

  # 주의
  - The request is impossible when fold_angle exceeds L/min_radius radians — the circular arc is the hard upper bound on turn for a given length and radius — and the op then exits non-zero and prints the radius and length that would be needed, instead of returning a shape. When the arc length is much longer than min_radius*alpha the solution necessarily reverses curvature (a wavy strip); that is a property of the stated BVP, not a solver failure, so the op reports the sign-flip count and suggests the arc length for a single-direction bend. The minimum radius and the endpoint residual are both re-checked after solving and a failure of either exits non-zero rather than writing a curve.

  사례 메모: Writes fold_curve.csv; a turn of exactly L/min_radius radians gives the circular-arc limit (B=0), and a longer arc_length makes the solution wavy, which the op warns about

  # MCP 로 부르는 법
  - 인자는 `KooRemapper foldsurface` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- deform
- foldsurface
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    output: fold
    arc_length: 10.0
    fold_angle: 90.0
    min_radius: 3.0
    points: 201
    dry_run: true
- title: 제출하고 5분까지 기다리기
  args:
    output: fold
    arc_length: 10.0
    fold_angle: 90.0
    min_radius: 3.0
    points: 201
    dry_run: false
    wait_sec: 300
