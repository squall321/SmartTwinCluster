name: remap_iga
version: 1.0.0
summary: KooRemapper iga — Embed FE parts in IGA (Isogeometric Analysis) NURBS trivariate box
description: |
  Embed FE parts in IGA (Isogeometric Analysis) NURBS trivariate box

  IGA 등기하해석(Isogeometric Analysis) — FE solid 파트를 3D NURBS B-Spline 박스로 래핑하여 LS-DYNA IGA 해석 가능하게 변환. 타겟 파트별 복셀 크기, 다항식 차수, 적분 규칙, 바운딩박스 확장 방식을 개별 설정 가능.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `config` | config | 예 | Complete YAML configuration object with base_model, output, and operations array |

  # config 키 (YAML)
  - `None` (string): 기본 모델 파일 경로 (.k 형식). model 또는 base_model 키 모두 지원.
  - `None` (string): 출력 파일 접두사. <output>.k (메인) 및 <output>_iga_p{pid}.k (파트별) 생성.
  - `None` (array): IGA 적용 대상 파트 목록. 최소 1개 이상 항목 필수.
  - `None` (integer): 적용할 파트 ID (양수). target_pid, target_pids, target_name 중 하나 필수.
  - `None` (array): 여러 파트 ID를 한번에 지정 (예: [1, 2, 3]). 각 항목별로 개별 target으로 확장됨. target_pid 또는 target_name 중 하나 필수.
  - `None` (string): 파트 제목 와일드카드 패턴 (예: 'Lower*', '*FRONT*'). target_pid 또는 target_name 중 하나 필수.
  - `None` (string): 제외할 파트 제목 와일드카드 패턴 (예: 'Manual_*'). target_name과 함께 사용하여 매칭된 항목 중 제외.
  - `None` (number): NURBS 복셀 기본 크기 (각 방향 공통, 단위: 모델 단위). 양수만 허용. element_size_r/s/t가 0이면 이 값 사용.
  - `None` (number): r방향(x축) 개별 복셀 크기. 0=element_size 사용.
  - `None` (number): s방향(y축) 개별 복셀 크기. 0=element_size 사용.
  - `None` (number): t방향(z축) 개별 복셀 크기. 0=element_size 사용.
  - `None` (number): IGA 바운딩박스 고정 확장량 (단위: 모델 단위). -1(기본)=자동(각 축별 element_size). >=0 지정시 고정값 사용. 우선순위: bbox_scale_r/s/t > bbox_scale > offset >= 0 > element_size.
  - `None` (number): IGA 박스 균일 스케일 배율 (0=비활성화). 예: 1.5 = 각 방향 양측 +25% 확장. bbox_scale_r/s/t가 0이면 이 값 사용.
  - `None` (number): r방향(x축) 개별 스케일 배율. 0=bbox_scale 사용.
  - `None` (number): s방향(y축) 개별 스케일 배율. 0=bbox_scale 사용.
  - `None` (number): t방향(z축) 개별 스케일 배율. 0=bbox_scale 사용.
  - `None` (integer): 적분 규칙: 0=reduced Gauss (기본), 1=full Gauss. LCP 계산 정확도에 영향.
  - `None` (integer): LCP(선형 보완 문제) 안정화 타입. 기본값 4. LS-DYNA IGA 파라미터.
  - `None` (number): LCP 수렴 임계값. 기본값 0.001. 수치 안정성 제어.
  - `None` (integer): r방향(x축) NURBS 다항식 차수 (>=1). 제어점 수 = max(2, pr+1).
  - `None` (integer): s방향(y축) NURBS 다항식 차수 (>=1).
  - `None` (integer): t방향(z축) NURBS 다항식 차수 (>=1).
  - `None` (integer): r방향 적분점 수 (Gauss 적분). 1=기본, 2 이상=정밀.
  - `None` (integer): s방향 적분점 수.
  - `None` (integer): t방향 적분점 수.
  - `None` (number): 영 계수 (선택사항, 일부 처리용).
  - `None` (number): 포아송 비 (선택사항, 0 < nu < 0.5).

  # 주의
  -
  **타겟 선택 규칙:**
  - target_pid 또는 target_name 중 최소 하나 필수 (둘 다 0/공백이면 오류).
  - target_pids 사용시 각 ID마다 개별 target으로 자동 확장.
  - target_name은 와일드카드(*) 지원; exclude_name과 조합 가능 (매칭된 항목 중 제외).

  **바운딩박스 확장 우선순위 (높→낮):**
  1. bbox_scale_r/s/t (축별 배율, 0이면 다음 단계)
  2. bbox_scale (균일 배율, 0이면 다음)
  3. offset >= 0 (고정값)
  4. 기본값: element_size (각 축별)

  **제약사항:**
  - element_size > 0 필수 (0 이하 오류).
  - targets[] 비어있으면 오류.
  - pr, ps, pt >= 1 (NURBS 차수).
  - nisr, niss, nist >= 1 (적분점).
  - ir: 0 또는 1만 유효.
  - IGA와 FE 파트는 반드시 다른 MID(재료ID) 사용 (LS-DYNA 요구사항).

  **MID 격리:**
  IGA 파트와 기존 FE 파트가 같은 MID를 사용하면 해석 오류 발생. 출력된 _iga_p{pid}.k 파일의 MID는 자동 조정되거나 별도로 지정 필요.

  **멀티 PID 확장:**
  target_pids: [1, 2, 3]으로 지정하면 내부에서 target_pid: 1, target_pid: 2, target_pid: 3으로 자동 확장.

  **복셀 크기 해석:**
  element_size = 4.0 → r/s/t 방향 각각 4.0 단위 크기 복셀 생성. 작을수록 정밀하나 계산량 증가.

  **출력 구조:**
  - <output>.k: 원본 FE 유지 + *INCLUDE로 IGA 파일 참조.
  - <output>_iga_p{pid}.k: 각 파트별 IGA NURBS 박스 (*IGA_DEV_VOLUME_XYZ 포함).

  YAML INPUT — COMMON RULES:
  ---
  - A leading UTF-8 BOM is ignored, so a config saved by a Windows editor (Notepad) works as-is.
  - A TAB used for INDENTATION anywhere in the file is rejected with rc=1 — `[ERROR] [<op>] YAML 들여쓰기에 탭을 쓸 수 없습니다 (공백을 쓰세요): <n>번째 줄: <line>`. The whole file is scanned, so a tab under a key this op never reads fails too; configs that used to run with rc=0 can now fail. Tabs inside a quoted value are kept, but a tab that starts a line inside a `|`/`>` literal block (material_card, czm_material_card, material_cards) is rejected, because the parser would otherwise drop that card line silently.
  - The tab scan is skipped when the config arrives on a stream that cannot be rewound (pipe, process substitution, /dev/stdin); such input reaches the parser unchecked.
  - RELATIVE PATHS: a path given on the COMMAND LINE is relative to the current working directory. A relative path INSIDE the YAML — with or without a folder part (`box.k` and `../data/box.k` alike) — is relative to the folder that holds that YAML file, and never falls back to the working directory. Absolute paths (leading `/` or `\`, or an `X:` drive letter) are used as-is.

  사례 메모: Example uses real files from examples/iga/ folder: base_model block_2x2x1.k with PIDs 1, 2 (two-layer structure). Outputs iga_result.k plus per-part IGA files iga_result_iga_p1.k, iga_result_iga_p2.k

  # MCP 로 부르는 법
  - 인자는 `KooRemapper iga` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- mesh
- iga
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    config: &id001
      base_model: block_2x2x1.k
      output: iga_result
      operations:
      - type: iga
        targets:
        - target_pid: 1
          element_size: 4
          ir: 0
          pr: 2
          ps: 2
          pt: 1
          bbox_scale: 1.4
        - target_pid: 2
          element_size: 3
          element_size_r: 2
          element_size_s: 2
          pr: 2
          ps: 2
          pt: 1
    dry_run: true
    extra_inputs: &id002
    - /data/single/USER/case/block_2x2x1.k
- title: 제출하고 5분까지 기다리기
  args:
    config: *id001
    dry_run: false
    extra_inputs: *id002
    wait_sec: 300
