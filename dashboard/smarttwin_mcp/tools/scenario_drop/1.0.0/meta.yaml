name: scenario_drop
version: 1.0.0
summary: KooChainRun DROP — 낙하 시나리오 — 자세 DOE(피보나치·육면체·스윕) × 누적 스텝
description: |
  낙하 시나리오 — 자세 DOE(피보나치·육면체·스윕) × 누적 스텝

  # 언제 쓰나
  - 여러 낙하 자세를 클러스터에 한꺼번에 돌릴 때
  - 같은 제품을 여러 번 떨어뜨리는 누적 낙하 (num_steps ≥ 2)

  # 시나리오 키 (KooChainRun --help DROP)
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `angle_source.source_type` | 문자 | cuboid_geometry | cuboid_geometry(면·모서리·꼭짓점 26) \| fibonacci_lattice \| pitching_sweep \| rolling_sweep \| case_txt_file \| impact_conditions |
  | `angle_source.impact_conditions (source_type impact_conditions)` | 객체 | - | prepare 가 KMM RIGID_DROP_ENDTIME(Fibonacci num_directions, 중력 켬)으로 충돌 직전 상태(<base>_impacts.csv)를 받아 대표 count 개를 골라 DOE 하나씩(1 스텝 DROP: 자세=충돌 순간 자세, InitialVelocity=v, RigidAngularVelocity=w, Height 0, EndTimeTable=impact_conditions/endtime.csv). 1 스텝 DROP 만, tolerance·part_doe·endtime_presim 과 함께 못 쓴다. 기록 output/impact_conditions/index.json, runner_config scenario.doe_impact_meta·doe_impact_state. prepare 가 표 줄을 읽을 KMM(러너의 apptainer_sif 안 또는 koomeshmodifier_path, batch_koomeshmodifier 면 그 헤드 노드 KMM)의 --help 로 EndTimeTable·RigidAngularVelocityX 를 확인하고 모르면(v131 이하) 멈춘다 — 노드의 러너도 KMM 출력에 [EndTimeTable]·[RigidAngularVelocity] 표식이 없으면 그 스텝을 실패로 둔다. 표의 height·v0·gravity 메타가 이 낙하·옵션과 다르거나, mm-kg-ms·mm-g-ms 덱인데 simulation_params.gravity 가 없으면 멈춘다. 전각도 sphere 리포트는 돌리지 않는다 — 결과는 harvest --impact-map 으로(항복강도를 주면 σ/항복 비가 가장 큰 파트가 지배, 다시 prepare 한 뒤 남은 지난 Run 은 step_config 대조로 뺀다) |
  | `angle_source.impact_conditions.num_directions / restitution / friction / gravity` | 정수 / 실수 목록 / 실수 / bool | 20000 / [0.1, 0.3, 0.5] / 0.5 / true | 사전 해석 방향 수(실제 낙하 방향 균일)·반발계수·마찰계수·중력(충격 조건은 켬). 끄면(v133 KMM) 2차 묶음 뒤에도 이어 돌려 k ≥ 3 충돌 줄이 더 생긴다 — k=1·2 줄과 endtim_k 는 같다 |
  | `angle_source.impact_conditions.margin_ms / workers` | 실수 / 정수 | 1.0 / 8 | 충돌 묶음 끝 뒤 여유(ms) · 프로세스 수. exclude_parts 는 쓸 수 없다(FEM 의 강체 회전 중심이 그 파트를 빼지 못한다 — 템플릿에서 지울 것. 병진 SPC 가 파트 절점의 10% 이상인 파트(바닥판 등)와 병진이 묶인 *MAT_RIGID 파트는 양쪽 모두 자동으로 빠진다 — 10% 미만이면 SPC_ON_DEVICE_PART 경고만, 뺄 파트가 기기 파트와 절점을 나누면 KMM 종료 코드 1) |
  | `angle_source.impact_conditions.presim_timeout_seconds` | 정수 | 21600 | 사전 해석 KMM 시간 제한(초, 기본 6 시간 — 러너 KMM 의 timeout 과 따로). 넘으면 KMM 프로세스 묶음째 멈추고 prepare 가 멈춘다 |
  | `angle_source.impact_conditions.count / impacts / severity_fraction` | 정수 / 정수 목록 / 실수 | 100 / [1, 2] / 0.5 | 대표 수 · 후보 충돌 차수(1 차·2 차) · 심각도(J_over_mv0·vn/v0 = 충격량 × 접촉점 접근 속도, 충격 에너지 대용) 상위로 고를 몫. 나머지는 상태 공간 최원점. 모든 (각도, e, 차수)는 가장 가까운 대표에 묶인다 |
  | `angle_source.impact_conditions.severity_min_distance` | 실수 | 0.2 | 심각도 몫의 비최대 억제 — 이미 고른 심각도 상태와 특징 f 거리가 이보다 가까운 상태는 건너뛴다(0.2 ≈ 자세 11° 또는 속도·각속도 0.2·v0 차이). 순위가 다 떨어지면 남은 몫은 최원점으로. 0 이면 끈다 |
  | `angle_source.impact_conditions.table` | 경로 | null | 이미 만든 <base>_impacts.csv (옆에 <base>_rigidbody.json — 그 presim.params.exclude_parts 가 [] 여야 한다, 기록이 없으면 멈춘다). 주면 사전 해석을 건너뛴다(KMM --help 버전 확인은 한다 — 헤드 노드에서 그 KMM 이 돌아야 한다) |
  | `angle_source.fibonacci_lattice.num_points` | 정수 | 26 | 피보나치 구면 점 수 (별칭 num_directions) |
  | `angle_source.cuboid_geometry.include_faces/edges/corners` | bool | true | 육면체 방향 선택 |
  | `angle_source.fibonacci_lattice.sampling_space` | physical \| latlon | physical | physical = 실제 낙하 방향 등간격. latlon = 옛 방식(방향이 적도에 몰림) |
  | `tolerance.roll/pitch/yaw + doe_type/doe_count` | 객체 | lhs / 10 | 각도 공차 DOE 확장 |
  | `cumulative.num_steps / mode_sequence` | 정수 / 배열 | 1 / DROP×n | 누적 스텝 |
  | `cumulative.angle_mixing.strategy` | 문자 | same_angle | same_angle \| cyclic \| random \| opposite \| custom_mapping |
  | `simulation_params.height` | 실수 | 1500 | 낙하 높이 (모델 단위) |
  | `simulation_params.gravity` | 실수 | 재질 밀도로 판정 | 자유낙하 g (모델 단위, --help units) |
  | `simulation_params.tFinal / dt` | 실수 | 0.005 / 1e-6 | 종료 시간 / d3plot 간격 |
  | `simulation_params.endtime_presim.enabled` | bool | false | prepare 때 KMM RIGID_DROP_ENDTIME(강체 낙하 사전 해석)을 돌려 DROP 자세마다 종료 시간을 정한다. DROP 스텝 설정(누적·대규모·배치)에 EndTimeTable 줄이 들어가 KMM 이 자세별 ENDTIM 을 쓴다(tFinal 줄은 남는다). 산출 <output_dir>/endtime_presim/1/, runner_config scenario.endtime_tables·doe_endtim. KMM 실패(3 = 덱 요소 소실)·각도 빠짐이면 prepare 가 멈춘다. 러너가 쓸 KMM 의 --help 에 EndTimeTable 이 없으면(v131 이하 — 그 줄을 Height·tFinal 등으로 잘못 읽는다) 멈춘다(batch_koomeshmodifier 면 그 헤드 노드 KMM 을 묻는다. 노드의 러너도 KMM 출력에 [EndTimeTable] 표식이 없으면 그 스텝을 실패로 둔다). 중력 끔 사전 해석은 그 KMM 의 --help RIGID_DROP_ENDTIME 에 PresimStrongContact 가 없으면(v132 이하 — 그 줄에서 종료 코드 1) 사전 해석 전에 멈춘다. endtim 이 tFinal 보다 길면 시간 제한을 늘린다 — submit 의 DOE time_limit 은 DOE 마다 Σ 스텝(ceil(endtim ÷ tFinal) + DR 스텝 1) 의 최대 배(표가 짧으면 예전 step/DR 배율 그대로), sequential 은 슬롯 DOE 배율 합, 대규모 배열은 그 배열 DOE 의 최대 배, 러너 스텝 timeout_per_step_seconds·deep report(deep_timeout_seconds·deep_time_limit)는 그 스텝 배. 파티션 최대에서 자르고 모자라면 🔴 경고. prepare 가 바닥 위 도달 거리 reach 최대(바닥판 반폭보다 길면 경고)와 n_unresolved 각도 수를 찍는다 |
  | `simulation_params.endtime_presim.table` | 경로 | null | 이미 만든 <base>_endtime.csv (scenario.json 기준 상대 또는 절대). 주면 사전 해석을 건너뛴다. 모든 DROP 자세가 낙하 방향 0.01° 안에 있어야 하고, 표 메타 height·v0(√(2gh), units 기준)가 이 시나리오 낙하와 상대 1e-3 안이고 gravity(0/1)가 이 옵션 gravity 와 같아야 한다(아니면 멈춘다). 메타 units 가 mm-kg-ms·mm-g-ms 인데 simulation_params.gravity 가 없으면 멈춘다(FEM KMM 이 그 단위의 g 를 못 알아낸다). deck 이 템플릿과 다르거나 t_sep_ms 메타가 없으면 경고만. BOM(엑셀 저장)은 괜찮다. 메타 endtime_rule 이 없으면(v132 표 — 첫 재접촉 규칙이라 슬랩다운 뒷부분을 놓칠 수 있다, 중력 켬 표는 빼고) 경고하고, endtime_rule=last_strong 표의 strong_contact 가 이 옵션 strong_contact 와 다르면 멈춘다(first_recontact 표는 보지 않는다) |
  | `simulation_params.endtime_presim.restitution / friction` | 실수 목록 / 실수 | [0.1, 0.3, 0.5] / 0.5 | 사전 해석 반발계수(가장 긴 종료 시간을 쓴다) · 바닥 마찰계수 |
  | `simulation_params.endtime_presim.gravity / margin_ms` | bool / 실수 | false / 1.0 | 사전 해석 중력(기본 끔 — 낙하 덱에 중력이 없어 같은 조건이다. 끄면 접근 속도가 strong_contact·v0 이상인 마지막 재접촉 묶음 끝까지 보고, 켜면 1차 뒤 첫 재접촉 묶음 끝(v132 규칙, strong_contact 는 안 쓴다)) · 종료 시간을 정한 묶음(없으면 1차 충돌) 끝 뒤 여유(ms) |
  | `simulation_params.endtime_presim.strong_contact` | 실수 | 0.2 | 중력 끔 종료 시간 규칙의 문턱(접근 속도 ÷ v0, 0 보다 큰 실수). 각도마다 ENDTIM = 1차 묶음 뒤 접근 속도가 strong_contact·v0 이상인 마지막 재접촉 묶음의 끝 + margin_ms 이고, 그런 묶음이 없으면 1차 충돌 끝 + margin_ms 다(묶음은 1 ms 간격, 세기는 묶음 안 최대 접근 속도). 낮추면 약한 늦은 스침까지 기다려 길어지고 높이면 짧아진다. 기본 0.2 — 0.3 이면 사전 해석 마찰이 FEM 과 어긋날 때(0.5 표·실제 0.2) 1차 충돌만큼 센 재접촉을 놓쳐 0.2 로 낮췄다. KMM 옵션 파일에 PresimStrongContact,<값> 줄로 넘긴다(v133 이상 KMM). gravity=true 면 쓰지 않는다(경고). 표(사전 해석·table 지름길 모두)의 메타 strong_contact 가 이 값과 상대 1e-9 넘게 다르면 멈춘다. KCR v133 이상에서만 읽는다 — v132 KCR 은 모르는 키로 무시하고 KMM 기본값(v133 0.2)을 쓴다 |
  | `simulation_params.endtime_presim.exclude_parts / workers` | 정수 목록 / 정수 | [] / 8 | 사전 해석에서 뺄 파트(받침·고정구 등. 병진 SPC 가 파트 절점의 10% 이상인 파트(바닥판 등)와 병진이 묶인 *MAT_RIGID 파트는 KMM 이 자동으로 뺀다 — 10% 미만이면 기기 파트로 넣고 SPC_ON_DEVICE_PART 경고, 뺄 파트가 기기 파트와 절점을 나누면 종료 코드 1) · 프로세스 수 |
  | `simulation_params.endtime_presim.presim_timeout_seconds` | 정수 | 21600 | 사전 해석 KMM 시간 제한(초, 기본 6 시간 — 러너 KMM 의 timeout 과 따로). 넘으면 KMM 프로세스 묶음째 멈추고 prepare 가 멈춘다 |
  | `environment.schedule` | bool / 객체 | true | v134 — 사전 해석 ENDTIM 표(doe_endtim)가 있으면 submit 이 DOE 를 예상 시간이 긴 것부터 내고(동시 상한 없이 순서만, 이득은 사실상 0 — −1.2 ~ +0.5%), --sequential 은 칸 수를 무릎 대수(상한 안에서 완료 시각이 더 줄지 않는 가장 작은 칸 수)로 정해 긴 것부터 가장 덜 찬 칸에 넣는다. --nodes 보다 적은 칸을 쓰면 ⚠️ 한 줄. 슬롯 --time 은 칸 F_d 합의 최대를 모든 칸에 같게 준다. rerun 도 대상 DOE 만으로 같다(틀린 값은 확인·--cleanup-stale 전에 멈춘다). slurm_scripts/schedule.json(rerun 은 schedule_rerun.json)에 비용·순서·칸·대수별 예상 완료를 남긴다. DOE 번호·jobs.json 형식은 그대로다. null 은 켬과 같다. false(또는 enabled false)거나 표가 없으면 다른 키를 보지 않고 예전과 바이트 동일. impact_conditions 심각도 순서·progressive 피보나치 순서는 켜져 있으면 덮어쓴다 |
  | `environment.schedule.licenses / licenses_per_job / max_concurrent` | 정수 | null / 1 / null | --sequential 칸 상한 — --nodes·licenses ÷ licenses_per_job·max_concurrent·DOE 수 가운데 가장 작은 값. 기본 제출에는 걸지 않는다 |
  | `environment.schedule.overhead_seconds / seconds_per_ms / knee_tolerance` | 실수 | 300 / 20 / 0 | 예상 시간 = overhead_seconds + seconds_per_ms × Σ 스텝(ENDTIM ms + DR 스텝 tFinal). 덱 시간 단위는 표 메타 time_unit → units 끝(mm-t-s → s) → tFinal 짐작(0.5 이상 ms) 차례이고 짐작하면 알린다. 가정값이라 보정 안 됨(Test_005 1 MPP 는 226 s/ms). D2R 이 켜지면 ENDTIM 비례 그대로 두고 'D2R 켬(보정 안 됨)' 만 적는다. knee_tolerance 는 무릎 판정 여유(0 이면 완료가 더 줄지 않는 최소 칸 — 0.05 는 실제 표에서 라운드로빈보다 3.6% 늦은 경우가 있었다) |
  | `simulation_params.density / youngs_modulus / poisson_ratio` | 실수 | 7.85e-9 / 2e5 / 0.3 | 바닥판 재질 |
  | `simulation_params.offset_distance` | 실수 | 0.05 | 바닥판 초기 간격 |
  | `simulation_params.drop_surface` | 객체 | Plane 300×300×20, 30×30×2 | type: Plane \| PlaneGraded(num_outer_layers, ratio) \| RigidWall \| PlanewithRoughness |
  | `simulation_params.drop_contact` | 객체 | {} | 바닥판 접촉 카드 필드 (SOFT, DTSTIF, FS ...) |
  | `simulation_params.drop_contact.Type / Scope / InheritGeneral` | 문자 / 문자 / bool | General(D2R 면 S2S) / Outer / false | 바닥판 접촉 유형(General \| SurfaceToSurface) · slave 범위(Outer = bbox 외곽 10% 자동, All = 전 파트) · 원본 AUTOMATIC_GENERAL 상속(명시값 > 원본 > 기본값). 키 대소문자·밑줄 무관 |
  | `simulation_params.inherit_general_contact` | bool | false | drop_contact.InheritGeneral 의 별칭 |
  | `simulation_params.convert_general_to_single_surface` | bool | true | 원본 AUTOMATIC_GENERAL 을 SINGLE_SURFACE 로 바꿀지. false 면 내부 GENERAL 유지(D2R 권장) |
  | `simulation_params.drop_surface.deformable_to_rigid` | bool \| 객체 | false | 비행 구간 강체화(D2R/R2D 쌍). 객체 키 time1·time2·time3·nrbf·ncsf·rwf·dtmax·offset·lrb. 켜면 바닥판 접촉은 S2S 자동(매뉴얼 Remark 1). RigidWall·include_wall_in_general=true 면 카드 0장 |
  | `simulation_params.robust_contact / robust_contact_tolerance` | bool / 실수 | false / 0.1 | Tied 면 제외 SINGLE_SURFACE |
  | `simulation_params.decompose_general_contact (+ decompose_contact_margin, decompose_contact_absolute_margin_x/y/z)` | bool / 실수 | false / 1.5, 5/5/0.5 | AUTOMATIC_GENERAL 을 파트쌍 접촉으로 분해 · bbox 여유 |
  | `simulation_params.ensure_single_surface` | bool | false | SINGLE_SURFACE 접촉이 없으면 만든다 |
  | `simulation_params.rigidify_small_dt_threshold` | 실수 | 0 | 작은 dt 요소 강체화 |
  | `simulation_params.rigidify_max_aspect_ratio / rigidify_element_ids` | 실수 / 배열 | 0 / [] | 종횡비 큰 요소 · 지정 요소 강체화 |
  | `simulation_params.tied_options` | 객체 | {} | Tied 접촉 옵션 (예: ConvertToSegment: true) |
  | `simulation_params.control_timestep / control_hourglass` | 객체 | {} | *CONTROL_TIMESTEP(DT2MS 등) / *CONTROL_HOURGLASS 덮어쓰기 |
  | `simulation_params.dynamic_relaxation` | bool \| 객체 | false | 누적 스텝 사이 DR (nrcyck, drtol, drfctr, drterm) |
  | `simulation_params.dtmin` | 실수 | 1e-10 (DR 이면 0.01) | CONTROL_TERMINATION DTMIN |
  | `simulation_params.non_reflecting_boundary / include_wall_in_general` | bool | false | 바닥판 옵션 |
  | `postprocess.hotspot_clusters (+ hotspot_top_percent·hotspot_distance_factor·hotspot_min_elements·hotspot_max_clusters·hotspot_criterion·hotspot_time_aggregate)` | bool / 수 / 문자 | false | DOE 마다 deep report 에 핫스팟 군집. 기준 7종(von_mises·max_principal·min_principal·max_shear·x/y/z_tension), 시간 집계 3종 (--help postprocess_json) |
  | `postprocess.hotspot_part` | 정수 · 목록 · "12,15" | 전 파트 | 전각도 리포트의 핫스팟 군집을 이 파트로만 |
  | `postprocess.sphere_viewer` | canvas \| plotly | canvas | 전각도 리포트의 핫스팟 3D 인벨롭 뷰어 (plotly 는 호버·범례, 리포트 약 +1.6MB) |

  # 사례 — 피보나치 26 자세 1.5 m 1회 낙하
