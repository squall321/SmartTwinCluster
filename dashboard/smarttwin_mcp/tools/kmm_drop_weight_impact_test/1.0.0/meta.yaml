name: kmm_drop_weight_impact_test
version: 1.0.0
summary: KooMeshModifier DROP_WEIGHT_IMPACT_TEST — 낙추(충격추) 시험 덱 — 구·다단 실린더 충격추를 모델 위 지점에 떨어뜨림
description: |
  낙추(충격추) 시험 덱 — 구·다단 실린더 충격추를 모델 위 지점에 떨어뜨림

  # 언제 쓰나
  - 구나 실린더 충격추로 국부 충격(화면·배면 등)을 주는 해석 덱이 필요할 때
  - 파트 표면 격자점(3X3 등)에 자동 배치해 여러 케이스를 만들 때 (GenerationMode,Part)

  # 옵션 블록 문법 (KooMeshModifier --help DROP_WEIGHT_IMPACT_TEST)
  ```text
  **DropWeightImpactTest,<ID>
  Key,Value
  **EndDropWeightImpactTest
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `LocationX / LocationY` | 실수 리스트 | - | 충격 지점 (케이스별). GenerationMode,Part 면 생략 |
  | `Height` | 실수 리스트 | 0.5 | 충격추 낙하 높이 → 초기 속도 √(2gh) 가 InitialVelocity 에 더해진다 (모델은 OffsetDistance 간격에 놓임). g 는 Gravity 키, 없으면 모델 재질 밀도로 단위계 판정 (ton-mm-s → 9810, kg-m-s → 9.81) |
  | `Gravity` | 실수 | 모델 재질 밀도로 판정 | 자유낙하 g (모델 단위). 재질 밀도 중앙값 < 1e-7 → 9810, 100~1e5 → 9.81. 그 밖(kg-mm-ms·g-cm-s·g-mm-ms 등)은 WARNING 후 옛 추정 → 반드시 지정 |
  | `InitialVelocityX/Y/Z` | 실수 리스트 | 0 | 추가 초기 속도 (케이스별). Height 속도와 합산되므로 둘 다 주면 이중 가산 |
  | `Type` | Sphere\|Cylinder | Sphere | 충격추 형상 |
  | `Dimension` | 실수 리스트 | 0.008 | Sphere: 반지름. Cylinder 5값(2단): r,외곽r,앞높이,뒤높이,뒤r / 7값(3단): r,외곽r,앞높이,중간r,중간높이,뒤r,뒤높이 |
  | `MeshSize` | 실수 | 0.001 | 충격추 요소 크기 |
  | `DimensionDamper` | 실수 리스트 | - | 댐퍼 치수 (있을 때만 댐퍼 생성) |
  | `DensityImpactor / YoungsModulusImpactor / PoissonRatioImpactor` | 실수 | 7.8e-9 / 2.07e5 / 0.3 | 충격추 본체(실린더의 뒤 단) 재질 |
  | `...ImpactorFront / ...ImpactorMid` | 실수 | 본체와 같음 | 실린더 앞 단·중간 단 재질 (Density/YoungsModulus/PoissonRatio 접두) |
  | `MaterialIDImpactor[Front\|Mid]` | 정수 | 0 | 0 이면 새 재질 생성, 아니면 기존 MID 재사용 |
  | `DensityWall / YoungsModulusWall / PoissonRatioWall` | 실수 | - | 바닥 벽 재질 |
  | `WallNumX/Y/Z` | 정수 | 10 | 바닥 벽 분할 수 |
  | `DensityDamper / YoungsModulusDamper / PoissonRatioDamper` | 실수 | - | 댐퍼 재질 |
  | `tFinal` | 실수 | 0 | 종료 시간 |
  | `dt` | 실수 | 1e-6 | d3plot 출력 간격 |
  | `DTMIN` | 실수 | 없음 | CONTROL_TERMINATION DTMIN |
  | `OffsetDistance` | 실수 | 1e-9 | 충격추와 표면 초기 간격 |
  | `GenerationMode` | DampingSpring\|Part | DampingSpring | Part = PartIDs 파트 표면 격자에 자동 배치 |
  | `PartIDs` | 정수 리스트 | [] | GenerationMode,Part 대상 파트 |
  | `LocationMode` | NXM 문자열 | 1X1 | 파트 표면 격자 배치 (예: 3X3 → 9 케이스) |
  | `BoundaryDistance / DistanceMargin / StressWaveVelocity` | 실수 | 0 | 부분 강체화 경계 거리 계산용 |
  | `DynainDynamicRelaxation[Nrcyck\|Tol\|Fctr\|Term]` | 수 | False/0 | 누적 스텝 DR |

  # 사례 — 반지름 4 mm 강구를 150 mm 높이에서 원점에 (mm-ton-s)
  ```text
  *Inputfile
  model.k
  *Mode
  DROP_WEIGHT_IMPACT_TEST,1
  **DropWeightImpactTest,1
  LocationX,0.0
  LocationY,0.0
  Height,150
  InitialVelocityX,0
  InitialVelocityY,0
  InitialVelocityZ,0
  Type,Sphere
  Dimension,4.0
  MeshSize,0.5
  DensityImpactor,7.85e-09
  YoungsModulusImpactor,200000.0
  PoissonRatioImpactor,0.3
  DensityWall,1e-09
  YoungsModulusWall,10000.0
  PoissonRatioWall,0.3
  WallNumX,10
  WallNumY,10
  WallNumZ,10
  tFinal,0.001
  dt,1e-05
  OffsetDistance,0.01
  **EndDropWeightImpactTest
  *End
  ```

  # 사례 — 3단 실린더 충격추 (앞 고무·중간 알루미늄·뒤 강철)
  ```text
  *Inputfile
  model.k
  *Mode
  DROP_WEIGHT_IMPACT_TEST,1
  **DropWeightImpactTest,1
  LocationX,10.0
  LocationY,-5.0
  Height,200
  InitialVelocityX,0
  InitialVelocityY,0
  InitialVelocityZ,0
  Type,Cylinder
  Dimension,4.0,6.0,3.0,5.0,4.0,8.0,20.0
  MeshSize,0.5
  DimensionDamper,0.1,0.1,1.0
  DensityImpactorFront,1.2e-09
  YoungsModulusImpactorFront,50.0
  PoissonRatioImpactorFront,0.45
  DensityImpactorMid,2.7e-09
  YoungsModulusImpactorMid,70000.0
  PoissonRatioImpactorMid,0.33
  DensityImpactor,7.85e-09
  YoungsModulusImpactor,200000.0
  PoissonRatioImpactor,0.3
  DensityWall,1e-09
  YoungsModulusWall,10000.0
  PoissonRatioWall,0.3
  WallNumX,10
  WallNumY,10
  WallNumZ,10
  tFinal,0.002
  dt,2e-05
  OffsetDistance,0.01
  DTMIN,0.01
  **EndDropWeightImpactTest
  *End
  ```
  - 뒤 단(back) 재질은 별도 슬롯이 없고 DensityImpactor/YoungsModulusImpactor/PoissonRatioImpactor 가 뒤 단이다.
  - Dimension 7값 = r,외곽r,앞높이,중간r,중간높이,뒤r,뒤높이.

  # 사례 — 파트 3 표면 3×3 격자에 자동 배치 (9 케이스)
  ```text
  *Inputfile
  model.k
  *Mode
  DROP_WEIGHT_IMPACT_TEST,1
  **DropWeightImpactTest,1
  GenerationMode,Part
  PartIDs,3
  LocationMode,3X3
  Height,150
  InitialVelocityX,0
  InitialVelocityY,0
  InitialVelocityZ,0
  Type,Sphere
  Dimension,4.0
  MeshSize,0.5
  DensityImpactor,7.85e-09
  YoungsModulusImpactor,200000.0
  PoissonRatioImpactor,0.3
  tFinal,0.001
  dt,1e-05
  OffsetDistance,0.01
  **EndDropWeightImpactTest
  *End
  ```

  # 주의
  - 키 이름은 YoungsModulus (s 포함). 옛 예제의 YoungModulus·Density(접미 없음)는 인식되지 않아 기본값이 쓰인다.
  - Type 줄은 Dimension 줄보다 앞에 둘 것 — Dimension 해석이 Type 에 따라 달라진다.
  - 블록 안 빈 줄에서 블록이 끝난다.

  관련 모드: DROP_ATTITUDE

  # MCP 로 부르는 법
  - model_path 를 주면 옵션 파일 `*Inputfile` / `*Mode DROP_WEIGHT_IMPACT_TEST,1` / `**DropWeightImpactTest,1` … `**EndDropWeightImpactTest` 을 만들어 준다.
  - options 의 `키: 값` 과 lines 의 원문 줄이 블록 안에 들어간다(options 먼저).
  - 키는 부분 문자열로 찾는 모드가 많고 모르는 키는 조용히 무시된다 — 위 표의 키 이름을 그대로 쓸 것.
  - 단위는 모델 .k 를 따른다(KooMeshModifier 는 변환하지 않는다).
  - 여러 모드를 한 번에: `kmm_chain`.

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  # 옵션 파일 형식 (요약)
      KooMeshModifier 는 LS-DYNA .k 모델과 옵션 파일(.txt) 하나를 받아 수정된 .k 를 만든다.

        *Inputfile                         다음 줄에 모델 파일명 (옵션 파일 폴더 기준 상대경로)
        model.k
        *RunDirectoryMode,True,Data/Results[,Data/Metadata]   (선택) 결과를 Run_<시각>_<해시>/ 폴더에
        *Info,<모델이름>,<단계>                (선택) 메타데이터
        *Description,<설명>                   (선택)
        *Creator,<이름>,<메일>,<그룹>,<팀>      (선택)
        *PreserveIncludes                    (선택) 다음 줄들 = 원문 그대로 둘 *INCLUDE 파일 패턴
        *Mode                                실행할 모드 목록, 한 줄에 하나 `모드이름,모드ID`
        DROP_ATTITUDE,1
        **DropAttitude,1                     모드별 옵션 블록 — 헤더 뒤 숫자가 *Mode 의 모드ID 와 짝
        Key,Value
        **EndDropAttitude                    `**End` 로 시작하는 줄이면 블록 종료 (**End 만 써도 됨)

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- koomeshmodifier
- kmm
- preprocess
- lsdyna
- drop
- weight
- impact
- test
- impactor
- ball
- cylinder
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 옵션 파일 확인
  args:
    model_path: /data/single/USER/case/model.k
    dry_run: true
    lines: &id001
    - LocationX,0.0
    - LocationY,0.0
    - Height,150
    - InitialVelocityX,0
    - InitialVelocityY,0
    - InitialVelocityZ,0
    - Type,Sphere
    - Dimension,4.0
    - MeshSize,0.5
    - DensityImpactor,7.85e-09
    - YoungsModulusImpactor,200000.0
    - PoissonRatioImpactor,0.3
    - DensityWall,1e-09
    - YoungsModulusWall,10000.0
    - PoissonRatioWall,0.3
    - WallNumX,10
    - WallNumY,10
    - WallNumZ,10
    - tFinal,0.001
    - dt,1e-05
    - OffsetDistance,0.01
- title: 제출하고 5분까지 기다리기
  args:
    model_path: /data/single/USER/case/model.k
    dry_run: false
    lines: *id001
    wait_sec: 300
    slurm:
      cpus_per_task: 4
      mem: 16G
