name: kmm_rigid_drop_endtime
version: 1.0.0
summary: KooMeshModifier RIGID_DROP_ENDTIME — 강체 낙하 사전 해석 — 질량특성·외곽면(OBJ)·볼록 껍질로 각도별 종료 시간(ENDTIM) 표를
  만든다
description: |
  강체 낙하 사전 해석 — 질량특성·외곽면(OBJ)·볼록 껍질로 각도별 종료 시간(ENDTIM) 표를 만든다

  # 언제 쓰나
  - 전각도 낙하 DOE 에서 각도마다 강한 재접촉(슬랩다운)이 끝나는 때에 맞춰 ENDTIM 을 다르게 줄 때 — 하나로 짧게 잡으면 뒤 충격을 놓치고 길게 잡으면 d3plot 이 쌓인다
  - 덱의 질량·무게중심·관성 텐서·주축·외곽면(OBJ)·볼록 껍질이 필요할 때
  - 충돌마다 직전 자세·속도·각속도(충격 조건 DOE 후보)를 뽑을 때

  # 옵션 블록 문법 (KooMeshModifier --help RIGID_DROP_ENDTIME)
  ```text
  **RigidDropEndtime,<ID>
  Height,<낙하 높이 — 덱 길이 단위>
  Fibonacci,<N>  |  AngleFile,<csv>  |  Angle,<이름>,<roll>,<pitch>,<yaw> (여러 줄)  — 셋 가운데 꼭 하나
  Key,Value …
  **EndRigidDropEndtime
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `Height` (필수) | 실수 | - | 낙하 높이, 덱 길이 단위(mm 덱이면 mm). 없거나 0 이하면 rc 1 |
  | `Fibonacci` | 정수 N | - | 실제 낙하 방향 공간에 고르게 퍼진 N 방향(피보나치 나선). 이름 P0001… |
  | `AngleFile` | csv 경로 | - | name,roll,pitch,yaw(도) 줄 — 머리 줄은 있어도 없어도 된다. 작업 폴더 기준 상대 경로 가능 |
  | `Angle` | 이름,roll,pitch,yaw | - | 한 줄에 각도 하나(여러 줄). DROP_ATTITUDE EulerRolling/Pitching/Yawing 과 같은 뜻 |
  | `Restitution` | e 목록 | 0.1,0.3,0.5 | 반발계수마다 돌려 가장 긴 tFinal 을 표에 쓴다 |
  | `Friction` | 실수 | 0.5 | 마찰계수 μ |
  | `PresimGravity` | 0\|1 | 0 | 0 = 중력 끔(DROP_ATTITUDE 덱과 같음 — 2차 묶음 뒤에도 이어 돌려, 접근 속도가 PresimStrongContact·v0 이상인 마지막 재접촉 묶음까지 ENDTIM 에 담는다), 1 = 켬(v132 규칙 — 첫 재접촉 묶음까지, 무게중심이 1 mm 넘게 떴다 닿은 재착지는 2차 충격으로 세지 않는다) |
  | `PresimStrongContact` | 실수(v0 배수) | 0.2 | 중력 끔(PresimGravity 0)의 ENDTIM 문턱. 사전 해석은 2차 묶음 뒤에도 이어 돌고, ENDTIM = 접근 속도가 이 값·v0 이상인 마지막 재접촉 묶음의 끝 + MarginMs 다(그런 묶음이 없으면 1차 묶음 끝 + MarginMs). 묶음 세기는 묶음 안 접촉점 접근 속도의 최대 ÷ v0 다. 낮추면 더 약한 재접촉까지 담는다. 기본 0.2 — 0.3 이면 사전 해석 마찰이 FEM 과 어긋날 때(0.5 표·실제 0.2) 1차 충돌만큼 센 재접촉을 놓쳐 0.2 로 낮췄다. 0 이하·숫자 아님은 rc 1. PresimGravity 1 이면 무시한다(첫 재접촉 규칙 — 직접 주면 '[RigidDropEndtime] WARNING PresimStrongContact ignored with PresimGravity 1' 한 줄) |
  | `MarginMs` | 실수 | 1.0 | tFinal = (중력 끔은 PresimStrongContact 문턱을 넘는 마지막 재접촉 묶음 끝, 중력 켬은 2차 충격 끝 — 없으면 1차 충돌 끝) + 여유 ms |
  | `ExcludePart` | PID 목록 | 없음 | 강체에서 뺄 파트(바닥판 등). 절점 10% 이상이 병진 SPC 로 묶인 파트·병진 구속 *MAT_RIGID 파트는 저절로 빠진다. 읽은 파트·*PART_INERTIA·CNRB 에 없는 PID 는 rc 1 |
  | `Units` | mm-t-s\|mm-kg-ms\|mm-g-ms\|m-kg-s | 자동 | 덱 단위계. 없으면 재질 밀도 중앙값으로 정하고, 못 정하면 rc 1 |
  | `Workers` | 정수 | min(8, CPU) | 사전 해석 프로세스 수(fork) |
  | `PresimDt` | 실수(s) | 1e-5 | PyBullet 시간 간격 |
  | `PresimTMax` | 실수(s) | 1.0 | 한 경우 최대 시뮬 시간 |

  # 사례 — MinimumModel 1.5 m, 피보나치 100 방향
  ```text
  *Inputfile
  MinimumModel.k
  *Mode
  RIGID_DROP_ENDTIME,1
  **RigidDropEndtime,1
  Height,1500
  Fibonacci,100
  **EndRigidDropEndtime
  *End
  ```
  - 결과(작업 폴더): MinimumModel_rigidbody.json · _surface.obj · _hull.obj · _endtime.csv · _impacts.csv. 기본 .k 는 쓰지 않는다.
  - 표를 DROP_ATTITUDE 에 EndTimeTable,MinimumModel_endtime.csv 로 주면 각도마다 ENDTIM 이 그 값이 된다.

  # 사례 — 각도 직접, 중력 켬·바닥판 제외·단위 지정
  ```text
  *Inputfile
  drop_model.k
  *Mode
  RIGID_DROP_ENDTIME,2
  **RigidDropEndtime,2
  Height,1000
  Angle,FACE,0,0,0
  Angle,EDGE45,45,0,0
  Angle,CORNER,35.26,45,0
  Restitution,0.3,0.5
  Friction,0.3
  PresimGravity,1
  MarginMs,2
  ExcludePart,900
  Units,mm-t-s
  Workers,4
  **EndRigidDropEndtime
  *End
  ```
  - ExcludePart 900 은 덱에 바닥판 파트가 있을 때 — SPC 로 묶인 바닥판은 이 줄 없이도 빠진다.

  # 주의
  - 산출은 모두 작업 폴더(KMM 둘째 인자, 없으면 현재 폴더)에 쓴다 — *Inputfile 이 다른 폴더의 절대 경로여도 덱 옆에는 리더의 _dump.k 만 생긴다. 기본 .k 는 쓰지 않는다.
  - <모델>_endtime.csv: 각도마다 class·t1_end·t2_start·t2_end·tfinal_ms·endtim(덱 시간 단위, 0.1 ms 올림)·reach(덱 길이 — 첫 충돌의 바닥 위 접촉점에서 센 접촉들까지 가장 먼 거리)·n_unresolved·strong_end_ms(ENDTIM 을 정한 마지막 강한 재접촉 묶음의 끝, ms — 그런 묶음이 없거나 중력 켬이면 빈칸)·strong_vn_max(재접촉 묶음 세기의 최대, v0 배수 — 재접촉이 없거나 중력 켬이면 빈칸)·governing_e(ENDTIM 을 정한 e — e 별 칸이 없는 위 칸들은 이 e 의 값)·e 별 세부(strong_end_ms_e<e> 포함). 메타에 v0(√(2gh), 덱 단위)·t_sep_ms(1.0)·endtime_rule(중력 끔 last_strong, 켬 first_recontact)·strong_contact(중력 끔만) 가 있다. DROP_ATTITUDE 의 EndTimeTable 이 그대로 읽고 v0 를 자기 높이·g 와, reach 를 메시 바닥판 크기와 대조한다.
  - 2차 충격(class·t2_* 칸): 1차 충돌 묶음 뒤 1 ms 이상 떨어졌다 다시 닿은 첫 묶음. 묶음은 모두 1 ms(t_sep_ms) 간격으로 끊는다. 중력 끔은 남은 회전으로 문턱을 넘는 접촉이 더 올 수 없으면 멈추므로, 그 뒤의 약한 재접촉은 이 칸에도 없을 수 있다.
  - <모델>_impacts.csv: (각도, e, 충돌 묶음 k) 마다 충돌 직전 자세(att_*)·바닥 좌표 속도·각속도·첫 접촉점·접근 속도·tfinal_k_ms·endtim_k — 덱 단위(길이 · 길이/시간 · rad/시간). 중력 끔은 2차 묶음 뒤에도 이어 돌므로 k ≥ 3 줄도 나온다.
  - 중력 기본값 0: DROP_ATTITUDE 덱은 초기 속도만 있고 중력이 없다. 그래서 다시 닿는 충격은 모두 회전으로 온 것이다. 사전 해석은 2차 묶음 뒤에도 이어 돌고, ENDTIM 은 접근 속도가 PresimStrongContact·v0(기본 0.2) 이상인 마지막 재접촉 묶음의 끝 + MarginMs 다 — 꼭짓점마다 갈라져 오는 슬랩다운 뒷부분을 담고, 오래 돈 뒤의 약한 스침은 뺀다(v133). PresimGravity,1 이면 v132 규칙(첫 재접촉 묶음 끝)이고, 무게중심이 1 mm 넘게 떴다 닿은 재착지는 2차 충격으로 세지 않는다.
  - 단위: Height 는 덱 길이 단위, endtim 은 덱 시간 단위(mm-t-s·m-kg-s 는 s, mm-kg-ms·mm-g-ms 는 ms). 사전 해석 안은 SI 다.
  - 바닥판 자동 제외: 절점의 10% 이상이 병진 *BOUNDARY_SPC 로 묶인 파트, 병진 구속(CMO/CON1)이 있는 *MAT_RIGID 파트. 10% 미만이면 기기 파트로 넣고 SPC_ON_DEVICE_PART 경고. 저절로 뺀 파트가 넣은 파트와 절점을 나누면 rc 1(ExcludePart 로 직접 줄 것). 뺀 파트는 모두 EXCLUDED_PART 경고(이유·질량·몫)와 DONE 줄 excluded=[…] 에 남는다.
  - 볼록 껍질 꼭짓점은 131,072 개까지(pybullet 한도) — 넘으면 rc 1.
  - Workers 만큼 fork 프로세스를 쓴다(작업자마다 PyBullet DIRECT). 2만 각도 × e 3 개는 8 프로세스로 약 6분이다(MinimumModel, 중력 끔 v133 규칙·문턱 0.2 — 2차 묶음 뒤에도 이어 돌아 v132 규칙의 약 5분보다 20% 남짓 길다).
  - 이 모드 블록은 빈 줄·`$`·`#` 줄을 건너뛴다. 키는 이름 전체가 같을 때만 맞고 모르는 키는 rc 1(did you mean …). 틀린 값·Height 없음·각도 출처 0 개 또는 2 개 이상·없는 AngleFile·블록 끝줄(**EndRigidDropEndtime) 전에 '*' 줄은 덱을 읽기 전에 rc 1('RIGID_DROP_ENDTIME option error', 끝줄이 빠지면 'missing **EndRigidDropEndtime').
  - 혼자만 돈다: *Mode 에 다른 모드가 있거나 이 모드가 두 번이면 rc 1('[RIGID_DROP_ENDTIME] must run alone') — 기본 .k 를 쓰지 않으므로 다른 모드 결과가 사라지고, DROP_ATTITUDE 뒤면 그 바닥판까지 기기 질량으로 센다. KooChainRun 도 혼자 돌린다.
  - 덱을 읽은 뒤 rc 1: 요소가 있는데 밀도가 없는 파트, 없는 ExcludePart PID, KMM 이 읽지 않고 남긴 *INCLUDE(*PreserveIncludes·IGA) 에 요소가 있음(PASSTHROUGH_INCLUDE_PARTS). 시작할 때 작업 폴더의 지난 <모델>_* 산출 다섯 개를 지운다.
  - 리더가 요소를 버리면(예: *PART_INERTIA 파트) 표는 써도 rc 3 이다 — '[RIGID_DROP_ENDTIME] tables were written, but the reader dropped elements' 줄: 질량특성·껍질·종료 시간에 그 파트가 빠졌을 수 있다.
  - 로그 표지: [RigidDropEndtime] START·REMOVED·WROTE·DONE(rule=…)·WARNING PresimStrongContact ignored …, [RigidBody] UNITS·EXCLUDE·WARNING(EXCLUDED_PART·SPC_ON_DEVICE_PART …), [presim] 진행. 사전 해석 실패는 'RIGID_DROP_ENDTIME failed' (rc 1).

  관련 모드: DROP_ATTITUDE

  # MCP 로 부르는 법
  - model_path 를 주면 옵션 파일 `*Inputfile` / `*Mode RIGID_DROP_ENDTIME,1` / `**RigidDropEndtime,1` … `**EndRigidDropEndtime` 을 만들어 준다.
  - options 의 `키: 값` 과 lines 의 원문 줄이 블록 안에 들어간다(options 먼저).
  - 키는 부분 문자열로 찾는 모드가 많고 모르는 키는 조용히 무시된다 — 위 표의 키 이름을 그대로 쓸 것.
  - 단위는 모델 .k 를 따른다(KooMeshModifier 는 변환하지 않는다).
  - 여러 모드를 한 번에: `kmm_chain`.

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.
  - 이 설명은 카탈로그를 만든 정본 판 기준이다(판은 COVERAGE.md·stmc_specs.json). 헤드·노드 이미지가 그보다 낮으면
    새 키·모드·플래그가 없어 잡이 rc 1 로 끝날 수 있다 — `image_version_check` 로 깔린 판을 볼 것.

  # 옵션 파일 형식 (요약)
      KooMeshModifier 는 LS-DYNA .k 모델과 옵션 파일(.txt) 하나를 받아 수정된 .k 를 만든다.

        *Inputfile                         다음 줄에 모델 파일명 (옵션 파일 폴더 기준 상대경로)
        model.k
        *RunDirectoryMode,True,Data/Results[,Data/Metadata]   (선택) 결과를 Run_<시각>_<해시>/ 폴더에
        *Info,<모델이름>,<단계>                (선택) 메타데이터
        *Description,<설명>                   (선택)
        *Creator,<이름>,<메일>,<그룹>,<팀>      (선택)
        *PreserveIncludes                    (선택) 다음 줄들 = 원문 그대로 둘 *INCLUDE 파일 패턴
        *Mode                                실행할 모드 목록, 한 줄에 하나 `모드이름,모드ID`
        DROP_ATTITUDE,1
        **DropAttitude,1                     모드별 옵션 블록 — 헤더 뒤 숫자가 *Mode 의 모드ID 와 짝
        Key,Value
        **EndDropAttitude                    `**End` 로 시작하는 줄이면 블록 종료 (**End 만 써도 됨)

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- koomeshmodifier
- kmm
