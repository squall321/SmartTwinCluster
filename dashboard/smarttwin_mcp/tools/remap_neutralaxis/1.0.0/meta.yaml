name: remap_neutralaxis
version: 1.0.0
summary: KooRemapper neutralaxis — 적층 단면의 EI 가중 중립축·굽힘강성 계산 (읽기 전용 보고).
description: |
  적층 단면의 EI 가중 중립축·굽힘강성 계산 (읽기 전용 보고).

  Report the EI-weighted neutral axis of a layered cross-section. One layer = one *PART: solid thickness is measured from the mesh extent along the chosen axis, shell thickness is read from *SECTION_SHELL. Prints a per-layer table (thickness, center, E, E*t), the geometric mid-plane, the neutral axis z_n = sum(E*t*z)/sum(E*t), the stack extent, and the bending stiffness per unit width D = sum(E*(t^3/12 + t*d^2)). Parts whose thickness or Young's modulus cannot be read are excluded and reported, never treated as zero; if no layer is usable the command exits non-zero instead of printing a meaningless number. Read-only: no output file is written.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `mesh_file` | file | 예 | Input mesh file (K-file format) containing the layered stack |
  | `axis` | enum |  | Stacking direction (default z, matching shellmap/restack conventions) |

  # 주의
  - shellmap treats axis=0 of the flat deck as the neutral plane and uses that coordinate as the normal offset. This op measures that assumption: it prints the offset of the neutral axis from axis=0 and warns when axis=0 falls outside the stack, or lies more than half the total thickness away from the neutral axis. *MAT_VISCOELASTIC field 2 is BULK, not E — the reader converts (E = 9KG/(3K+G)) but registers nothing when GI = 0, in which case that part is listed as excluded rather than counted as zero stiffness.

  사례 메모: Reads stack.k and prints the per-layer table plus the EI-weighted neutral axis; add axis=x for a stack built along x

  # MCP 로 부르는 법
  - 인자는 `KooRemapper neutralaxis` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- inspect
- neutralaxis
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    mesh_file: stack.k
    dry_run: true
    extra_inputs: &id001
    - /data/single/USER/case/stack.k
- title: 제출하고 5분까지 기다리기
  args:
    mesh_file: stack.k
    dry_run: false
    extra_inputs: *id001
    wait_sec: 300
