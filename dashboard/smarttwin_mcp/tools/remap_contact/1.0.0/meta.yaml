name: remap_contact
version: 1.0.0
summary: KooRemapper contact — Analyze, create, modify, convert, remove, or auto-detect contact definitions
  (*CONTACT_*, *SET_SEGMENT, *SET_PART, *SET_NODE keywords)
description: |
  Analyze, create, modify, convert, remove, or auto-detect contact definitions (*CONTACT_*, *SET_SEGMENT, *SET_PART, *SET_NODE keywords)

  LS-DYNA contact management operation supporting: analyze (read-only report), create (new contacts from parts/segments), convert (SSTYP transformation), modify (friction/optional cards), remove (delete), and detect (auto-find contact pairs via spatial hashing). All actions specified as YAML list under contacts[] key. Each action processes optional Cards A-G (SOFT, SOFSCL, LCIDAB, MAXPAR, SBOPT, DEPTH, BSORT, FRCFRQ, PENMAX, THKOPT, SHLTHK, SNLOG, ISYM, I2D3D, SLDTHK, SLDSTF, IGAP, IGNORE, DPRFAC, DTSTIF, EDGEK, FLANGL, CID_RCF, Q2TRI, DTPCHK, SFNBR, FNLSCL, DNLSCL, TCSO, TIEDID, SHLEDG, SHAREC, CPARM8, IPBACK, SRNDE, FRICSF, ICOR, FTORQ, REGION, PSTIFF, IGNROFF, FSTOL, D2BINR/2DBINR, SSFTYP, SWTPR, TETFAC, SHLOFF). create also supports thermal (K/FRAD/H0/CHLM…) and tiebreak (OPTION/NFLS/SFLS/CT2CN…) special cards via type tied_thermal / tiebreak.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `config` | config | 예 | 전체 YAML 설정 객체 |

  # config 키 (YAML)
  - `None` (string): Path to LS-DYNA keyword file (.k) to read. Resolved relative to YAML directory if not absolute.
  - `None` (string): Path to write modified model. Required for create/modify/remove/detect actions; not needed for analyze-only.
  - `None` (array): List of contact actions. Each item is a dictionary with action and action-specific keys.
  - `None` (enum): Action type. analyze: report existing contacts (no output required). create: generate new contacts. convert: transform existing contact SSTYP. modify: change friction and optional cards. remove: delete contact by index. detect: auto-find contacting surfaces.
  - `None` (string): Contact type for action: create. Short names (standalone `contact`): auto/automatic -> AUTOMATIC_SURFACE_TO_SURFACE, tied -> TIED_SURFACE_TO_SURFACE, tied_thermal/thermal -> TIED_SURFACE_TO_SURFACE_THERMAL, tiebreak -> AUTOMATIC_SURFACE_TO_SURFACE_TIEBREAK, mortar -> AUTOMATIC_SURFACE_TO_SURFACE_MORTAR, tied_mortar -> TIED_SURFACE_TO_SURFACE_MORTAR, single -> AUTOMATIC_SINGLE_SURFACE, eroding -> ERODING_SURFACE_TO_SURFACE, forming -> FORMING_SURFACE_TO_SURFACE. Omitting the key gives AUTOMATIC_SURFACE_TO_SURFACE (it no longer writes a nameless *CONTACT_). Any other value is uppercased and written as *CONTACT_<VALUE> as-is, so full LS-DYNA keywords work: automatic_nodes_to_surface, automatic_general, forming_one_way_surface_to_surface, tied_shell_edge_to_surface, ... . If the value is not in KooRemapper's known-keyword list the run still succeeds (rc=0) but prints "[contact] create: type '<value>' is not a known contact keyword — writing *CONTACT_<VALUE> as-is". The card body is always Cards 1-2 plus the optional THERMAL/TIEBREAK card, so a keyword needing a different card layout will be rejected by LS-DYNA, not by KooRemapper.
  - `None` (string): Contact title for create action. If empty, auto-generated as 'Contact_N'.
  - `None` (object): Slave side definition for create/detect. Inline format: {pid: int, pids: [int,...], as_segment: bool, facing: bool}. Multiline: nested keys. pid=direct PID (SSTYP=3); pids=SET_PART (SSTYP=2); as_segment=extract surface to SET_SEGMENT (SSTYP=0). facing=filter to mutually facing segments only.
  - `None` (integer): Single part ID for slave side. When as_segment=false (default), uses SSTYP=3 (direct PID). When as_segment=true, extracts mesh surface to SET_SEGMENT (SSTYP=0). Requires pid > 0.
  - `None` (array): List of part IDs for slave side (SET_PART). Creates SSTYP=2. Overrides pid if both given. Both an inline list (`pids: [1, 2]`) and a block list (`pids:` then `- 1` / `- 2` on the following lines) are read and produce the same deck; the block form used to be ignored, leaving no *SET_PART behind.
  - `None` (boolean): If true, extract outer surface from solid/shell elements of pid to SET_SEGMENT (SSTYP=0). Requires mesh parsing and pid > 0.
  - `None` (boolean): If true with as_segment=true and both slave/master have facing=true, apply facing filter: only extract segments that are mutually facing toward the other side (using spatial hash detection with tolerance/normal_angle). Filters out back/side faces.
  - `None` (object): Master side definition (same structure as slave). For AUTOMATIC_SINGLE_SURFACE, master is unused and set to 0.
  - `None` (integer): Single part ID for master side. See contacts[].slave.pid.
  - `None` (array): List of part IDs for master side. See contacts[].slave.pids. Both an inline list (`pids: [1, 2]`) and a block list (`pids:` then `- 1` / `- 2` on the following lines) are read and produce the same deck; the block form used to be ignored, leaving no *SET_PART behind.
  - `None` (boolean): Extract master surface to SET_SEGMENT. See contacts[].slave.as_segment.
  - `None` (boolean): Apply facing filter to master (same logic as slave). See contacts[].slave.facing.
  - `None` (integer): Zero-based index into existing contacts list. Required for convert/modify/remove actions to identify which contact to transform/edit/delete.
  - `None` (enum): For convert action only. Convert slave side to SET_SEGMENT (SSTYP=0). Works if original is SSTYP=3 (direct PID) or SSTYP=2 (SET_PART).
  - `None` (enum): For convert action only. Convert master side to SET_SEGMENT (SSTYP=0). Same as contacts[].slave_to.
  - `None` (boolean): For convert action only. If true and both slave_to=segment and master_to=segment, apply facing filter during conversion: detect only mutually facing segment pairs and create filtered SET_SEGMENTs.
  - `None` (number): Static friction coefficient (Card 2, FS field). Default 0.0 if not set. Range typically 0.0-1.0+. Internally uses -1 sentinel (not set).
  - `None` (number): Dynamic friction coefficient (Card 2, FD field). Optional, applied if set. Internally uses -1 sentinel (not set).
  - `None` (number): Decay coefficient (Card 2, DC field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Viscous friction coefficient (Card 2, VC field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Viscous decay coefficient (Card 2, VDC field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Penetration check flag (Card 2, PENCHK field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Bias tangential friction (Card 2, BT field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Dynamic increase (Card 2, DT field). Optional; stored/printed as scientific notation. Internally uses -1 sentinel (not set).
  - `None` (number): Slave friction scale A (Card 3, SFSA field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Slave friction scale B (Card 3, SFSB field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Slave area scale (Card 3, SAST field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Slave bias stiffness (Card 3, SBST field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Slave friction scale A thermal (Card 3, SFSAT field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Slave friction scale B thermal (Card 3, SFSBT field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Failure slide (Card 3, FSF field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Viscous scale factor (Card 3, VSF field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Contact constraint type (Card A, SOFT field). Values: 0=penalty, 1=constraint, 2=soft. Internally uses -1 sentinel (not set). Triggers Card A output when set.
  - `None` (number): Soft constraint scale (Card A, SOFSCL field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Load curve ID for contact angle (Card A, LCIDAB field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Maximum parameter (Card A, MAXPAR field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Segment based option (Card A, SBOPT field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Search depth (Card A, DEPTH field). Range 0-45; controls spatial search volume for contact candidate detection. Internally uses -1 sentinel (not set).
  - `None` (integer): Box sort option (Card A, BSORT field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Friction frequency (Card A, FRCFRQ field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Maximum penetration (Card B, PENMAX field). Triggers Card B output when set. Internally uses -1 sentinel (not set).
  - `None` (integer): Thickness option (Card B, THKOPT field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Shell thickness (Card B, SHLTHK field). Values 0/1; if 1, accounts for shell thickness in contact. Internally uses -1 sentinel (not set).
  - `None` (integer): Slave node log (Card B, SNLOG field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Symmetry (Card B, ISYM field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): 2D/3D option (Card B, I2D3D field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Solid thickness (Card B, SLDTHK field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Solid stiffness (Card B, SLDSTF field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Initial gap (Card C, IGAP field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Ignore option (Card C, IGNORE field). Optional. YAML key is 'ignore' (not 'ignore_'). Internally uses -1 sentinel (not set).
  - `None` (number): Damping ratio factor (Card C, DPRFAC field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Damping time stiffness (Card C, DTSTIF field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Edge stiffness (Card C, EDGEK field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Flange angle (Card C, FLANGL field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Curve ID for radial correction (Card C, CID_RCF field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Quad-to-tri conversion (Card D, Q2TRI field). Optional; triggers Card D output. Internally uses -1 sentinel (not set).
  - `None` (number): Timestep penalty check (Card D, DTPCHK field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Slave face neighbor (Card D, SFNBR field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Face normal scale (Card D, FNLSCL field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Deformed normal scale (Card D, DNLSCL field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Tied contact option (Card D, TCSO field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Tied contact ID (Card D, TIEDID field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Shell edge option (Card D, SHLEDG field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Shared edge (Card E, SHAREC field). Optional; triggers Card E output. Internally uses -1 sentinel (not set).
  - `None` (integer): Contact parameter 8 (Card E, CPARM8 field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Initial penetration back (Card E, IPBACK field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Round edge (Card E, SRNDE field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Friction scale factor (Card E, FRICSF field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Icor (Card E, ICOR field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Friction torque (Card E, FTORQ field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Region (Card E, REGION field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Penalty stiffness (Card F, PSTIFF field). Optional; triggers Card F output. Internally uses -1 sentinel (not set).
  - `None` (integer): Ignore offset (Card F, IGNROFF field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Friction tolerance (Card F, FSTOL field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): 2D bin resolution (Card F, 2DBINR field). Aliases: d2binr or 2dbinr. Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Surface friction type (Card F, SSFTYP field). Optional. Internally uses -1 sentinel (not set).
  - `None` (integer): Surface wrap type (Card F, SWTPR field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Tetra factor (Card F, TETFAC field). Optional. Internally uses -1 sentinel (not set).
  - `None` (number): Shell offset (Card G, SHLOFF field). Optional; triggers Card G output (and all prior cards A-F). Internally uses -1 sentinel (not set).
  - `None` (integer): Slave box ID (Card 1 extended, SBOXID field). Optional; only modified in create/modify/detect actions if >= 0.
  - `None` (integer): Master box ID (Card 1 extended, MBOXID field). Optional; only modified in create/modify/detect actions if >= 0.
  - `None` (integer): Slave property (Card 1 extended, SPR field). Optional; only modified in create/modify/detect actions if >= 0.
  - `None` (integer): Master property (Card 1 extended, MPR field). Optional; only modified in create/modify/detect actions if >= 0.
  - `None` (enum): For detect action only. If scope=all, perform global all-pairs contact detection across all non-excluded parts. targetPids = counterPids = all non-excluded parts.
  - `None` (array): For detect action only. Part name keyword filter (case-insensitive substring match). Parts matching any keyword are targets; all non-excluded parts are counters. Can be inline list [kw1, kw2] or bare string. Mutually exclusive with scope=all.
  - `None` (array): For detect action only. Part name keywords to exclude (case-insensitive substring match). Any part matching any keyword is skipped entirely (removed from both target and counter sets).
  - `None` (number): Gap tolerance for detect action (distance units). Controls spatial hash grid size and narrowphase distance threshold. Lower = stricter but slower.
  - `None` (number): Maximum angle (degrees) between surface normals for facing filter. Faces with |normal.dot(other_normal)| < cos(angle) are rejected. Lower = more aligned faces only.
  - `None` (boolean): For detect action only. If true, automatically create *CONTACT_* definitions for each detected pair. If false, only extract SET_SEGMENTs and report, no contacts created.
  - `None` (string): For detect action only. Prefix for auto-generated contact titles. Title format: {title_prefix}_{PartName_A}_{PartName_B}. Empty string disables prefix.
  - `None` (string): For action: detect only (used when auto_create=true). Default 'auto'. Unlike contacts[].type this is a CLOSED whitelist: only the short names auto, automatic, tied, tied_thermal, thermal, tiebreak, mortar, tied_mortar, single, eroding, forming are accepted (case-insensitive; an empty value is allowed too). A full LS-DYNA keyword that contacts[].type would happily write — automatic_surface_to_surface, automatic_nodes_to_surface, ... — is REJECTED here with rc=1: "[ERROR] [contact] unsupported contact_type '<value>' (allowed: auto, tied, tied_thermal, tiebreak, mortar, tied_mortar, single, eroding, forming)". Note the printed 'allowed' list omits automatic and thermal, which are in fact accepted. So detect does NOT share type's value space — use a short name here, and spell full keywords out only in create's type.
  - `None` (enum): For detect action only. Skip (don't create) contact pair if existing contact already covers it. Mode: tied=only skip if TIED contact exists; all=skip if any contact exists. Empty (default)=create all.
  - `None` (boolean): For detect action only. If true, remove segments from detected faces that are already in existing TIED contacts for same PID pair. Creates contact from remaining (non-tied) segments. Ignored if no existing tied contact found.
  - `None` (number): THERMAL card K (thermal conductivity of gas in gap). create with tied_thermal type.
  - `None` (number): THERMAL card FRAD (radiation factor). Optional.
  - `None` (number): THERMAL card H0 (heat transfer conductance for closed gap). Optional.
  - `None` (number): THERMAL card LMIN (min gap for conduction). Optional.
  - `None` (number): THERMAL card LMAX (max gap for conduction). Optional.
  - `None` (number): THERMAL card CHLM (characteristic length multiplier, default 1.0).
  - `None` (integer): THERMAL card BC_FLAG (thermal boundary condition flag). Optional.
  - `None` (integer): THERMAL card ALGO (thermal contact algorithm). Optional.
  - `None` (integer): TIEBREAK card OPTION (tiebreak model, e.g. 1=quadratic NFLS/SFLS). create with tiebreak type.
  - `None` (number): TIEBREAK card NFLS (normal failure stress). Bond releases above this.
  - `None` (number): TIEBREAK card SFLS (shear failure stress).
  - `None` (number): TIEBREAK card PARAM (option-dependent parameter, e.g. crit. distance/energy).
  - `None` (number): TIEBREAK card ERATEN (normal energy release rate). Optional.
  - `None` (number): TIEBREAK card ERATES (shear energy release rate). Optional.
  - `None` (number): TIEBREAK card CT2CN (tensile-to-normal stiffness ratio, default 1.0).

  # 프리셋
  ```json
  [
   {
    "name": "contact_type: auto",
    "summary": "AUTOMATIC_SURFACE_TO_SURFACE (default); uses both slave and master sides"
   },
   {
    "name": "contact_type: tied",
    "summary": "TIED_SURFACE_TO_SURFACE; constrains slave nodes to master surface"
   },
   {
    "name": "contact_type: mortar",
    "summary": "AUTOMATIC_SURFACE_TO_SURFACE_MORTAR; higher-order contact with mortar method"
   },
   {
    "name": "contact_type: tied_mortar",
    "summary": "TIED_SURFACE_TO_SURFACE_MORTAR; tied contact with mortar enforcement"
   },
   {
    "name": "contact_type: single",
    "summary": "AUTOMATIC_SINGLE_SURFACE; self-contact (master side unused)"
   },
   {
    "name": "contact_type: eroding",
    "summary": "ERODING_SURFACE_TO_SURFACE; contacts erode when elements fail"
   },
   {
    "name": "contact_type: forming",
    "summary": "FORMING_SURFACE_TO_SURFACE; specialized for sheet metal forming analysis"
   }
  ]
  ```

  # 주의
  - CRITICAL GOTCHAS: (1) Card ordering: If any optional card is set, all prior cards must also be included in output (Card G requires A-F, Card F requires A-E, etc.). Parser enforces this via hasCardA/hasCardB flags. (2) SSTYP: 0=SET_SEGMENT, 2=SET_PART, 3=direct PID. PID > 0 defaults to SSTYP=3; as_segment=true forces extraction to SSTYP=0. (3) Facing filter: requires BOTH slave.facing=true AND master.facing=true on same side, or both slave_to and master_to specified in convert with facing=true. Alone, it's ignored. (4) Surface extraction (as_segment): requires mesh parsing; if empty surface detected, warning issued and contact skipped. (5) Contact index: zero-based; refers to existing *CONTACT_* in model ordered as parsed. Actions execute sequentially; index refers to state at that moment. (6) Single surface types (AUTOMATIC_SINGLE_SURFACE): master side forced to 0. (7) Field sentinels: -1 for ints, -1.0 for doubles means 'not set'. Only fields >= 0 are written. (8) Default friction=0.0 only if friction key omitted; explicit friction: -1 is treated as not set. (9) Inline vs multiline slave/master: inline {pid: 1, as_segment: true} parsed via bracket detection; multiline nested keys parsed separately. (10) D2BINR field: accepts both 'd2binr' and '2dbinr' keys (11) exclude/include: substring match on part.name, case-insensitive; applied before scope (all parts except excluded are candidates). (12) Detect multi-mode: if scope=all or include present, use automatic mode (spatial all-pairs); else use explicit PID mode (slave/master pids required). (13) subtract_existing: only affects detect action, only when auto_create=true, and only removes tied-type contact segments; non-tied contacts are ignored."

  YAML INPUT — COMMON RULES:
  ---
  - A leading UTF-8 BOM is ignored, so a config saved by a Windows editor (Notepad) works as-is.
  - A TAB used for INDENTATION anywhere in the file is rejected with rc=1 — `[ERROR] [<op>] YAML 들여쓰기에 탭을 쓸 수 없습니다 (공백을 쓰세요): <n>번째 줄: <line>`. The whole file is scanned, so a tab under a key this op never reads fails too; configs that used to run with rc=0 can now fail. Tabs inside a quoted value are kept, but a tab that starts a line inside a `|`/`>` literal block (material_card, czm_material_card, material_cards) is rejected, because the parser would otherwise drop that card line silently.
  - The tab scan is skipped when the config arrives on a stream that cannot be rewound (pipe, process substitution, /dev/stdin); such input reaches the parser unchecked.
  - RELATIVE PATHS: a path given on the COMMAND LINE is relative to the current working directory. A relative path INSIDE the YAML — with or without a folder part (`box.k` and `../data/box.k` alike) — is relative to the folder that holds that YAML file, and never falls back to the working directory. Absolute paths (leading `/` or `\`, or an `X:` drive letter) are used as-is.

  사례 메모: This example shows analyze (report existing contacts), create (direct part IDs), and detect (auto-find contacting surfaces across all parts)

  # MCP 로 부르는 법
  - 인자는 `KooRemapper contact` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- bc
- contact
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    config: &id001
      model: model.k
      output: result.k
      contacts:
      - action: analyze
      - action: create
        type: automatic_surface_to_surface
        slave:
          pid: 1
        master:
          pid: 2
        friction: 0.3
        soft: 2
        title: Contact_1
      - action: detect
        scope: all
        tolerance: 0.1
        auto_create: true
        contact_type: auto
        friction: 0.15
    dry_run: true
    extra_inputs: &id002
    - /data/single/USER/case/model.k
    - /data/single/USER/case/result.k
- title: 제출하고 5분까지 기다리기
  args:
    config: *id001
    dry_run: false
    extra_inputs: *id002
    wait_sec: 300
