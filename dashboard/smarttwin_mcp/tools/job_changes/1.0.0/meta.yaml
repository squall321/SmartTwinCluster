name: job_changes
version: 1.0.0
summary: 내 잡 가운데 상태가 바뀐 것 목록 — 커서 뒤에 끝나거나(completed·failed·cancelled) 시작되거나 대기에 든 잡을 시간순으로.
description: |
  호출자(PAT)의 잡을 Slurm(sacct) 상태로 보고, 커서 뒤에 상태가 바뀐 잡을 시간순으로 돌려준다.
  게이트웨이 이벤트 허브가 이 도구를 주기적으로 불러 잡 끝을 이벤트로 받는다(R1). 사람이 「끝난 거 있어?」 를 물을 때도 쓴다.

  # 돌려주는 꼴
  `{events: [{kind: "job_state", registry_id, tool, work_dir, state, slurm_states, changed_at}], count, truncated, next_cursor}`
  - state 는 job_status 의 state 와 같은 낱말(queued·running·completed·failed·cancelled·unknown).
  - changed_at — 끝난 잡은 끝난 시각, 도는 잡은 시작 시각, 대기 잡은 제출 시각(잡이 여럿이면 가장 늦은 것).
  - 다음 호출에 next_cursor 를 그대로 넘기면 그 뒤만 온다. 같은 시각의 잡은 registry_id 로 이어진다.
  - limit(기본 50, 최대 200)을 넘으면 truncated: true — 이어 부를 것.

  # 형제 도구
  - 잡 하나의 자세한 상태·각도별 목록은 job_status(runs: true), 내 잡 전체 목록은 my_jobs.
tags: [jobs, events, changes, status, mode-own]
aliases: [changes, job_events]
transport: {kind: local, shell: /bin/bash, timeout_sec: 60}
expose: direct
read_only: true
examples:
  - title: 최근 24시간에 바뀐 내 잡
    args: {}
  - title: 앞 응답의 next_cursor 뒤만
    args: {cursor: "2026-11-27T09:00:00#123", limit: 100}
