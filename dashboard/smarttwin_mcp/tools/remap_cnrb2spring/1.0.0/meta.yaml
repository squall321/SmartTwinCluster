transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    model: two_plate_bolt.k
    output: two_plate_bolt_spring.k
    axis: z
    gap: 0.1
    k_engage: 100000.0
    k_axial: 10000000.0
    k_rot: 10000000.0
    curve_range: 1.0
    target_pids: &id001
    - 1201
    node_id_start: 90000001
    elem_id_start: 9900001
    card_id_start: 990001
    pid_refs: strict
    dry_run: true
    extra_inputs: &id002
    - /data/single/USER/case/two_plate_bolt.k
- title: 제출하고 5분까지 기다리기
  args:
    model: two_plate_bolt.k
    output: two_plate_bolt_spring.k
    axis: z
    gap: 0.1
    k_engage: 100000.0
    k_axial: 10000000.0
    k_rot: 10000000.0
    curve_range: 1.0
    target_pids: *id001
    node_id_start: 90000001
    elem_id_start: 9900001
    card_id_start: 990001
    pid_refs: strict
    dry_run: false
    extra_inputs: *id002
    wait_sec: 300
