name: remap_cnrb2spring
version: 1.0.0
summary: KooRemapper cnrb2spring — CNRB 체결점을 두 강체 + 유격 discrete beam 조인트로 분할
description: |
  CNRB 체결점을 두 강체 + 유격 discrete beam 조인트로 분할

  Splits a *CONSTRAINED_NODAL_RIGID_BODY fastener into two independent rigid bodies (Side A / Side B, determined by element connectivity) linked by ONE zero-length discrete beam (*SECTION_BEAM ELFORM=6 + *MAT_NONLINEAR_ELASTIC_DISCRETE_BEAM) between two phantom nodes placed at the same point. A *DEFINE_COORDINATE_SYSTEM puts the beam's local r axis on the fastener axis, so the local s and t axes carry the free-play curve (zero force within +/-gap, then k_engage) while r carries the near-rigid k_axial, and the three rotational degrees of freedom carry k_rot. The axis split does not depend on the relative displacement magnitude, because a zero-length type-6 beam takes its (r,s,t) triad from the coordinate ID and not from the current N1->N2 direction. The original CNRB and its *SET_NODE_LIST are deleted whole and references to them are reported. Generated cards: *DEFINE_CURVE x2 (x3 when k_rot > 0), *DEFINE_COORDINATE_SYSTEM, *SECTION_BEAM, *MAT_NONLINEAR_ELASTIC_DISCRETE_BEAM, *PART, two phantom *NODE, *SET_NODE_LIST_TITLE x2 and *CONSTRAINED_NODAL_RIGID_BODY_TITLE x2 per joint, *ELEMENT_BEAM x1 per joint.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `model` | file | 예 | 입력 K-파일 (*CONSTRAINED_NODAL_RIGID_BODY 포함) |
  | `output` | output | 예 | 출력 K-파일 |
  | `axis` | enum | 예 | 나사 축 — 빔의 로컬 r 이 된다. r 에 k_axial 이, s·t 에 ±gap 유격 곡선이 붙는다. auto 없음(필수) |
  | `target_pids` | array |  | 변환할 CNRB 의 PID 목록. 생략하면 덱의 모든 CNRB |
  | `gap` | number |  | 반경 유격 ±[mm], 로컬 s·t(전단)에 적용 (가정값) |
  | `k_engage` | number |  | 유격 소진 후 전단 강성 [N/mm] (가정값) |
  | `k_axial` | number |  | 축방향(로컬 r, 나사 헤드 클램핑) 강성 [N/mm] (가정값) |
  | `k_rot` | number |  | 회전 3자유도 강성 [N*mm/rad] (가정값). 0 이면 회전을 풀어 둔다 — 원 CNRB 와 달라진다 |
  | `curve_range` | number |  | 곡선 가로축 반범위 [mm]. gap 보다 커야 한다 |
  | `node_id_start` | integer |  | 팬텀 노드 시작 ID (조인트당 2개, 같은 좌표). 충돌하면 rc=1 |
  | `elem_id_start` | integer |  | *ELEMENT_BEAM 시작 ID (조인트당 1개). 충돌하면 rc=1 |
  | `card_id_start` | integer |  | 곡선·재질·섹션·좌표계·파트·세트 시작 ID. 충돌하면 rc=1 |
  | `pid_refs` | enum |  | 지운 CNRB PID·SET SID 를 가리키던 참조가 남았을 때: strict=rc=1, warn=경고만 |

  # config 키 (YAML)
  - `None` (file): Input K-file containing one or more *CONSTRAINED_NODAL_RIGID_BODY definitions. Relative to the YAML folder.
  - `None` (file): Output K-file path. Relative to the YAML folder. Nothing is written when the run ends with rc=1.
  - `None` (enum): Screw axis. REQUIRED — there is no 'auto'. It becomes the local r axis of the generated *DEFINE_COORDINATE_SYSTEM (local x on this axis), so k_axial acts along it and the other two global axes (local s, t) carry the +/-gap free-play curve. Because the beam is zero length, this split holds for any relative displacement. If the declared axis is not the largest component of centroid(B)-centroid(A), a [WARN] prints dx,dy,dz and the run continues (the engineer decides, the tool only surfaces the typo).
  - `None` (array): PIDs of the CNRBs to convert. Empty/omitted = every CNRB in the deck. A PID listed here that is not a CNRB in the deck is rc=1. For a named target, any rejection (1 or 3+ parts, shared nodes, unsupported set form, DRFLAG/RRFLAG != 0) is rc=1; for an automatically picked CNRB the same case is a [WARN] and a skip.
  - `None` (number): Radial clearance +/- [mm] applied to the two local shear directions (s, t). Must be > 0 and finite. Labeled assumption, not a measurement.
  - `None` (number): Shear stiffness [N/mm] after the clearance is taken up (slope of the LCIDTS/LCIDTT curve outside +/-gap). Must be > 0 and finite.
  - `None` (number): Axial stiffness [N/mm] along the local r axis (screw-head clamping approximation), a linear LCIDTR curve through the origin. Must be > 0 and finite. It also sizes VOL (element mass).
  - `None` (number): Rotational stiffness [N*mm/rad] on all three local rotations (LCIDRR/LCIDRS/LCIDRT), a linear moment-vs-radian curve. The original CNRB constrained rotation, so the default keeps it constrained. k_rot = 0 is allowed and means FREE: the three curve ids are written as 0, no rotational curve is emitted, and a [WARN] says the joint no longer matches the CNRB it replaced. Negative or nan is rc=1. k_rot also sizes INER, so a larger value adds rotational inertia and can shrink the time step.
  - `None` (number): Half-range of the translational curve abscissa [mm]. Must be > gap. MAT_067 extrapolates outside the defined range, so the slopes continue; curve_range > 20*gap is a [WARN] because LS-DYNA re-discretises the curve on a uniform grid, which can smear the flat free-play segment. The rotational curve uses a fixed +/-1.0 rad range (linear, so extrapolation keeps the same slope).
  - `None` (integer): First phantom node id; 2 nodes per joint (one per side), written at the SAME coordinates because MAT_067 assumes a zero-length beam. Checked against the node ids actually used in the deck — a clash is rc=1 naming the clashing ids, never a silent shift. The last assigned id must stay <= 99999999 (I8).
  - `None` (integer): First *ELEMENT_BEAM id; 1 per joint. Checked against every *ELEMENT_* id in the deck (beam ids share a space with *ELEMENT_DISCRETE and *ELEMENT_SEATBELT).
  - `None` (integer): Base id B for the shared cards: curves B (axial), B+1 (shear) and B+2 (rotation, only when k_rot > 0), material B, section B, coordinate system B, the beam part B, and per joint k the two rigid-body parts B+10+2k / B+11+2k with node-set ids of the same numbers (NSID = PID convention; sets, parts, sections, materials, curves and coordinate systems are separate namespaces and are each checked).
  - `None` (enum): Policy for references left pointing at the deleted CNRB PID (scanned by the shared restack/merge dead-reference code) or at the deleted *SET_NODE_LIST SID (scanned by this op). 'strict' (default) reports them and ends with rc=1; 'warn' reports them and ends with rc=0. No other failure can be lowered by this key. Nothing is migrated automatically: splitting one rigid body into two means the tool cannot decide which half should inherit a boundary condition.

  # 주의
  - GOTCHAS & DESIGN NOTES:

  1. **What it does**: one *CONSTRAINED_NODAL_RIGID_BODY (CNRB) fastener is split into TWO independent rigid bodies (Side A / Side B, decided by element connectivity), joined by ONE zero-length discrete beam (*ELEMENT_BEAM + *SECTION_BEAM ELFORM=6 + *MAT_NONLINEAR_ELASTIC_DISCRETE_BEAM / MAT_067) between two phantom nodes that sit at the SAME point. The two local shear directions (s, t) get a free-play (clearance) curve: zero force within +/-gap, then stiffness k_engage. The local axial direction (r) gets a near-rigid linear stiffness k_axial, and the three rotations get k_rot. This reproduces the screw-hole radial clearance that a CNRB (zero play, infinite stiffness) cannot represent, while keeping the rotational constraint the CNRB had.

  2. **Why a discrete beam and not three *ELEMENT_DISCRETE springs**: a discrete spring with VID=0 acts along the CURRENT N1->N2 direction, so three springs built on phantom nodes separated by eps lose their axis separation as soon as the relative displacement exceeds eps — inside a 0.1 mm clearance the axial spring already produced ~5e5 N at 0.05 mm of lateral motion, i.e. the clearance never opened. A zero-length type-6 beam takes its (r, s, t) triad from the coordinate ID in *SECTION_BEAM, not from the node positions, so the separation holds for any displacement. The manual recommends exactly this ("The type 6, 3D beam element, is recommended when orientation is required ... since this option avoids rotational constraints"). eps is gone as a concept; the two phantom nodes are coincident.

  3. **axis is REQUIRED, there is no `auto`**. It selects the local r axis through a generated *DEFINE_COORDINATE_SYSTEM (local x on the fastener axis, so r=axis, s and t are the other two global axes). Guessing the screw axis from the two part centroids is right for stacked plates but wrong for a bracket bolted to a frame side face — it would put k_axial on the shear direction and the clearance curve on the screw axis, producing exactly the opposite deck with rc=0. Instead the tool cross-checks: if the declared axis is not the largest component of centroid(B)-centroid(A), it prints a [WARN] with dx,dy,dz and leaves the decision to you.

  4. **Part detection is by ELEMENT CONNECTIVITY only** — never by name pattern. *ELEMENT_SOLID in the ten-nodes format is TWO lines per element (line 1: eid pid, line 2: 10 node ids); reading it as one line yields node ids read as PIDs. The op parses the raw deck lines itself for this reason.

  5. **Fake node ids in the set**: members of the CNRB's *SET_NODE_LIST that do not exist in *NODE are dropped, and the count is reported with a [WARN]. (Do not filter by \"id <= 100\"; that was one project's observation.)

  6. **NSID = 0 means NSID = PID** (LS-DYNA rule) and is handled.

  7. **Card widths differ per card.** *ELEMENT_BEAM is 8-column fixed width; every other card written here is 10-column. Writing the beam in 10 columns truncates a 7-digit EID and LS-DYNA reports an undefined PID. Only EID PID N1 N2 are written: N3 is read only when SCOOR=2.0 and is optional even then (orientation comes from the CID), and RT1/RR1/RT2/RR2 must stay 0 because a node with a release condition cannot belong to a nodal rigid body — both phantom nodes do. *SECTION_BEAM needs its ELFORM=6 Card 2f (VOL, INER, CID); SCOOR is left blank (=0.0) because a zero-length beam requires |SCOOR| <= 1. MAT_067 needs all three of its cards; the unused damping and preload cards are written as explicit zeros rather than blank lines.

  8. **Curve id 0 means that degree of freedom is FREE, not rigid** (MAT_067: \"For null load curve IDs, no forces are computed\"). k_rot > 0 therefore emits a third *DEFINE_CURVE and puts it on LCIDRR/LCIDRS/LCIDRT; k_rot = 0 leaves those three at 0, which restores the rotational freedom of the old three-spring design and is reported with a [WARN].

  9. **VOL and INER are never 0.** The type-6 beam's translational time step depends on VOL, density and translational stiffness; the rotational one on INER and rotational stiffness. The manual only says \"reasonable non-zero values\", so the op derives them from the stiffnesses and a reference time step DT_REF = 5.0e-7 s: m = k*(DT_REF/2)^2. RO is written as 1.0, so VOL is directly the lumped element mass in tonnes, split over the two phantom nodes; the console prints VOL, INER and the total added mass. Raising k_axial or k_rot raises the added mass accordingly.

  10. **No blank line is emitted between the generated blocks** — *ELEMENT_BEAM reads up to the next '*', and a blank line there becomes an invalid element. ('$' comment lines are safe.)

  11. **The original CNRB and its *SET_NODE_LIST are deleted whole** (not left as an empty part). Cards that pointed at the dead CNRB PID are reported through the shared dead-reference scanner (the same one restack/merge use — so the report wording says \"restack/merge\"; a '$ cnrb2spring:' line is inserted just above it to say so). Cards that pointed at the deleted SET id are reported by this op with the same grade vocabulary (manual / maybe). With pid_refs: strict (default) either one left over ends the run with rc=1; pid_refs: warn lowers only those two to rc=0.

  12. **New ids use fixed ranges** (nodes 90000001+, 2 per joint; elements 9900001+, 1 per joint; cards 990001+) and the op checks them against the ids actually used in the input deck, per namespace (node / element / part / set / section / material / curve / coordinate system). A clash is rc=1 with the clashing ids and the key to change — it never silently shifts. Re-running the op on its own output therefore fails loudly instead of silently duplicating.

  13. **Refused inputs**: a comma free-format data line in *NODE / *ELEMENT_* / *SET_NODE* / *CONSTRAINED_NODAL_RIGID_BODY (this op reads those cards in fixed width only, so a free-format line would silently shift every field); DRFLAG/RRFLAG != 0 (a DOF release cannot be split between two rigid bodies); a CNRB block with more than one data line (_SPC / _INERTIA extra cards); a node set in _GENERATE/_COLUMN form; a set shared by more than one CNRB; a CNRB that joins 1 or 3+ parts, or whose two parts already share nodes. Named in target_pids these are rc=1; found automatically they are [WARN] + skipped. If nothing converts, rc=1 (no silent no-op).

  14. **Quality warnings that do not change rc**: the declared axis is not the largest centroid-difference component; k_rot = 0 with only one joint between a given part pair (the two parts then rotate about that point, unlike the original CNRB); a side with fewer than 3 real nodes; curve_range > 20*gap (LS-DYNA re-discretises the curve on a uniform grid).

  15. **Parameters are a labeled assumption, not measurements.** gap 0.1 mm, k_engage 1.0e5 N/mm, k_axial 1.0e7 N/mm, k_rot 1.0e7 N*mm/rad, curve_range 1.0 mm, and the internal DT_REF 5.0e-7 s behind VOL/INER. When a default is used the console says so.

  16. **Units**: t/mm/s (mm, N, N/mm, N*mm/rad, MPa). Rotational curves are moment vs relative rotation in radians.

  17. **The old `eps` key is accepted but ignored** with a [WARN], because a zero-length beam has no phantom-node offset. Configs written for the three-spring version keep running; they just stop being told something false.

  18. **Not provided on purpose**: axis auto-detection, custom curve points, per-axis gaps, rotational free-play, damping (MAT_067 Card 2) and preload (Card 3), failure (Cards 4/5), finite-length beams (SCOOR +/-2). This op is standalone-only for now; it is not an `assemble` operation type.

  YAML INPUT — COMMON RULES:
  ---
  - A leading UTF-8 BOM is ignored, so a config saved by a Windows editor (Notepad) works as-is.
  - A TAB used for INDENTATION anywhere in the file is rejected with rc=1 — `[ERROR] [<op>] YAML 들여쓰기에 탭을 쓸 수 없습니다 (공백을 쓰세요): <n>번째 줄: <line>`. The whole file is scanned, so a tab under a key this op never reads fails too; configs that used to run with rc=0 can now fail. Tabs inside a quoted value are kept, but a tab that starts a line inside a `|`/`>` literal block (material_card, czm_material_card, material_cards) is rejected, because the parser would otherwise drop that card line silently.
  - The tab scan is skipped when the config arrives on a stream that cannot be rewound (pipe, process substitution, /dev/stdin); such input reaches the parser unchecked.
  - RELATIVE PATHS: a path given on the COMMAND LINE is relative to the current working directory. A relative path INSIDE the YAML — with or without a folder part (`box.k` and `../data/box.k` alike) — is relative to the folder that holds that YAML file, and never falls back to the working directory. Absolute paths (leading `/` or `\`, or an `X:` drive letter) are used as-is.

  사례 메모: 예제 폴더의 two_plate_bolt.k 는 PID 500 하판과 PID 700 상판을 CNRB(PID 1201)로 묶은 모델이다. 실행하면 CNRB 가 사라지고 두 강체 + 제로길이 discrete beam 1개가 생긴다.

  # MCP 로 부르는 법
  - 인자는 `KooRemapper cnrb2spring` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- bc
- cnrb2spring
- generated
