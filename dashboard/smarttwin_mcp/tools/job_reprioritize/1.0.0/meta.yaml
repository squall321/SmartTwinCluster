name: job_reprioritize
version: 1.0.0
summary: KooChainRun reprioritize — 끝난 결과의 위험 방향 근처 대기 DOE 를 먼저 돌게 재배치 (기본은 계획만)
description: |
  전각도 캠페인에서 끝난 deep_report 의 파트별 응력 위험을 보고, 아직 대기 중인 DOE 잡을 위험 방향 근처부터
  실행되게 scontrol top/hold 로 재배치한다(새 잡을 만들지 않는다 — 고정 격자).

  # 세 가지 동작
  - 기본(apply·release_held 없음): 계획만 보여 준다(KooChainRun reprioritize 의 dry-run).
  - apply=true: 실제 재배치. **admin 만** — scontrol top 은 같은 계정·파티션의 큐 순서를 바꾸므로 공유 계정에서는
    다른 사용자 잡과의 순서도 바뀐다. 먼 방향 잡은 hold 되어 **풀어 주기 전까지 돌지 않는다**(캠페인 드라이버도 끝나지 않는다).
  - release_held=true: 이 캠페인의 hold 된 대기 잡을 풀어 준다(소유자 누구나).

  # 안전
  - jobs.json 의 잡 중 큐에 있는 것은 전부 이 캠페인 폴더의 스크립트로 제출된 것이어야 한다. 하나라도 아니면 거절한다
    (jobs.json 은 사용자 폴더에 있어 고칠 수 있다 — 남의 잡을 hold 하지 못하게).
  - scontrol top 은 Slurm 설정 enable_user_top 또는 운영자 권한이 없으면 실패한다(그때 KooChainRun 은 hold 만 건다).
  - registry_id·job_id·work_dir 중 하나. 폴더는 호출자 영역(/data/single/<사용자>/) 안이어야 한다(PAT 필요).
tags: [koochainrun, reprioritize, adaptive, queue, mode-own]
aliases: [reprioritize, adaptive]
transport: {kind: local, shell: /bin/bash, timeout_sec: 300}
expose: catalog
examples:
  - title: 계획만 보기
    args: {registry_id: 42}
  - title: 반경 30° 로 실제 적용(admin)
    args: {registry_id: 42, apply: true, radius_deg: 30}
  - title: hold 된 잡 풀기
    args: {registry_id: 42, release_held: true}
