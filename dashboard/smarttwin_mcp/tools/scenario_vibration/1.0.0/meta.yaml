name: scenario_vibration
version: 1.0.0
summary: KooChainRun VIBRATION — 진동 시나리오 — 하중 곡선 × 파트 계수 (명시·캡별·회로별 DOE)
description: |
  진동 시나리오 — 하중 곡선 × 파트 계수 (명시·캡별·회로별 DOE)

  # 언제 쓰나
  - 부품별 가진 하중 케이스를 만들 때

  # 시나리오 키 (KooChainRun --help VIBRATION)
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `vibration_source.source_type` (필수) | 문자 | - | explicit_factors(1 DOE) \| per_cap(캡마다) \| circuit_group(회로마다) |
  | `vibration_source.direction / load_type / relative_mode` | 문자 | - / Force / Explicit | X\|Y\|Z / Force\|Acceleration |
  | `vibration_source.base_curve` | 객체 | - | {"kind": "inline", "points": [[t, v], ...]} (2점 이상) |
  | `vibration_source.explicit_factors` | [[pid, 계수], ...] | - | explicit_factors 입력 |
  | `vibration_source.per_cap` | {cap_pids, amplitude} | - | per_cap 입력 |
  | `vibration_source.circuit_group.circuits` | {이름: {parts, amplitude}} | - | circuit_group 입력 |

  # 사례 — Z 방향 힘 펄스, 파트 1·2 계수 1.0·0.5
  ```json
  {
    "project_name": "Vib_Explicit",
    "base_dir": "/data/<사용자>/Vib_Explicit",
    "environment": {
      "koomeshmodifier_path": "/data/SmartTwinPreprocessor/bin/KooMeshModifier",
      "koochainrun_path": "/data/SmartTwinPreprocessor/bin/KooChainRun",
      "lsdyna_path": "/opt/ls-dyna/lsdyna_R16.1.1",
      "apptainer_sif": "/opt/apptainers/SmartTwinPreprocessor.sif",
      "apptainer_bind": "/data:/data",
      "lsdyna_apptainer_sif": "/opt/apptainers/LSDynaBasic_aocc420_ompi4.0.5_mpp_s.sif",
      "lsdyna_apptainer_bind": "/data:/data",
      "lsdyna_apptainer_env": {
        "LSTC_LICENSE_SERVER": "192.168.122.1",
        "FI_PROVIDER": "tcp"
      },
      "apptainer_tmpdir": "/data/tmp",
      "ncpu": 8,
      "memory": "16G",
      "partition": "normal",
      "timeout_per_step_seconds": 7200
    },
    "simulation_params": {},
    "scenarios": [
      {
        "scenario_name": "VibZ",
        "template": "model.k",
        "vibration_source": {
          "source_type": "explicit_factors",
          "direction": "Z",
          "load_type": "Force",
          "relative_mode": "Explicit",
          "base_curve": {
            "kind": "inline",
            "points": [
              [
                0,
                0
              ],
              [
                0.0005,
                500
              ],
              [
                0.001,
                0
              ]
            ]
          },
          "explicit_factors": [
            [
              1,
              1.0
            ],
            [
              2,
              0.5
            ]
          ]
        },
        "cumulative": {
          "num_steps": 1,
          "mode_sequence": [
            "VIBRATION"
          ]
        }
      }
    ]
  }
  ```

  # 주의
  - 진동 모드에는 dtmin 이 배선돼 있지 않다.

  # MCP 로 부르는 법
  - 위 첫 사례가 기본 시나리오다. 바꿀 부분만 `scenario` 로 준다(딥머지, 목록은 통째 교체 — scenarios 를 주면 사례의 scenarios 가 통째로 바뀌므로 사례 형식을 그대로 따를 것).
  - environment(경로·SIF·솔버 명령)는 서버가 만든다 — ncpu·memory·time_limit·solver_precision·partition·lstc_license_ip 인자로만 조정한다. 시간 상한(environment.timeout_*_seconds 정수)은 scenario 로 줄 수 있다.
  - 드라이버 잡 하나(1 CPU)가 KooChainRun prepare→submit→자식 잡 대기→collect→(postprocess) 를 돈다. 진행·결과는 job_status·job_collect·job_diagnose·job_postprocess·post_* 도구로.
  - dry_run=true 로 먼저 최종 scenario.json 을 확인할 것(PAT 없이 된다).

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- koochainrun
- scenario
- campaign
- lsdyna
- doe
- vibration
- vib
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 최종 scenario.json 확인
  args:
    model_path: /data/single/USER/case/model.k
    lstc_license_ip: 192.168.122.1
    dry_run: true
- title: 시간·자원을 바꿔 제출
  args:
    model_path: /data/single/USER/case/model.k
    lstc_license_ip: 192.168.122.1
    dry_run: false
    scenario:
      simulation_params:
        tFinal: 0.002
    ncpu: 4
    memory: 8G
