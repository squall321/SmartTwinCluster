name: kam_arraypcb
version: 1.0.0
summary: KooAutomatedModeller ArrayPCB — 어레이(판넬) PCB 형상 생성 — *PCB 와 같은 키, 워피지 파일 지원
description: |
  어레이(판넬) PCB 형상 생성 — *PCB 와 같은 키, 워피지 파일 지원

  # 언제 쓰나
  - 여러 개가 배열된 판넬 PCB 를 한 번에 만들 때

  # 입력 파일 문법 (KooAutomatedModeller --help ArrayPCB)
  ```text
  *ArrayPCB
  키,값 ... (PCB 모드와 같은 키)
  *End
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `FileName` | 파일 | - | ECAD 외곽 피처 파일 |
  | `Location` | x,y,z | - | 배치 위치 |
  | `Rotation` | 정수(도) | - | 회전 |
  | `Mirror` | True\|False | False | 정확히 True 일 때만 미러 |
  | `Layup` | 층 이름... | - | 위→아래 층 이름 목록 |
  | `Thickness` | 실수... | - | 층별 두께 (m). 내부에서 ×1000 → mm |
  | `MaterialFileName` | 파일 | - | 재료 파일 |
  | `PatternFeatures` | 폴더,층이름 | - | 층별 패턴 피처 폴더 (층마다 한 줄) |
  | `SymbolsFolder` | 폴더 | - | ODB++ symbols 폴더 |
  | `Warpage` | None\|파일 | - | None = 평판, 파일 = 워피지 반영 |

  # 사례 — 어레이 PCB + 워피지
  ```text
  *ArrayPCB
  FileName,ArrayFeature.txt
  Location,0.0,0.0,0.0
  Rotation,0
  Mirror,False
  Layup,CUPPGCOMP,PPGT2,CUPPG2
  Thickness,2.0E-05,3.0E-05,1.2E-05
  MaterialFileName,MAT_EM370Z.txt
  PatternFeatures,./steps/array/layers/comp/features,CUPPGCOMP
  SymbolsFolder,symbols
  Warpage,ArrayWarpage.txt
  *End
  ```
  - 실행: KooAutomatedModeller ArrayPCB array.txt

  # 주의
  - 모드 이름은 정확히 ArrayPCB (대소문자 구분).
  - 파일 끝 *End 필수.

  # 명령 형식
      KooAutomatedModeller <모드> <입력파일> [작업폴더|None] [표시 True|False]

        <모드>        PKG | CAPACITOR (=CAP) | PCB | ArrayPCB | PBA | AIRMESH   — 대소문자 구분 (pkg 는 안 됨)
        <입력파일>    작업폴더 기준 상대경로
        [작업폴더]    주면 그 폴더로 이동한 뒤 실행. None 이면 현재 폴더
        [표시]        GUI 표시 여부. 서버에서는 항상 headless 라 무시해도 된다

      공통 규칙
        - 입력 파일은 `키,값` 줄 형식 (AIRMESH 만 JSON). `#` 로 시작하는 줄은 주석.
        - 블록 헤더는 `*` 로 시작 (*Layer, *Capacitor, *PCB, *ODB ...). 키 이름은 대소문자 구분·접두 일치.
        - 파일 끝에 *End 를 둘 것 — PCB/ArrayPCB 파서는 *End 가 없으면 EOF 에서 멈추지 않는다.
        - 모르는 모드 이름·입력 파일 없음·라이선스 게이트·최상위 키워드 오류·Evolver 실패는 종료 코드 1. *Layer 안의 모르는 키는 조용히 무시되므로 로그의 Complete/FAILED 와 산출물도 확인할 것 (AIRMESH 는 항상 0, report.json 의 status 로 판단).
        - 실행 시 등록 IP·사용 기한(2027-12-31)을 확인한다. `Access denied` 면 그 머신에서는 실행되지 않는다 (종료 코드 1). 계산 노드 대역 192.168.122.x 는 허용.

  # 산출물
        PKG       메시 키워드가 없으면 <입력>.step, 첫 *Layer 에 MeshGenerationType 이 있으면 <입력>.k (LS-DYNA)
        CAPACITOR STEP + (MeshSize 계열 키가 있으면) LS-DYNA 메시
        PCB/ArrayPCB  PCB 형상 STEP
        PBA       <입력>_total.step (+ ExportPackage,True 면 패키지별 .txt/STEP 폴더)
        AIRMESH   <prefix>_air.stl / _cavity.stl / _outer_box.stl / _air.msh / _report.json (prefix 기본 = JSON 파일명)

  # MCP 로 부르는 법
  - input_text(입력 본문) 또는 input_path 를 준다. `KooAutomatedModeller ArrayPCB arraypcb_input.txt <work> False` 로 실행된다.
  - 성공 여부는 종료 코드와 로그의 Complete/FAILED, 산출물로 확인한다(AIRMESH 는 report.json 의 status).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooautomatedmodeller
- kam
- preprocess
- geometry
- step
- arraypcb
- array
- panel
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 입력 확인
  args:
    input_text: |
      *ArrayPCB
      FileName,ArrayFeature.txt
      Location,0.0,0.0,0.0
      Rotation,0
      Mirror,False
      Layup,CUPPGCOMP,PPGT2,CUPPG2
      Thickness,2.0E-05,3.0E-05,1.2E-05
      MaterialFileName,MAT_EM370Z.txt
      PatternFeatures,./steps/array/layers/comp/features,CUPPGCOMP
      SymbolsFolder,symbols
      Warpage,ArrayWarpage.txt
      *End
    dry_run: true
- title: 제출하고 10분까지 기다리기
  args:
    input_text: |
      *ArrayPCB
      FileName,ArrayFeature.txt
      Location,0.0,0.0,0.0
      Rotation,0
      Mirror,False
      Layup,CUPPGCOMP,PPGT2,CUPPG2
      Thickness,2.0E-05,3.0E-05,1.2E-05
      MaterialFileName,MAT_EM370Z.txt
      PatternFeatures,./steps/array/layers/comp/features,CUPPGCOMP
      SymbolsFolder,symbols
      Warpage,ArrayWarpage.txt
      *End
    dry_run: false
    wait_sec: 600
