name: kam_airmesh
version: 1.0.0
summary: KooAutomatedModeller AIRMESH — STEP 솔리드 주변 공기 영역을 경계 추종 사면체로 채우고 STL 스킨 추출
description: |
  STEP 솔리드 주변 공기 영역을 경계 추종 사면체로 채우고 STL 스킨 추출

  # 언제 쓰나
  - 하우징·부품 주변 공기(음향·열·유동)용 체적 메시와 경계 STL 이 필요할 때

  # 입력 파일 문법 (KooAutomatedModeller --help AIRMESH)
  ```text
  JSON 파일
  {"airmesh_version": 1, "input_step": "<STEP>", "mesh_size": <h>, ...}
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `airmesh_version` (필수) | 1 | - | 형식 버전 |
  | `input_step` (필수) | 경로 | - | STEP 파일 (JSON 파일 위치 기준) |
  | `mesh_size` (필수) | 실수 | - | 목표 요소 크기 (모델 단위) |
  | `padding` | 실수 \| [x-,x+,y-,y+,z-,z+] | - | 솔리드 bbox 에서 공기 박스까지 여유 |
  | `units` | 문자 | mm | 리포트 표기용 단위 이름 (변환 안 함) |
  | `occ_target_unit` | MM\|M 등 | "" | 지정 시 STEP 을 이 단위로 리스케일 |
  | `solid_selection` | all \| [1-based 인덱스] | all | 빼낼 솔리드. 미선택 솔리드는 공기에 흡수 |
  | `heal` | auto\|on\|off | auto | 형상 치유 |
  | `mesh.algorithm3d / mesh.optimize / mesh.max_estimated_elements` | - | hxt / true / 5e7 | gmsh 세부 |
  | `outputs.prefix / outputs.dir` | 문자 | JSON 파일명 / 작업폴더 | 산출물 이름·폴더 |

  # 사례 — 구·원통 솔리드 주변 15 mm 여유, 4 mm 사면체
  ```text
  {
    "airmesh_version": 1,
    "input_step": "sphere_cyl.stp",
    "mesh_size": 4.0,
    "units": "mm",
    "padding": 15.0
  }
  ```
  - 실행: KooAutomatedModeller AIRMESH airmesh.json <출력폴더>
  - 성공 판정: <prefix>_report.json 의 status 가 ok (종료 코드는 항상 0).
  - 골든 예제: pyKooCAE/Examples/automatedmodeller/airmesh_sphere/

  # 주의
  - 모든 padding 을 0 으로 주면 공기가 0 이라 E_BOOLEAN 으로 실패한다.
  - 미세 형상(ECAD 등)은 mesh_size 가 작으면 요소가 폭증한다 — size_guard 가 막는다.

  # 명령 형식
      KooAutomatedModeller <모드> <입력파일> [작업폴더|None] [표시 True|False]

        <모드>        PKG | CAPACITOR (=CAP) | PCB | ArrayPCB | PBA | AIRMESH   — 대소문자 구분 (pkg 는 안 됨)
        <입력파일>    작업폴더 기준 상대경로
        [작업폴더]    주면 그 폴더로 이동한 뒤 실행. None 이면 현재 폴더
        [표시]        GUI 표시 여부. 서버에서는 항상 headless 라 무시해도 된다

      공통 규칙
        - 입력 파일은 `키,값` 줄 형식 (AIRMESH 만 JSON). `#` 로 시작하는 줄은 주석.
        - 블록 헤더는 `*` 로 시작 (*Layer, *Capacitor, *PCB, *ODB ...). 키 이름은 대소문자 구분·접두 일치.
        - 파일 끝에 *End 를 둘 것 — PCB/ArrayPCB 파서는 *End 가 없으면 EOF 에서 멈추지 않는다.
        - 모르는 모드 이름·입력 파일 없음·라이선스 게이트·최상위 키워드 오류·Evolver 실패는 종료 코드 1. *Layer 안의 모르는 키는 조용히 무시되므로 로그의 Complete/FAILED 와 산출물도 확인할 것 (AIRMESH 는 항상 0, report.json 의 status 로 판단).
        - 실행 시 등록 IP·사용 기한(2027-12-31)을 확인한다. `Access denied` 면 그 머신에서는 실행되지 않는다 (종료 코드 1). 계산 노드 대역 192.168.122.x 는 허용.

  # 산출물
        PKG       메시 키워드가 없으면 <입력>.step, 첫 *Layer 에 MeshGenerationType 이 있으면 <입력>.k (LS-DYNA)
        CAPACITOR STEP + (MeshSize 계열 키가 있으면) LS-DYNA 메시
        PCB/ArrayPCB  PCB 형상 STEP
        PBA       <입력>_total.step (+ ExportPackage,True 면 패키지별 .txt/STEP 폴더)
        AIRMESH   <prefix>_air.stl / _cavity.stl / _outer_box.stl / _air.msh / _report.json (prefix 기본 = JSON 파일명)

  # MCP 로 부르는 법
  - config(JSON 객체) 또는 input_path 를 준다. `KooAutomatedModeller AIRMESH airmesh.json <work> False` 로 실행된다.
  - 성공 여부는 종료 코드와 로그의 Complete/FAILED, 산출물로 확인한다(AIRMESH 는 report.json 의 status).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooautomatedmodeller
- kam
- preprocess
- geometry
- step
- airmesh
- air
- cfd
- stl
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 입력 확인
  args:
    config: &id001
      airmesh_version: 1
      input_step: sphere_cyl.stp
      mesh_size: 4.0
      units: mm
      padding: 15.0
    dry_run: true
- title: 제출하고 10분까지 기다리기
  args:
    config: *id001
    dry_run: false
    wait_sec: 600
