name: post_sphere_report
version: 1.0.0
summary: 전각도 낙하 통합 리포트 — Mollweide 구면 지도·방향별 위험도 (또는 --from-json 재생성)
description: |
  전각도 낙하 통합 리포트 — Mollweide 구면 지도·방향별 위험도 (또는 --from-json 재생성)

  # 명령 도움말 (koo_sphere_report --help)
  ```text
  usage: koo_sphere_report [-h] (--test-dir TEST_DIR | --from-json JSON_FILE)
                           [--output OUTPUT] [--json JSON] [--terminal-only]
                           [--format {html,json,terminal} [{html,json,terminal} ...]]
                           [--yield-stress YIELD_STRESS] [--ts-points TS_POINTS]
                           [--hotspot-part PID[,PID...]]

  KooReport - Full-angle drop simulation analysis report

  options:
    -h, --help            show this help message and exit
    --test-dir TEST_DIR   Path to test directory with analysis_results/ (d3plot
                          mode)
    --from-json JSON_FILE
                          Re-generate report from an existing report.json (no
                          d3plot needed)
    --output, -o OUTPUT   Output HTML file path
    --json JSON           Output JSON file path
    --terminal-only       Print terminal report only, no file output
    --format {html,json,terminal} [{html,json,terminal} ...]
                          Output formats (default: html terminal)
    --yield-stress YIELD_STRESS
                          Material yield stress (MPa) for safety factor
                          calculation
    --ts-points TS_POINTS
                          Time series points per chart (0=auto)
    --hotspot-part PID[,PID...]
                          핫스팟 군집을 이 파트로만 좁힌다 (쉼표 구분). 생략하면 전부 싣는다.
  ```

  # MCP 로 부르는 법
  - target 은 기존 결과(d3plot 이 있는 폴더 등)의 절대경로. 업로드하지 않고 그 자리에서 읽는다 — /data/single/<사용자>/ 아래만 된다(전각도·부분충격 잡의 결과 폴더가 거기 있다).
  - options 의 키는 위 도움말의 --옵션 이름. 값이 객체면 YAML 파일로 만들어 넘긴다.
  - --install-dir·--ua 와 설정의 lsprepost_path 처럼 실행 파일을 고르는 항목은 거절된다(보안).
  - 후처리 SIF(/opt/apptainers/SmartTwinPostprocessor.sif) 안에서 돈다. 큰 캠페인은 slurm.mem·time 을 넉넉히.

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- postprocess
- kood3plot
- report
- d3plot
- post
- sphere
- report
- koo
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 명령 확인
  args:
    dry_run: true
    target: /data/single/USER/case/run1
- title: 제출하고 15분까지 기다리기
  args:
    dry_run: false
    target: /data/single/USER/case/run1
    wait_sec: 900
    slurm:
      cpus_per_task: 8
      mem: 32G
