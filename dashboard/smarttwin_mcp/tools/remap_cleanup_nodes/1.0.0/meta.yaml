name: remap_cleanup_nodes
version: 1.0.0
summary: KooRemapper cleanup-nodes — Report (default) or delete nodes that nothing in the deck references,
  reading each keyword's fields instead of scraping numbers.
description: |
  Report (default) or delete nodes that nothing in the deck references, reading each keyword's fields instead of scraping numbers.

  Finds nodes that no element and no keyword references, reports the classification with the bounding box before and after, and deletes them only when asked. The problem this solves is not finding orphans — it is not being wrong about them. Scraping every integer out of every non-*NODE/non-*ELEMENT line makes every orphan look referenced, because a production deck normally carries an all-node *SET_NODE_LIST that spells out every node ID; measured on a 13.4M-node deck that approach reported all 118,568 orphans as used. So *SET_NODE_* membership is NOT counted as a reference here — those sets are pruned of the deleted nodes instead (LS-DYNA Error 10233 otherwise). The inverse mistake is just as bad: *CONSTRAINED_NODAL_RIGID_BODY points at nodes through NSID, so a card that names a node set keeps that set's members transitively, which is how the 71 CNRB-held nodes in that deck survive. 'Safe' means 'delete only what I understand': every keyword the op does not model is still scanned, and any node it could name is kept and listed in unknown_keyword_kept, so keep_referenced_by is about attribution, not about safety. *INCLUDE files are read for references — not reading them would silently delete nodes the include uses — and mode: safe refuses to write when one could not be opened. Nodes defined inside an *INCLUDE are never deleted, because only the main deck is rewritten. The op proves its own output by reading it back: every node an element references and every node set member must exist, and it exits non-zero if not. Default mode is report, which writes no deck at all.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `model` | file | 예 | Input LS-DYNA K-file (or use 'input' as alternative key name). *INCLUDE files are followed for reference counting. |
  | `output` | output |  | Output K-file. Only written when mode is safe or force; defaults to the input name with a '_clean' suffix. |
  | `mode` | enum |  | report (default) classifies and writes no deck. safe deletes only nodes no understood or unknown keyword could name, and refuses when an *INCLUDE could not be read. force additionally deletes nodes that only an unmodelled keyword named, and counts them in force_deleted_despite_unknown. |
  | `prune_sets` | boolean |  | Remove deleted nodes from *SET_NODE / *SET_NODE_LIST / *SET_NODE_COLUMN member lists. Turning this off leaves set members pointing at nodes that no longer exist, which the read-back verification then reports as a failure. |
  | `verify` | boolean |  | Read the written deck back and confirm every element node reference and every node set member is defined. Non-zero exit if not. |
  | `keep_referenced_by` | array |  | Keyword prefixes (without the leading '*') whose node references are attributed by name in the report and honoured even in mode: force. Keywords left out of this list are still scanned and still keep their nodes — they are just reported as unknown_keyword_kept. |
  | `report` | output |  | Write the classification as JSON: node counts, kept_by per keyword, unknown_keyword_kept, sets_pruned, verify, and bbox_before/bbox_after. |

  # 주의
  - Unknown YAML keys are reported as a warning and ignored (the run continues with the defaults).

  The bbox_before/bbox_after pair is the point of the report, not decoration: on the deck that prompted this op the device was 14.55 mm thick but the *NODE bounding box read 67.50 mm, so the drop plane was built 53 mm away from the device and nothing ever touched it. Deleting the orphans closes that gap, and the two boxes side by side say how much of it was never geometry. Field widths follow the deck: *NODE and *ELEMENT_* cards are read at the width *KEYWORD declares (8, i10=y 10, long=y 20) or the keyword-line suffix ('%', '+', '-') overrides, while *SET_* cards are I10 (I20 under long). Fixed width is read FIRST and whitespace splitting is used only when a field genuinely holds two numbers — an 8-digit node ID fills an 8-wide field exactly, and splitting on whitespace there reads one token instead of eight and deletes every node the element uses. *SET_NODE_LIST_GENERATE ranges are expanded and kept rather than pruned, because keeping only the endpoints would delete the interior of the range and empty the set. *ELEMENT_BEAM, _DISCRETE, _MASS, _SEATBELT and _PLOTEL are read from manual-derived field positions, so a beam's RT1/LOCAL and a seatbelt's SBRID/SLEN are not counted as node references — an orphan whose ID happened to match one of those fields used to be kept forever. Families still not understood are handled by treating every integer except the element ID as a node reference and listing the keyword in element_keywords_opaque — over-keeping, which is the safe direction. Original newlines are preserved through DeckWriter; CRLF stays CRLF. Relative paths in model/output/report resolve against the YAML file's directory.

  사례 메모: 실행 검증된 예제 (입력: cleanup_demo.k — 고아 4개 중 2개는 CNRB 가 세트로 가리켜 남는다)

  # MCP 로 부르는 법
  - 인자는 `KooRemapper cleanup-nodes` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- mesh
- cleanup
- nodes
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    model: cleanup_demo.k
    output: cleanup_demo_clean.k
    mode: safe
    prune_sets: true
    report: cleanup_report.json
    dry_run: true
    extra_inputs: &id001
    - /data/single/USER/case/cleanup_demo.k
- title: 제출하고 5분까지 기다리기
  args:
    model: cleanup_demo.k
    output: cleanup_demo_clean.k
    mode: safe
    prune_sets: true
    report: cleanup_report.json
    dry_run: false
    extra_inputs: *id001
    wait_sec: 300
