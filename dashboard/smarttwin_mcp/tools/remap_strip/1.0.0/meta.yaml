name: remap_strip
version: 1.0.0
summary: KooRemapper strip — Remove specified LS-DYNA keyword blocks from a K-file for debugging and comparison.
description: |
  Remove specified LS-DYNA keyword blocks from a K-file for debugging and comparison.

  Remove specified LS-DYNA keyword blocks (*NODE, *ELEMENT_*, *INITIAL_STRESS_*, etc.) from K-files while preserving control and option keywords. Useful for comparing option/control changes between variants or debugging. Keyword matching is prefix-based with word boundary checking (space, underscore, or end-of-line) to avoid false positives.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `model` | file | 예 | Input LS-DYNA K-file (or use 'input' as alternative key name) |
  | `output` | output |  | Output K-file path. If omitted, defaults to input filename with '_stripped' suffix (e.g., model.k → model_stripped.k) |
  | `keywords` | array | 예 | List of LS-DYNA keywords to strip (e.g., *NODE, *ELEMENT_SOLID, *INITIAL_STRESS_SOLID). Matches are prefix-based: *NODE matches *NODE, *NODE_TITLE, etc. |

  # config 키 (YAML)
  - `None` (file): Input LS-DYNA K-file path. Relative paths are resolved from the YAML file's directory.
  - `None` (file): Alternative alias for 'model' key. Either 'model' or 'input' must be specified.
  - `None` (file): Output K-file path. If omitted, auto-generated by inserting '_stripped' before the input file's extension (e.g., model.k → model_stripped.k). Relative paths are resolved from the YAML file's directory.
  - `None` (array): List of LS-DYNA keyword prefixes to strip. Matching is case-insensitive prefix-based: *NODE matches *NODE, *NODE_TITLE, etc.; *ELEMENT matches *ELEMENT_SOLID, *ELEMENT_SHELL, etc. Word boundary checking ensures *ELEMENT does not match *ELEMENTARYCURVE (next char must be space, underscore, or end-of-line). Each keyword in the list is automatically prefixed with '*' if not already present.

  # 주의
  - Keyword matching uses case-insensitive prefix comparison with mandatory word boundary checking to avoid partial matches (e.g., *ELEMENT will not false-match *ELEMENTARYCURVE). Keywords are automatically converted to uppercase and prefixed with '*' if needed. Empty keywords list returns error. If output is empty/omitted, the parser auto-generates filename using _stripped suffix before the file extension. Output is always written as plain text (one line per input line, preserving LS-DYNA format). Relative paths in model/output/keywords are resolved relative to the YAML file's parent directory, not the current working directory. The 'input' key is an alias for 'model' — either can be used (both read from the same parser code path).

  YAML INPUT — COMMON RULES:
  ---
  - A leading UTF-8 BOM is ignored, so a config saved by a Windows editor (Notepad) works as-is.
  - A TAB used for INDENTATION anywhere in the file is rejected with rc=1 — `[ERROR] [<op>] YAML 들여쓰기에 탭을 쓸 수 없습니다 (공백을 쓰세요): <n>번째 줄: <line>`. The whole file is scanned, so a tab under a key this op never reads fails too; configs that used to run with rc=0 can now fail. Tabs inside a quoted value are kept, but a tab that starts a line inside a `|`/`>` literal block (material_card, czm_material_card, material_cards) is rejected, because the parser would otherwise drop that card line silently.
  - The tab scan is skipped when the config arrives on a stream that cannot be rewound (pipe, process substitution, /dev/stdin); such input reaches the parser unchecked.
  - RELATIVE PATHS: a path given on the COMMAND LINE is relative to the current working directory. A relative path INSIDE the YAML — with or without a folder part (`box.k` and `../data/box.k` alike) — is relative to the folder that holds that YAML file, and never falls back to the working directory. Absolute paths (leading `/` or `\`, or an `X:` drive letter) are used as-is.

  사례 메모: 실행 검증된 예제 (입력: al_box.k)

  # MCP 로 부르는 법
  - 인자는 `KooRemapper strip` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- mesh
- strip
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    model: al_box.k
    output: stripped_output.k
    keywords: &id001
    - '*NODE'
    - '*ELEMENT_SOLID'
    - '*ELEMENT_SHELL'
    - '*INITIAL_STRESS_SOLID'
    - '*INITIAL_STRESS_SHELL'
    dry_run: true
    extra_inputs: &id002
    - /data/single/USER/case/al_box.k
- title: 제출하고 5분까지 기다리기
  args:
    model: al_box.k
    output: stripped_output.k
    keywords: *id001
    dry_run: false
    extra_inputs: *id002
    wait_sec: 300
