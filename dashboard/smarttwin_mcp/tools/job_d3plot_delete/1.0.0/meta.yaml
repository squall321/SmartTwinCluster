name: job_d3plot_delete
version: 1.0.0
summary: KooChainRun d3plot-delete — 관문을 지난 런만 d3plot 삭제(기본 dry_run·허가 필요). 끝 코드 0 지움 · 2 보존 · 1 오류
description: |
  리포트 JSON 완결·필수 추출·삭제 허가·health 를 모두 지난 런만 d3plot 가족 파일을 지운다. 되돌릴 수 없다.
  - dry_run 기본 true — 판정만 한다. 지우려면 dry_run: false.
  - require_clearance 기본 true — runner_config 의 삭제 허가가 없으면 지우지 않는다.
  - 끝 코드 2(보존)는 실패가 아니다 — reasons 에 까닭.
  ⚠ 관문이 필수 추출 항목의 command 를 이 헤드에서 실행할 수 있다.

  # 쓰는 법
  - registry_id·job_id·work_dir 중 하나. 캠페인 폴더는 호출자 영역(/data/single/<사용자>/) 안이어야 한다(PAT 필요).
  ⚠ KooChainRun `d3plot-delete` 은 SmartTwinPreprocessor v141 이상에만 있다. 이 헤드의 KooChainRun 에 명령이 없으면
  실행하지 않고 `koochainrun_outdated` 로 거절한다(운영 헤드가 낮은 판일 수 있다).
tags: [koochainrun, d3plot, delete, storage, gate, mode-own]
transport: {kind: local, shell: /bin/bash, timeout_sec: 1800}
expose: catalog
examples:
  - title: registry_id 로
    args: {"registry_id": 42, "case_key": "Run_20260711_062815_d42360"}
  - title: 관문을 지나면 실제로 지우기
    args: {"registry_id": 42, "case_key": "Run_20260711_062815_d42360", "dry_run": false}
    note: 되돌릴 수 없다. 먼저 dry_run 으로 verdict 를 볼 것. 사용자 확인.
