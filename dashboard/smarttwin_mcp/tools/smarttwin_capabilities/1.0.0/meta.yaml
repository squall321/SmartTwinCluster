name: smarttwin_capabilities
version: 1.0.0
summary: SmartTwin 전처리·후처리로 할 수 있는 것 전체 목록 — 제품·분류·기능·도구 이름 (어떤 도구를 쓸지 모를 때 먼저)
description: |
  SmartTwinPreprocessor(KooMeshModifier·KooAutomatedModeller·KooRemapper·KooChainRun)와
  SmartTwinPostprocessor(KooD3plotReader)의 기능마다 대응하는 카탈로그 도구를 돌려준다.

  - family 로 제품을, query 로 기능 이름·요약·도구 이름을 좁힌다(부분 일치, 한글 가능).
  - 고른 도구는 catalog_describe 로 인자·사례를 보고 catalog_run 으로 실행한다.
    REST 는 GET /smarttwin-api/v1/tools/<도구> · POST /smarttwin-api/v1/tools/<도구>/run.
  - 계산 도구는 dry_run=true 로 먼저 확인할 수 있다(PAT 없이). 제출한 잡의 결과는 tool_result,
    캠페인은 job_status·job_collect 로 본다.
tags: [capabilities, index, smarttwin, help, mode-read-all]
aliases: [capabilities, features]
transport: {kind: local, shell: /bin/bash, timeout_sec: 30}
expose: direct
examples:
  - title: 전체 목록
    args: {}
  - title: 후처리만
    args: {family: SmartTwinPostprocessor}
  - title: 낙하 관련 기능
    args: {query: 낙하}
