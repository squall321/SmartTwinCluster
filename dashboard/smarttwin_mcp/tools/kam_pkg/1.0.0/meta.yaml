name: kam_pkg
version: 1.0.0
summary: KooAutomatedModeller PKG — 적층(Layer) 정의 텍스트로 반도체 패키지 형상(STEP) 또는 LS-DYNA 메시(.k) 생성
description: |
  적층(Layer) 정의 텍스트로 반도체 패키지 형상(STEP) 또는 LS-DYNA 메시(.k) 생성

  # 언제 쓰나
  - 기판·다이·몰드 같은 층과 솔더볼(Cylinder)·패드(Box)를 쌓아 패키지 모델을 만들 때
  - PBA 모드가 내보낸 패키지별 .txt (ExportPackage) 를 개별 모델로 만들 때

  # 입력 파일 문법 (KooAutomatedModeller --help PKG)
  ```text
  [*Translation,x,y,z] [*Rotation,deg] [*Mirror,True|False] [*IsTop,True|False]
  *Layer,<이름>[,Defined|Warped|SolderJointWarped]
  키,값 ...
  *Layer,<다음 층> ...
  [*Material  다음 줄에 재료 파일]
  *End
  ```

  # 키
  | 키 | 형식 | 기본 | 설명 |
  |---|---|---|---|
  | `*Layer` | 이름[,genMode] | Defined | 층 시작. 층은 적은 순서대로 아래에서 위로 쌓인다 |
  | `Location` | x,y[,z] | - | 층 위치. z 를 생략하면 앞 층 위(누적 두께)에 쌓는다 |
  | `Length` | xLen,yLen[,matID] | - | 층 평면 크기 |
  | `Thickness` | 실수 | - | 층 두께 (누적 z 에 더해짐) |
  | `MaterialID` | 정수 | - | 층 재료 ID |
  | `MeshGenerationType` | Solid\|Shell[,Hexa\|Tetra\|ConformalHexa] | 끔 (Hexa) | 있으면 STEP 대신 메시(.k). 판정은 첫 *Layer 기준 |
  | `MeshSizeInPlane` | 실수 | - | 면내 요소 크기 |
  | `NumberofElementinThickness` | 정수 | - | 두께 방향 요소 수 |
  | `NumberofElementinXDirection / YDirection` | 정수 | - | Hexa 면내 분할 수 직접 지정 |
  | `MeshPath` | 폴더 | - | gmsh 중간 파일 폴더 |
  | `ConformalBufferThickness` | 실수 | - | ConformalHexa 인접 층 사이 Tetra 버퍼 두께 |
  | `Cylinder` | x,y,r[,Shell\|Solid\|Composite][,matID] | - | 원통 피처 (솔더볼 등) — 층 안에 여러 줄 |
  | `Box` | x,y,xLen,yLen[,...] | - | 사각 피처. x,y 는 모서리 시작점 (꼭짓점 2쌍 아님) |
  | `SurfaceTension / MisalignmentAngle / SMD / NSMD` | - | - | SolderJoint 층 전용 형상 키 |
  | `*Material` | 다음 줄 = 파일 | - | 재료 정의 파일 (입력 파일과 같은 폴더) |

  # 사례 — 기판 + 다이 2층 STEP (메시 키 없음)
  ```text
  *Translation,0.0,0.0,0.0
  *Rotation,0
  *Mirror,False
  *IsTop,True
  *Layer,Substrate
  Location,0,0,0
  Length,10.0,8.0
  Thickness,0.3
  *Layer,Die
  Location,0,0
  Length,6.0,5.0
  Thickness,0.2
  *End
  ```
  - 실행: KooAutomatedModeller PKG pkg_step.txt → pkg_step.step

  # 사례 — PCB + 몰드 Hexa 메시 → LS-DYNA .k
  ```text
  *Layer,PCB
  Location,0,0,0
  Length,10.0,10.0
  Thickness,0.5
  MeshGenerationType,Solid,Hexa
  MeshPath,PackageMesh
  MeshSizeInPlane,1.0
  NumberofElementinThickness,2
  MaterialID,1
  *Layer,Mold
  Location,0,0
  Length,6.0,6.0
  Thickness,0.4
  MeshGenerationType,Solid,Hexa
  MeshPath,PackageMesh
  MeshSizeInPlane,1.0
  NumberofElementinThickness,2
  MaterialID,2
  *End
  ```
  - 실행: KooAutomatedModeller PKG pkg_mesh.txt → pkg_mesh.k

  # 사례 — PCB + 솔더볼 3개 ConformalHexa (절점 공유 메시)
  ```text
  *Layer,PCB
  Location,0,0,0
  Length,10.0,10.0
  Thickness,0.5
  MeshGenerationType,Solid,ConformalHexa
  MeshSizeInPlane,0.5
  NumberofElementinThickness,3
  MeshPath,./conformal_mesh_output
  *Layer,SolderJoint
  Location,0,0
  Length,6.0,6.0
  Thickness,0.12
  MeshGenerationType,Solid,ConformalHexa
  MeshSizeInPlane,0.3
  NumberofElementinThickness,2
  MeshPath,./conformal_mesh_output
  Cylinder,-2.0,2.0,0.11
  Cylinder,0.0,2.0,0.11
  Cylinder,2.0,2.0,0.11
  *End
  ```
  - ConformalHexa 는 층 경계에서 절점을 공유하도록 통합 메시를 만든다. 볼 수·면내 크기에 따라 .k 가 급격히 커진다.

  # 주의
  - 메시/STEP 분기는 첫 *Layer 의 MeshGenerationType 유무로만 정해진다 — 층마다 섞지 말 것.
  - PKG 메시 출력은 LS-DYNA .k 만 (Nastran/ANSYS/ABAQUS 출력은 꺼져 있음).

  # 명령 형식
      KooAutomatedModeller <모드> <입력파일> [작업폴더|None] [표시 True|False]

        <모드>        PKG | CAPACITOR (=CAP) | PCB | ArrayPCB | PBA | AIRMESH   — 대소문자 구분 (pkg 는 안 됨)
        <입력파일>    작업폴더 기준 상대경로
        [작업폴더]    주면 그 폴더로 이동한 뒤 실행. None 이면 현재 폴더
        [표시]        GUI 표시 여부. 서버에서는 항상 headless 라 무시해도 된다

      공통 규칙
        - 입력 파일은 `키,값` 줄 형식 (AIRMESH 만 JSON). `#` 로 시작하는 줄은 주석.
        - 블록 헤더는 `*` 로 시작 (*Layer, *Capacitor, *PCB, *ODB ...). 키 이름은 대소문자 구분·접두 일치.
        - 파일 끝에 *End 를 둘 것 — PCB/ArrayPCB 파서는 *End 가 없으면 EOF 에서 멈추지 않는다.
        - 모르는 모드 이름·입력 파일 없음·라이선스 게이트·최상위 키워드 오류·Evolver 실패는 종료 코드 1. *Layer 안의 모르는 키는 조용히 무시되므로 로그의 Complete/FAILED 와 산출물도 확인할 것 (AIRMESH 는 항상 0, report.json 의 status 로 판단).
        - 실행 시 등록 IP·사용 기한(2027-12-31)을 확인한다. `Access denied` 면 그 머신에서는 실행되지 않는다 (종료 코드 1). 계산 노드 대역 192.168.122.x 는 허용.

  # 산출물
        PKG       메시 키워드가 없으면 <입력>.step, 첫 *Layer 에 MeshGenerationType 이 있으면 <입력>.k (LS-DYNA)
        CAPACITOR STEP + (MeshSize 계열 키가 있으면) LS-DYNA 메시
        PCB/ArrayPCB  PCB 형상 STEP
        PBA       <입력>_total.step (+ ExportPackage,True 면 패키지별 .txt/STEP 폴더)
        AIRMESH   <prefix>_air.stl / _cavity.stl / _outer_box.stl / _air.msh / _report.json (prefix 기본 = JSON 파일명)

  # MCP 로 부르는 법
  - input_text(입력 본문) 또는 input_path 를 준다. `KooAutomatedModeller PKG pkg_input.txt <work> False` 로 실행된다.
  - 성공 여부는 종료 코드와 로그의 Complete/FAILED, 산출물로 확인한다(AIRMESH 는 report.json 의 status).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooautomatedmodeller
- kam
- preprocess
- geometry
- step
- pkg
- package
- layer
- bga
- conformal
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 입력 확인
  args:
    input_text: |
      *Translation,0.0,0.0,0.0
      *Rotation,0
      *Mirror,False
      *IsTop,True
      *Layer,Substrate
      Location,0,0,0
      Length,10.0,8.0
      Thickness,0.3
      *Layer,Die
      Location,0,0
      Length,6.0,5.0
      Thickness,0.2
      *End
    dry_run: true
- title: 제출하고 10분까지 기다리기
  args:
    input_text: |
      *Translation,0.0,0.0,0.0
      *Rotation,0
      *Mirror,False
      *IsTop,True
      *Layer,Substrate
      Location,0,0,0
      Length,10.0,8.0
      Thickness,0.3
      *Layer,Die
      Location,0,0
      Length,6.0,5.0
      Thickness,0.2
      *End
    dry_run: false
    wait_sec: 600
