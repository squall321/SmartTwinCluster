name: remap_elform
version: 1.0.0
summary: KooRemapper elform — Change element formulation (ELFORM) in LS-DYNA *SECTION_* cards
description: |
  Change element formulation (ELFORM) in LS-DYNA *SECTION_* cards

  Modifies ELFORM (element formulation) parameters in *SECTION_SOLID or *SECTION_SHELL keyword cards. Supports linear-to-linear (ELFORM change only), linear-to-quadratic (element conversion), and quadratic-to-linear (element downgrade) transitions. Target parts can be specified individually or as ranges (e.g., target_pid: 1-5). When target_pid or target_pids is omitted, applies to all parts.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `config` | config | 예 | YAML configuration object containing base_model, output, and operations array with elform operations |

  # config 키 (YAML)
  - `None` (string): Operation type; must be 'elform'
  - `None` (integer): Single part ID to modify (0 or omit = all parts; -1 means use target_pids list)
  - `None` (array): List of part IDs to modify (alternative to target_pid for multiple parts). Expands ranges like '1-5' to [1,2,3,4,5]
  - `None` (string|integer): Target ELFORM value: either numeric (1,2,3,...,17,23,24) or alias string (constant_stress, fully_integrated, tet4, tet10, hex20, belytschko_tsay, fully_integrated_shell, hughes_liu, quad8, tria6). Alias format is case-sensitive. For numeric forms, the type (solid vs shell) is auto-detected from target part elements.

  # 프리셋
  ```json
  [
   {
    "name": "Solid Formulations",
    "summary": "ELFORM values for solid elements (HEX8, TET4, TET10, HEX20); alias strings resolve to specific numeric codes"
   },
   {
    "name": "Shell Formulations",
    "summary": "ELFORM values for shell elements (QUAD4, TRIA4, QUAD8, TRIA6); aliased as belytschko_tsay(2), hughes_liu(1), fully_integrated_shell(16), quad8(23), tria6(24)"
   },
   {
    "name": "Linear-only ELFORM change",
    "summary": "When both source and target are linear (e.g., ELFORM 1→2), only the section card is modified; no element conversion occurs"
   },
   {
    "name": "Linear-to-Quadratic upgrade",
    "summary": "When target is quadratic (17/16/23/24 for tet10/tet10_16/hex20/quad8 or tria6), source linear elements are converted to quadratic by adding mid-edge/mid-face nodes"
   },
   {
    "name": "Quadratic-to-Linear downgrade",
    "summary": "When source has quadratic elements and target is linear, mid-order nodes are removed; element connectivity is reduced (e.g., HEX20→HEX8, TET10→TET4)"
   }
  ]
  ```

  # 주의
  - **Key points:**

  - **target_elform is required** and can be a numeric string or case-sensitive alias. Aliases (e.g., 'tet10', 'fully_integrated', 'quad8') map to specific numeric ELFORM codes defined in the source.

  - **target_pid defaults to 0 (all parts)**. Use target_pid or target_pids to restrict to specific parts. Both cannot be specified simultaneously in typical usage.

  - **Numeric ELFORM 23 is ambiguous** (maps to both HEX20 for solids and QUAD8 for shells). Auto-detection examines the target part's element types (QUAD4 = shell, HEX8/TET4 = solid) to disambiguate.

  - **Three operation modes exist:**
    1. **SAME_ORDER** (default): Both source and target are linear, or both quadratic. Only the *SECTION card's ELFORM field is modified; no mesh connectivity change.
    2. **UPGRADE**: Target is quadratic (ELFORM 16/17/23/24) and source is linear. Triggers full element conversion (adds mid-order nodes via Tet10Convert mechanism).
    3. **DOWNGRADE**: Source has quadratic elements and target is linear. Mid-order nodes are removed from the mesh; element connectivity is simplified.

  - **Alias case sensitivity**: Alias strings are case-sensitive. 'tet10' works; 'Tet10' or 'TET10' will fail with "Unknown ELFORM alias" error.

  - **target_pids list syntax**: Supports comma-separated list, space-separated list, or range notation (e.g., '1-5' expands to [1,2,3,4,5]). YAML list format (- 1 \\n - 2) also accepted.

  - **Element type detection**: The operation auto-determines if a numeric ELFORM is for solids or shells by checking if the target parts contain QUAD4 (shell) vs HEX8/TET4 (solid) elements. If ambiguous or no elements exist, it defaults to solid."

  YAML INPUT — COMMON RULES:
  ---
  - A leading UTF-8 BOM is ignored, so a config saved by a Windows editor (Notepad) works as-is.
  - A TAB used for INDENTATION anywhere in the file is rejected with rc=1 — `[ERROR] [<op>] YAML 들여쓰기에 탭을 쓸 수 없습니다 (공백을 쓰세요): <n>번째 줄: <line>`. The whole file is scanned, so a tab under a key this op never reads fails too; configs that used to run with rc=0 can now fail. Tabs inside a quoted value are kept, but a tab that starts a line inside a `|`/`>` literal block (material_card, czm_material_card, material_cards) is rejected, because the parser would otherwise drop that card line silently.
  - The tab scan is skipped when the config arrives on a stream that cannot be rewound (pipe, process substitution, /dev/stdin); such input reaches the parser unchecked.
  - RELATIVE PATHS: a path given on the COMMAND LINE is relative to the current working directory. A relative path INSIDE the YAML — with or without a folder part (`box.k` and `../data/box.k` alike) — is relative to the folder that holds that YAML file, and never falls back to the working directory. Absolute paths (leading `/` or `\`, or an `X:` drive letter) are used as-is.

  사례 메모: Changes all elements to ELFORM 2 (full integration). Run in examples/elform/ directory.

  # MCP 로 부르는 법
  - 인자는 `KooRemapper elform` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- mesh
- elform
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    config: &id001
      base_model: simple_hex.k
      output: elform_case_a_result
      operations:
      - type: elform
        target_elform: 2
    dry_run: true
    extra_inputs: &id002
    - /data/single/USER/case/simple_hex.k
- title: 제출하고 5분까지 기다리기
  args:
    config: *id001
    dry_run: false
    extra_inputs: *id002
    wait_sec: 300
