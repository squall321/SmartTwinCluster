  # 주의
  - CRITICAL FEATURES & GOTCHAS:

  1. **base_model required**: standalone `assemble` always needs base_model (even with a generate operation).

  2. **Operation Sequencing**: Operations are applied sequentially to the same mesh in-place. Later ops modify results of earlier ones. This enables complex multi-step transformations but requires careful ordering.

  3. **Prestress Accumulation**: All ops that compute stress (replace, squeeze, bend, indent, offset, wrap) accumulate results into a single *INITIAL_STRESS_SOLID block. Duplicate element IDs sum stresses (via std::map keying).

  4. **Material Sourcing**: Global material (E, nu) overrides per-part materials in K-file. For prestress ops without global material, K-file *MAT_ELASTIC is required. For squeeze swelling mode, no material needed.

  5. **Path Resolution**: File paths (base_model, detail_flat, bundle, database, dynain, dat_file, config, etc.) are resolved relative to the config file directory, not CWD — folder-prefixed relative paths such as '../data/box.k' included. `database` (matdb) has one extra step: when nothing sits at the resolved spot and the value is a bare filename with no '/' or '\', KooRemapper falls back to the bundled material DB location and logs '[matdb] WARNING: ... not found - using bundled ...'; a folder-prefixed relative path never falls back and fails with rc=1 '[ERROR] [matdb] ERROR: Cannot load database from: <config dir>/<value>'. Omitting `database` uses the bundled DB, and every load logs the file actually read ('[matdb] Loaded N materials from <path>'). The one remaining CWD-based exception is standalone `map` (bent/flat/output).

  6. **Batch Operations**: Many ops support both target_pid (single) and target_pids (array/loop). Internally, if target_pids is set, the op is applied once per PID (avoiding duplicate application). For ops with neither (like generate), they act globally.

  7. **Strain Modes (squeeze)**: Two mutually exclusive modes—(a) eps_x/y/z = node movement + dynain output, (b) swelling = thermal expansion cards, no node movement, no dynain for that part.

  8. **IGA NURBS**: Targets matching via target_pid (numeric) OR target_name/exclude_name (name pattern). Element size auto-computed if omitted. bbox_scale_r/s/t override uniform bbox_scale per axis.

  9. **Offset Material Cards**: Supports both single material_card (applies to all layers) AND per-layer material_cards array. If both present, material_cards takes precedence. czm_material_card is separate (cohesive interface layers).

  10. **Contact/Boundary/RBE**: These are raw LS-DYNA keyword insertion ops. They parse slave/master part IDs and face selectors but do NOT auto-detect surfaces (unlike standalone contact command). Manual part ID config required.

  11. **Control/Database**: These overwrite or create LS-DYNA control cards. Existing cards are modified in-place (field-by-field); missing cards are inserted before *END.

  12. **Thermal Expansion (swelling)**: When squeeze uses swelling, parser inserts *MAT_ADD_THERMAL_EXPANSION (CTE=swelling value) and *INITIAL_TEMPERATURE_NODE (T=1.0) for all nodes in the part. No dynain output for swelling parts.

  13. **Dynamic Relaxation**: If dynamic_relaxation: true, config.relax settings are read (defined globally, not per-op). Must be configured in global config section.

  14. **Update Operation**: the key is `dynain` (not `dynain_file`). Its path is resolved the same way as base_model: anything that is not absolute (no leading '/' or '\', no 'X:' drive letter) is taken relative to the config YAML directory — a folder-prefixed relative path like 'd/coords.k' included. Useful for applying node coordinate updates from previous analysis results.

  15. **Extract_surface**: Can be spelled 'extract_surface' or 'extract-surface' (parser accepts both, converts to underscore internally).

  16. **ID Auto-Management**: New nodes/elements/parts/materials get unique IDs to avoid collisions with existing entities in base model. This is automatic; users rarely configure.

  YAML INPUT — COMMON RULES:
  ---
  - A leading UTF-8 BOM is ignored, so a config saved by a Windows editor (Notepad) works as-is.
  - A TAB used for INDENTATION anywhere in the file is rejected with rc=1 — `[ERROR] [<op>] YAML 들여쓰기에 탭을 쓸 수 없습니다 (공백을 쓰세요): <n>번째 줄: <line>`. The whole file is scanned, so a tab under a key this op never reads fails too; configs that used to run with rc=0 can now fail. Tabs inside a quoted value are kept, but a tab that starts a line inside a `|`/`>` literal block (material_card, czm_material_card, material_cards) is rejected, because the parser would otherwise drop that card line silently.
  - The tab scan is skipped when the config arrives on a stream that cannot be rewound (pipe, process substitution, /dev/stdin); such input reaches the parser unchecked.
  - RELATIVE PATHS: a path given on the COMMAND LINE is relative to the current working directory. A relative path INSIDE the YAML — with or without a folder part (`box.k` and `../data/box.k` alike) — is relative to the folder that holds that YAML file, and never falls back to the working directory. Absolute paths (leading `/` or `\`, or an `X:` drive letter) are used as-is.
  ELEMENT COUNT CHECK: restack prints a per-part element count table (input -> output) and, before writing, re-reads the output buffer to confirm the counts match what it intended — including parts it never touched, and the total. A mismatch exits 1 and writes nothing. This exists because a field deck once lost a whole part silently and 485 solver runs completed 'normally' on a model with the chip missing.

  INCLUDE CLOSURE (since 2026-10-17): this op edits only the main deck. If its targets live only inside an *INCLUDE it stops with exit code 1 and names flatten_includes; with flatten_includes: true it reads the closure flattened into one standalone deck and writes one file without *INCLUDE (measured: the same output as the unsplit deck). For an all-parts run on a master deck whose own parts are in the main file, the parts inside includes are left alone and a warning says so.

  사례 메모: Real files from examples/assemble/: box.k (input), assemble_example.yaml (config). Output: assembled_box.k, optionally assembled_box.dynain if prestress is computed.

  # MCP 로 부르는 법
  - 인자는 `KooRemapper assemble` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
