examples:
- title: dry_run 으로 argv·config 확인
  args:
    config: &id001
      base_model: box.k
      output: assembled_box
      dynamic_relaxation: false
      dynain_embed: false
      material:
        E: 210000
        nu: 0.3
      operations:
      - type: bend
        target_pid: 1
        plane: xy
        source: formula
        expression: 3.0 * sin(pi * x1 / L1)
    dry_run: true
    extra_inputs: &id002
    - /data/single/USER/case/box.k
- title: 제출하고 5분까지 기다리기
  args:
    config: *id001
    dry_run: false
    extra_inputs: *id002
    wait_sec: 300
