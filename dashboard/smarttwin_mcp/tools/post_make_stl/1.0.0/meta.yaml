name: post_make_stl
version: 1.0.0
summary: d3plot·모델 .k 에서 미리보기 STL 생성 (리포트 실형상 미리보기용)
description: |
  d3plot·모델 .k 에서 미리보기 STL 생성 (리포트 실형상 미리보기용)

  # 명령 도움말 (make_stl --help)
  ```text
  사용: /data/SmartTwinPostprocessor/bin/make_stl <d3plot|model.k> <out_prefix> [target_tris=6000] [voxel_res=128] [parts_csv | device]
  ```

  # MCP 로 부르는 법
  - target 은 기존 결과(d3plot 이 있는 폴더 등)의 절대경로. 업로드하지 않고 그 자리에서 읽는다 — /data/single/<사용자>/ 아래만 된다(전각도·부분충격 잡의 결과 폴더가 거기 있다).
  - options 의 키는 위 도움말의 --옵션 이름. 값이 객체면 YAML 파일로 만들어 넘긴다.
  - --install-dir·--ua 와 설정의 lsprepost_path 처럼 실행 파일을 고르는 항목은 거절된다(보안).
  - 후처리 SIF(/opt/apptainers/SmartTwinPostprocessor.sif) 안에서 돈다. 큰 캠페인은 slurm.mem·time 을 넉넉히.

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- postprocess
- kood3plot
- report
- d3plot
- post
- make
- stl
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 명령 확인
  args:
    dry_run: true
    target: /data/single/USER/case/run1/d3plot
    out_prefix: preview
- title: 제출하고 15분까지 기다리기
  args:
    dry_run: false
    target: /data/single/USER/case/run1/d3plot
    out_prefix: preview
    wait_sec: 900
    slurm:
      cpus_per_task: 8
      mem: 32G
