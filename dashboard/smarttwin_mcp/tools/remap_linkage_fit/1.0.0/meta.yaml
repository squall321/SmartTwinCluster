name: remap_linkage_fit
version: 1.0.0
summary: KooRemapper linkage-fit — 접힌 덱에서 군별 강체변환(축·각·피벗·축이동) 역산 — 피벗 산포를 함께 보고.
description: |
  접힌 덱에서 군별 강체변환(축·각·피벗·축이동) 역산 — 피벗 산포를 함께 보고.

  Recover the rigid-body transform each part underwent between a reference deck and a folded one, then group the parts that share a transform. Both decks must have the same node ids. For every part the optimal rotation is found by Horn's quaternion method (a self-contained Jacobi eigensolve, no external linear algebra), and from it the op reports the rotation axis, the angle, a pivot point on the axis, the axial slide (non-zero means a screw motion, not a plain hinge) and the RMS/max fit residual. A residual large relative to the model size means the part deformed as well as moved, which cannot be reduced to a hinge, and the op says so. Parts are grouped only when the angle, the axis, the pivot AND the axial slide all agree within tolerance, and each group's PIVOT SCATTER is printed; grouping by angle alone silently merges distinct hinges, so the op separately warns, with the number, whenever parts that share an angle have pivots further apart than pivot_tol. Writes <output>.yaml, which `applyfold` reads.

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `reference` | file | 예 | Reference (unfolded) deck (k-file) |
  | `folded` | file | 예 | Folded deck (k-file) with the same node ids as the reference |
  | `output` | string | 예 | Output prefix — writes <output>.yaml for `applyfold` |
  | `angle_tol` | number |  | Angle tolerance in degrees for treating two parts as one group (also applied to the axis direction) |
  | `pivot_tol` | number |  | Length tolerance for the pivot and the axial slide when grouping; also the threshold for the angle-only grouping warning |

  # 주의
  - A pivot is only defined up to its position along the axis — any point on the axis gives the same transform — so the op reports the point whose axial coordinate matches the part's centroid. Compare recovered pivots by their distance to the expected axis line, not by coordinates. Parts with fewer than three nodes are skipped and reported, since three points are the minimum that fix a rigid transform. A part that did not move is reported with angle 0 and its translation.

  사례 메모: Recovers the known transforms of the bundled foldable arm: PID 2 at 45 degrees about z through (30,0,0) and PID 3 and 4 at 90 degrees through (60,0,0), grouped together with zero pivot scatter

  # MCP 로 부르는 법
  - 인자는 `KooRemapper linkage-fit` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- analysis
- linkage
- fit
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    reference: arm_flat.k
    folded: arm_folded.k
    output: fold_groups
    dry_run: true
    extra_inputs: &id001
    - /data/single/USER/case/arm_flat.k
    - /data/single/USER/case/arm_folded.k
- title: 제출하고 5분까지 기다리기
  args:
    reference: arm_flat.k
    folded: arm_folded.k
    output: fold_groups
    dry_run: false
    extra_inputs: *id001
    wait_sec: 300
