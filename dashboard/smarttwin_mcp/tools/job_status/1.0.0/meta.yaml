name: job_status
version: 1.0.0
summary: 잡 진행 상태 확인 (squeue + KooChainRun status).
description: |
  레지스트리에서 잡 찾아서 squeue + KooChainRun status 결과 통합 반환.
  Slurm job별 state(PENDING/RUNNING/COMPLETED/FAILED), output_dir 디스크 진행도 포함.
  응답 slurm_job_ids·sphere_job_id — 이 잡의 Slurm 번호(squeue 가 비어도 무엇을 물었는지 알 수 있다).
  응답 state — 잡 전체를 안정된 낱말 하나로: queued·running·completed·failed·cancelled·unknown.
  (아직 도는 잡이 있으면 running, 대기만 있으면 queued, 모두 끝났으면 cancelled > failed > completed 순.
  끝난 잡은 squeue 에 없어 sacct 로 본다.) slurm_states 는 잡별 Slurm 상태 그대로.
  runs_summary — KooChainRun 캠페인이면 각도(런) 상태 수 {completed, failed, running…}.
  드라이버 잡이 completed 여도 실패한 각도가 있을 수 있다.
  호출자(PAT)의 잡만 — 잡 폴더가 /data/single/<사용자>/ 안이어야 한다.

  # 인자: registry_id 또는 work_dir
  단순 .k 잡(submit_lsdyna_job)도 squeue 부분은 동작 (KooChainRun status는 skip).

  # runs: true — 각도별 목록 (전각도·낙하 시나리오처럼 runner_config 에 doe_angles 가 있는 잡)
  계획된 각도마다 한 줄, doe·step 순. 실패·대기 각도도 빠지지 않는다.
  `{doe, step, mode, case_key, angle{name,roll,pitch,yaw}, run_dir, d3plot, status, error?}`
  - case_key = Run 폴더 이름(Run_<시각>_<해시>), run_dir = <output_dir>/<case_key>. 아직 폴더가 없으면 둘 다 null.
  - d3plot = <run_dir>/Output/d3plot 이 실제로 있을 때만 경로, 없으면 null(가족 파일 d3plot01… 은 같은 폴더).
  - status = KooChainRun simulation_index 값 그대로(running/completed/failed), index 에 없으면 pending. 실패면 error 도.
  - 재시도한 각도는 마지막 시도의 폴더만 나온다(KooChainRun 이 같은 별칭을 덮어쓴다).
  - 각도 DOE 잡이 아니거나 목록을 못 만들면 runs: [] 와 runs_note.
tags: [status, squeue, jobs, monitor, mode-own]
aliases: [status, squeue, check]
transport: {kind: local, shell: /bin/bash, timeout_sec: 30}
expose: direct
read_only: true
examples:
  - title: registry_id로 조회
    args: {registry_id: 42}
  - title: work_dir로 조회
    args: {work_dir: /data/koopark/fullangle_test}
  - title: 각도별 run 폴더·d3plot 경로까지
    args: {registry_id: 42, runs: true}
