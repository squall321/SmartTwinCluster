name: image_version_check
version: 1.0.0
summary: 헤드·표본 노드·NFS 의 SmartTwin Pre/Post 이미지 판을 기대값과 대조해 표로 낸다(읽기 전용).
description: |
  `cluster/utils/image_version_check.sh` 를 그대로 돌려, 그 markdown 표를 행 목록으로 돌려준다.
  아무것도 설치·변경하지 않는다. mode: read-all (§18.2).

  보는 것: 헤드와 표본 노드의 `/opt/apptainers/SmartTwin{Pre,Post}processor.sif` sha256,
  Post SIF 안 `/opt/kood3plot/VERSION`·NFS `/data/SmartTwinPostprocessor/VERSION` 의 Version(KooD3plotReader 커밋),
  Pre SIF 안 KooRemapper BUILD_INFO 의 소스 커밋, KooChainRun.bin sha256(NFS·SIF 안, md5 병기).
  기대값을 주면 행마다 OK·DIFF·ERR, 안 주면 '-'(실제값만).

  # 언제 호출하는가
  - 이미지를 배포한 뒤 헤드·노드·NFS 판이 맞는지 확인할 때
  - 리포트가 이상할 때 노드의 후처리 이미지 판이 헤드와 같은지 볼 때

  # 언제 호출하지 않는가
  - 잡 하나가 어떤 이미지로 돌았는지 → 그 잡의 귀환 매니페스트 `images{}`(output/return_manifest.json)
  - 이미지 배포 → 배포 스크립트(deploy_apptainers.sh --image --sha256) — 이 도구는 쓰지 않는다

  # 반환
  ```json
  {"ok": true, "tool": "image_version_check", "all_ok": true,
   "counts": {"OK": 8, "DIFF": 0, "ERR": 0, "-": 3},
   "rows": [{"where": "헤드 h01", "item": "SmartTwinPreprocessor.sif sha256", "actual": "1c973c25…",
             "expected": "1c973c25", "verdict": "OK"}],
   "summary": "점검: … · 이상 없음", "table": "| 위치 | 항목 | 실제 | 기대 | 판정 |…"}
  ```
  `all_ok` 는 DIFF·ERR 가 없을 때 true. 점검 스크립트를 못 찾거나 표가 나오지 않으면 `ok: false`.
  표본 노드 sha256 은 노드당 수십 초 걸린다 — 빨리 보려면 `node_sha: false`.
tags: [images, apptainer, sif, version, smarttwincluster, observability, mode-read-all]
aliases: [image_check, sif_versions, check_images]
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 900
expose: catalog
examples:
  - title: 기대값 다섯 개로 헤드·NFS·자동 표본 노드 대조(값은 판마다 바꾼다 — 예는 v136·v51)
    args: {expect_pre_sha: "1c973c25", expect_post_sha: "32997e9b", expect_post_version: "226eca7",
           expect_remapper_commit: "e6407dcd", expect_kcr_sha: "35511107"}
  - title: 노드 하나만 빠르게(크기·시각)
    args: {nodes: ["node001"], node_sha: false}
  - title: 기대값 없이 실제 판만 보기
    args: {}
