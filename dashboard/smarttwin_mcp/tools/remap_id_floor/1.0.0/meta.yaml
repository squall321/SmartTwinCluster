name: remap_id_floor
version: 1.0.0
summary: KooRemapper id_floor — Issue the start numbers for a StepForge part fragment (the deck's maxima
  plus one, include closure counted) and optionally check a fragment map's ranges agai
description: |
  Issue the start numbers for a StepForge part fragment (the deck's maxima plus one, include closure counted) and optionally check a fragment map's ranges against them.

  There is no ID band table: numbers are issued when a fragment is requested. The output names the four start numbers exactly like StepForge export_part_fragment's arguments (node_start, elem_start, pid_start, sid_start), so they can be passed straight through. A fragment written from them lies above the deck's maxima and cad_solid_merge_to_deck inserts it without renumbering — the fragment map's numbers are then the deck's numbers. The floor uses the same cursors as assemble, counting the whole *INCLUDE closure; pid_start is one above the largest of PID, SECID and MID because fragments use the same number for all three. With fragment_map, each used range is compared with the floor: above when its low end is at or over the start number, below otherwise (exit code 1 — that fragment would be renumbered on insert). This is the id_floor of the StepForge boundary agreement (Q7: it reads the map's ranges).

  # 인자
  | 이름 | 형식 | 필수 | 설명 |
  |---|---|---|---|
  | `model` | file | 예 | The deck the fragment will go into. Its *INCLUDE closure is read. |
  | `output` | output | 예 | JSON with deck, basis, node_start, elem_start, pid_start, sid_start and, when fragment_map is given, check — above, below or unused for each range (unused when the map's range is null). .json is appended if missing. |
  | `fragment_map` | file |  | Optional StepForge fragment map JSON whose ranges are checked against the floor. |

  # 주의
  - Relative paths resolve against the YAML file's directory. Unknown YAML keys are refused.

  사례 메모: 실행 검증된 예제 (조각 대응표는 StepForge 실물 — 시작 번호 500001/600001/900 이 덱 바닥 13/3/3 위에 있다)

  # MCP 로 부르는 법
  - 인자는 `KooRemapper id_floor` 의 인자 그대로다(kooremapper_core 가 argv·config.yaml 을 만든다).
  - 입력 파일은 절대경로로 주면 같이 올라가고 파일 이름으로 바뀐다. 이름만 쓰려면 extra_inputs 에 절대경로를 둔다.
  - 출력(output 등)은 파일 이름만 — 잡 work/ 폴더에 생긴다.
  - gmsh 필요: 아니오 (SIF 에 포함).

  # 결과 받기
  - 제출 응답의 job_id 로 `tool_result` 를 부르면 상태·rc·산출물 목록·로그 꼬리·작은 텍스트 산출물이 온다.
  - 결과 폴더는 /data/single/<사용자>/<job_name>_<job_id>/ — work/(입력·산출물), stmc_result.json, stmc_stdout.log.
  - 계산은 호출자 권한으로 Slurm 잡 하나로 돈다(backend_5010 경유, SIF 안에서 실행). 실제 제출에는 PAT 가 필요하다.

  생성됨: tools/_gen/generate_smarttwin_tools.py — 직접 고치지 말고 정본을 고친 뒤 다시 생성할 것.
tags:
- kooremapper
- remap
- preprocess
- lsdyna
- mesh
- id
- floor
- generated
- smarttwin
- mode-own
transport:
  kind: local
  shell: /bin/bash
  timeout_sec: 1950
expose: catalog
examples:
- title: dry_run 으로 argv·config 확인
  args:
    model: deck.k
    output: floor.json
    fragment_map: stepforge_fragment.json
    dry_run: true
    extra_inputs: &id001
    - /data/single/USER/case/deck.k
    - /data/single/USER/case/stepforge_fragment.json
- title: 제출하고 5분까지 기다리기
  args:
    model: deck.k
    output: floor.json
    fragment_map: stepforge_fragment.json
    dry_run: false
    extra_inputs: *id001
    wait_sec: 300
