# smarttwin_mcp 컷오버용 /mcp 블록 — mcp-slurm(:5012) → smarttwin_mcp(:5013).
# /etc/nginx/conf.d/hpc-portal.conf 의 기존 `location /mcp {}` 를 이걸로 교체.
# 롤백 = 5013 두 곳을 5012 로 되돌리고 `nginx -s reload` (mcp-slurm.service 는 계속 가동 유지).
    # MCP (SmartTwin) streamable-http — 같은 오리진 /mcp 로 노출. 데몬은 127.0.0.1:5013 loopback 유지(보안).
    # 구버전 폴백: mcp-slurm.service(:5012) 는 계속 가동. 문제 시 아래 5013 → 5012 로 되돌리면 즉시 복구.
    location /mcp {
        proxy_pass http://127.0.0.1:5013;
        proxy_http_version 1.1;
        # FastMCP DNS-rebinding 보호(loopback 바인딩=allowed_hosts 127.0.0.1:*) 만족 위해 Host 를 loopback 으로.
        proxy_set_header Host 127.0.0.1:5013;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
