template:
  id: smarttwin-partial-impact
  name: SmartTwin 전위치 부분충격 (All-Position Partial Impact)
  description: >
    KooChainRun(drop_weight_impact 모드)으로 전위치 부분충격 DOE 를 실행합니다.
    업로드한 모델(.k)의 범위를 자동 인식해 격자(기본 5x5) 위치마다 구형 임팩터
    낙하충격을 시뮬레이션합니다 (KooMeshModifier 가 각 위치의 입력덱을 자동 생성).
    scenario.json 을 직접 업로드하면 격자/간격/LHS 등 임의 구성으로 바꿀 수 있습니다
    (예제: pyKooCAE Examples/drop_weight_impact/scenario_*.json).
    이 잡은 1-CPU 드라이버로, 자식 Slurm 잡들을 제출/관리합니다.
    결과는 /data/single/<사용자>/<잡이름>_<잡ID>/ 에 저장됩니다.
  category: simulation
  version: 1.0.0
  source: official
  tags: [smarttwin, koochainrun, koomeshmodifier, impact, dwi, lsdyna, doe]
  is_public: true

slurm:
  partition: ""        # 클러스터 기본 파티션
  nodes: 1
  ntasks: 1
  cpus_per_task: 2
  mem: 4G
  time: "167:00:00"

apptainer:
  # 드라이버는 NFS 의 KooChainRun 직접 실행, sif 는 scenario.json 내부 지정
  image_selection:
    mode: any
    required: false
  bind: []
  env:
    # 격자 기본값 (scenario_json 업로드 시 무시됨)
    IMPACT_GRID_X: "5"
    IMPACT_GRID_Y: "5"
    IMPACT_MARGIN: "0.9"
    # 임팩터 (Sphere)
    IMPACT_RADIUS: "5.0"
    IMPACT_HEIGHT: "100"
    # 해석 시간
    IMPACT_TFINAL: "0.001"
    IMPACT_DT: "0.000001"
    # KooChainRun submit 자원 (자식 잡)
    CHAIN_NODES: "2"
    CHAIN_JOBS_PER_NODE: "2"
    CHAIN_NCPU: "4"
    CHAIN_POSTPROCESS: "true"

files:
  input_schema:
    required:
      - file_key: model_k
        name: 모델 K 파일
        description: LS-DYNA 입력 모델 (.k/.key) — 충격 위치 격자의 기준 모델
        validation:
          extensions: [.k, .key, .dyn]
          max_size: 500MB
    optional:
      - file_key: scenario_json
        name: scenario.json (선택)
        description: >
          업로드 시 기본 격자 구성 대신 이 시나리오 사용 (spacing/LHS/리스트 등).
          model_file 자리는 업로드한 모델 파일명으로 두면 됨.
        validation:
          extensions: [.json]
          max_size: 1MB

script:
  pre_exec: |
    echo "========================================"
    echo "SmartTwin All-Position Partial Impact (KooChainRun/KooMeshModifier)"
    echo "Job: $SLURM_JOB_NAME ($SLURM_JOB_ID)  User: $WEB_USER"
    echo "Started: $(date)"
    echo "========================================"

    RUN_DIR="$RESULT_DIR"
    mkdir -p "$RUN_DIR" || { echo "ERROR: RUN_DIR 생성 실패: $RUN_DIR (/data/single 권한 확인)"; exit 1; }
    cd "$RUN_DIR"

    cp "$FILE_MODEL_K" ./
    MODEL_FILE=$(basename "$FILE_MODEL_K")
    echo "모델: $MODEL_FILE"

    if [ -n "${FILE_SCENARIO_JSON:-}" ] && [ -f "${FILE_SCENARIO_JSON:-}" ]; then
      cp "$FILE_SCENARIO_JSON" scenario.json
      echo "scenario: 업로드본 사용"
    else
      echo "scenario: 기본 격자(${IMPACT_GRID_X}x${IMPACT_GRID_Y}, margin=$IMPACT_MARGIN) 자동 생성"
      # 검증된 운영 environment 블록(/data/scenario/* 와 동일) + drop_weight_impact 모드
      cat > scenario.json <<SCENARIO_EOF
    {
      "project_name": "${SLURM_JOB_NAME}_${SLURM_JOB_ID}",
      "mode": "drop_weight_impact",
      "model_file": "$MODEL_FILE",
      "output_dir": "output",
      "environment": {
        "koomeshmodifier_path": "/opt/SmartTwinPreprocessor/bin/KooMeshModifier",
        "lsdyna_path": "/opt/ls-dyna/lsdyna_R16.1.1",
        "mpi_path": "mpirun",
        "memory": "2G",
        "lsdyna_memory": "2000m",
        "apptainer_sif": "/opt/apptainers/SmartTwinPreprocessor.sif",
        "apptainer_bind": "/data:/data,/shared:/shared",
        "apptainer_env": {},
        "lsdyna_apptainer_sif": "/opt/apptainers/LSDynaBasic_aocc420_ompi4.0.5_mpp_s.sif",
        "lsdyna_apptainer_bind": "/data:/data,/shared:/shared",
        "lsdyna_apptainer_env": {
          "LSTC_FILE": "/opt/ls-dyna_license/LSTC_FILE",
          "LSTC_LICENSE_SERVER": "%LSTC_LICENSE_SERVER%",
          "FI_PROVIDER": "tcp",
          "I_MPI_FABRICS": "ofi",
          "LD_LIBRARY_PATH": "/opt/openmpi/lib"
        },
        "apptainer_tmpdir": "/data/tmp",
        "nodes_per_job": 1,
        "mpi_launcher": "mpirun",
        "mpi_enabled": true,
        "ncpu": 1,
        "koochainrun_path": "/data/SmartTwinPreprocessor/bin/KooChainRun",
        "time_limit": "24:00:00"
      },
      "simulation_params": {
        "tFinal": $IMPACT_TFINAL,
        "dt": $IMPACT_DT,
        "impactor": {
          "type": "Sphere",
          "radius": $IMPACT_RADIUS,
          "height": $IMPACT_HEIGHT,
          "density": 7850,
          "youngs_modulus": 2.0e11,
          "poisson_ratio": 0.3
        },
        "locations": {
          "mode": "grid",
          "x_count": $IMPACT_GRID_X,
          "y_count": $IMPACT_GRID_Y,
          "margin": $IMPACT_MARGIN
        },
        "generation_mode": "DampingSpring"
      }
    }
    SCENARIO_EOF
    fi
    # 라이선스 서버 플레이스홀더가 start_production 동기화로 안 채워졌으면 차단.
    # (PH 를 변수로 조립 — 이 템플릿 자체가 sed 동기화 대상이라 리터럴로 쓰면 가드도 치환됨)
    PH="%LSTC_LICENSE""_SERVER%"
    if grep -q "$PH" scenario.json; then
      echo "ERROR: LSTC_LICENSE_SERVER 미설정 ($PH 잔존)."
      echo "  → YAML slurm_config.lsdyna_license.server 설정 후 start_production.sh 재실행 필요"
      exit 1
    fi
    echo "--- scenario.json (앞 40줄) ---"
    head -40 scenario.json

  main_exec: |
    cd "$RESULT_DIR"
    KCR=/data/SmartTwinPreprocessor/bin/KooChainRun
    [ -x "$KCR" ] || { echo "ERROR: KooChainRun 없음: $KCR (/data NFS 마운트 확인)"; exit 1; }

    echo "=== KooChainRun prepare ==="
    "$KCR" prepare scenario.json -o runner_config.json || { echo "ERROR: prepare 실패"; exit 1; }

    echo "=== KooChainRun submit (nodes=$CHAIN_NODES jobs/node=$CHAIN_JOBS_PER_NODE ncpu=$CHAIN_NCPU) ==="
    "$KCR" submit runner_config.json \
        --nodes "$CHAIN_NODES" --jobs-per-node "$CHAIN_JOBS_PER_NODE" --ncpu-per-job "$CHAIN_NCPU" \
        || { echo "ERROR: submit 실패 (이 노드에서 sbatch 가능한지 확인)"; "$KCR" diagnose . 2>/dev/null | tail -20; exit 1; }

    sleep 30
    CHILD_NAMES=$(find . -path '*slurm_scripts/*.sh' -exec grep -hoE '^#SBATCH --job-name=\S+' {} + 2>/dev/null \
                  | sed 's/.*=//' | sort -u | paste -sd, -)
    PROJ=$(sed -n 's/.*"project_name"[^"]*"\([^"]*\)".*/\1/p' runner_config.json | head -1)
    echo "자식 잡 이름: ${CHILD_NAMES:-（미발견 — 프로젝트명 '$PROJ' 매칭으로 폴링)}"

    echo "=== 자식 잡 완료 대기 (5분 간격) ==="
    while :; do
      if [ -n "$CHILD_NAMES" ]; then
        ACTIVE=$(squeue -h -n "$CHILD_NAMES" 2>/dev/null | wc -l)
      else
        ACTIVE=$(squeue -h -u "$USER" -o '%j' 2>/dev/null | grep -c -- "$PROJ")
      fi
      [ "${ACTIVE:-0}" -eq 0 ] && break
      echo "[$(date '+%F %T')] 실행/대기 중 자식 잡: $ACTIVE"
      "$KCR" status runner_config.json 2>/dev/null | tail -6
      sleep 300
    done
    echo "=== 자식 잡 전체 종료 ==="

  post_exec: |
    cd "$RESULT_DIR"
    KCR=/data/SmartTwinPreprocessor/bin/KooChainRun

    echo "=== KooChainRun collect ==="
    "$KCR" collect runner_config.json "$RESULT_DIR/collected" \
      || echo "WARN: collect 실패 — 원시 결과는 $RESULT_DIR 내 존재"

    if [ "${CHAIN_POSTPROCESS:-true}" = "true" ]; then
      echo "=== KooChainRun postprocess (--all) ==="
      "$KCR" postprocess runner_config.json --all || echo "WARN: postprocess 실패 (결과는 보존됨)"
    fi

    echo "=== 진단 요약 ==="
    "$KCR" diagnose . 2>/dev/null | tail -20 || true

    echo "========================================"
    echo "완료: $(date)"
    echo "결과 위치: $RESULT_DIR"
    echo "========================================"
